name: TEST1 Candidate QA Runner

on:
  push:
    branches:
      - wip/test1-field-fixes-qa-runner
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  candidate-regressions:
    name: Candidate vanilla structures and shoreline flora
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_BRANCH: wip/test1-field-fixes-candidate

    steps:
      - name: Checkout QA source
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Resolve exact candidate SHA
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ENCODED_BRANCH="${TARGET_BRANCH//\//%2F}"
          SHA="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/branches/${ENCODED_BRANCH}" --jq '.commit.sha')"
          test -n "${SHA}"
          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"
          echo "Candidate branch ${TARGET_BRANCH}: ${SHA}"

      - name: Wait for exact candidate build
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          ENCODED_BRANCH="${TARGET_BRANCH//\//%2F}"
          for attempt in $(seq 1 240); do
            DATA="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?branch=${ENCODED_BRANCH}&per_page=20")"
            RUN_ID="$(jq -r --arg sha "${TARGET_SHA}" '.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success") | .id' <<<"${DATA}" | head -n 1)"
            if [ -n "${RUN_ID}" ]; then
              echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"
              echo "Candidate build succeeded: ${RUN_ID} @ ${TARGET_SHA}"
              exit 0
            fi
            TERMINAL="$(jq -r --arg sha "${TARGET_SHA}" '.workflow_runs[] | select(.head_sha == $sha and .status == "completed") | .conclusion' <<<"${DATA}" | head -n 1)"
            if [ -n "${TERMINAL}" ] && [ "${TERMINAL}" != "null" ]; then
              echo "Candidate build ${TARGET_SHA} completed without success: ${TERMINAL}" >&2
              exit 1
            fi
            echo "Waiting for candidate build ${TARGET_SHA} (${attempt}/240)..."
            sleep 10
          done
          echo "Timed out waiting for candidate build ${TARGET_SHA}" >&2
          exit 1

      - name: Download exact candidate artifact
        uses: actions/download-artifact@v5
        with:
          name: NeverFolia-${{ steps.target.outputs.sha }}
          path: candidate-artifact
          github-token: ${{ github.token }}
          run-id: ${{ steps.candidate.outputs.run_id }}

      - name: Verify candidate inputs
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          JAR="$(find candidate-artifact -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          PACK="$(find candidate-artifact -type f -name 'NeverOverworld-Core-*.zip' | sort | head -n 1)"
          test -n "${JAR}"
          test -n "${PACK}"
          grep -F "Git commit: ${TARGET_SHA}" candidate-artifact/BUILD-INFO.txt
          sha256sum "${JAR}" "${PACK}"

      - name: Normalize mansion QA id for Minecraft 26.2
        run: |
          set -euo pipefail
          sed -i 's/minecraft:woodland_mansion/minecraft:mansion/g' ./scripts/probe-never-overworld-vanilla-locate-matrix.sh || true
          sed -i 's/minecraft:woodland_mansion/minecraft:mansion/g' ./scripts/probe-never-overworld-vanilla-field-structures.sh

      - name: Probe flooded vanilla locate availability matrix
        run: |
          set -euo pipefail
          JAR="$(find candidate-artifact -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          PACK="$(find candidate-artifact -type f -name 'NeverOverworld-Core-*.zip' | sort | head -n 1)"
          if [ -f ./scripts/probe-never-overworld-vanilla-locate-matrix.sh ]; then
            chmod +x ./scripts/probe-never-overworld-vanilla-locate-matrix.sh
            ./scripts/probe-never-overworld-vanilla-locate-matrix.sh "${JAR}" "${PACK}"
          fi

      - name: Probe vanilla field structures and locate latency
        if: always()
        run: |
          set -euo pipefail
          JAR="$(find candidate-artifact -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          PACK="$(find candidate-artifact -type f -name 'NeverOverworld-Core-*.zip' | sort | head -n 1)"
          test -n "${JAR}"
          test -n "${PACK}"
          chmod +x ./scripts/probe-never-overworld-vanilla-field-structures.sh
          ./scripts/probe-never-overworld-vanilla-field-structures.sh "${JAR}" "${PACK}"

      - name: Probe positive shoreline flora relocation
        if: always()
        run: |
          set -euo pipefail
          JAR="$(find candidate-artifact -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          PACK="$(find candidate-artifact -type f -name 'NeverOverworld-Core-*.zip' | sort | head -n 1)"
          test -n "${JAR}"
          test -n "${PACK}"
          chmod +x ./scripts/probe-never-overworld-shoreline-flora.sh
          ./scripts/probe-never-overworld-shoreline-flora.sh "${JAR}" "${PACK}"

      - name: Upload QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TEST1-candidate-qa-${{ steps.target.outputs.sha }}
          path: |
            artifacts/NeverOverworld-vanilla-locate-matrix.json
            artifacts/NeverOverworld-vanilla-field-structures.json
            artifacts/NeverOverworld-shoreline-flora.json
            overworld-vanilla-locate-matrix-test/locate-matrix.tsv
            overworld-vanilla-locate-matrix-test/server.log
            overworld-vanilla-field-structures-test/locate-results.tsv
            overworld-vanilla-field-structures-test/server.log
            overworld-shoreline-flora-test/biome-results.tsv
            overworld-shoreline-flora-test/server.log
          if-no-files-found: warn
          retention-days: 30
