name: R3934 structure trace
on:
  push:
    branches: ['diag/neveroverworld-r3934-structure-trace']
    paths:
      - 'qa/field-r3934/**'
      - '.github/workflows/diag-r3934-structure-trace.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: r3934-trace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '25'}

      - name: Download accepted R39.33
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '11137018849'
          run-id: 36805414939
          github-token: '${{ github.token }}'
          path: r3933
          merge-multiple: true

      - name: Prepare candidate and compile classpath
        run: |
          mkdir -p candidate .work/r3933-build/libs artifacts
          cp r3933/server.jar candidate/server.jar
          cp r3933/world/datapacks/NeverOverworld.zip candidate/NeverOverworld.zip
          cp r3933/world/datapacks/NeverNether.zip candidate/NeverNether.zip
          python3 - <<'PY'
          from pathlib import Path
          import os,zipfile
          server=Path('candidate/server.jar')
          libs=Path('.work/r3933-build/libs')
          libs.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(server) as z:
              i=0
              for n in z.namelist():
                  if n.endswith('.jar') and n.startswith(('META-INF/versions/','META-INF/libraries/')):
                      p=libs/(str(i)+'-'+Path(n).name)
                      p.write_bytes(z.read(n));i+=1
          cp=os.pathsep.join(map(str,sorted(libs.glob('*.jar'))))
          Path('.work/r3933-build/classpath.txt').write_text(cp)
          print('classpath jars',i)
          PY

      - name: Trace exact problematic area
        run: |
          set -o pipefail
          python3 qa/field-r3934/trace.py 2>&1 | tee artifacts/r3934-trace-command.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R3934-STRUCTURE-TRACE-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
