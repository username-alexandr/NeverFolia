name: R3919 effective resource stack
on:
  push:
    branches: ['diag/r3919-effective-resource-stack']
    paths: ['scripts/never_resource_stack.py', 'scripts/test_never_resource_stack.py', 'qa/field-r3919/**', '.github/workflows/never-r3919-resource-stack.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r3919-stack-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ordered-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Regression tests for ordered resources and existing content contracts
        run: |
          mkdir -p artifacts
          set -o pipefail
          python3 scripts/test_never_resource_stack.py 2>&1 | tee artifacts/stack-unit-tests.log
          python3 qa/field-r3919/test_marker.py 2>&1 | tee artifacts/stack-marker-and-alias-tests.log
          python3 qa/field-r3915/test_combined.py 2>&1 | tee artifacts/previous-content-tests.log
          python3 qa/field-r3915/test_combined_jigsaws.py 2>&1 | tee artifacts/previous-jigsaw-tests.log
          python3 qa/field-r3915/apply_authored_npc_contract.py 2>&1 | tee artifacts/authored-transform.log
          python3 qa/field-r3915/test_authored_npc.py 2>&1 | tee artifacts/authored-contract-tests.log
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10963935012'
          run-id: '36407606753'
          github-token: ${{ github.token }}
          path: inputs
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10967789179'
          run-id: '36417504719'
          github-token: ${{ github.token }}
          path: cart-input
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10968482107'
          run-id: '36419010757'
          github-token: ${{ github.token }}
          path: swift-input
          merge-multiple: true
      - name: Recompose exact earlier deltas and keep the original isolated regression
        id: compose
        run: |
          set -o pipefail
          python3 qa/field-r3915/combine_content.py 2>&1 | tee artifacts/combined-build-command.log
          python3 qa/field-r3915/check_combined_resources.py 2>&1 | tee artifacts/combined-resource-command.log
      - name: Audit complete ordered stack and detect shadowed repairs
        id: audit
        run: |
          set -o pipefail
          python3 qa/field-r3919/check_stack.py 2>&1 | tee artifacts/stack-audit-command.log
      - name: Verify actual enabled order in a fresh isolated server
        if: always() && steps.compose.outcome == 'success'
        run: |
          set -o pipefail
          python3 qa/field-r3919/run_stack_smoke.py 2>&1 | tee artifacts/stack-smoke-command.log
      - name: Require actual scoped evidence, not full worldgen acceptance
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('artifacts')
          delta=json.loads((out/'stack-delta.json').read_text())
          smoke=json.loads((out/'stack-smoke.json').read_text())
          assert delta['pass'] is True and delta['isolated_delta_preserved'] is True
          assert smoke['pass'] is True and smoke['runtime_order_verified'] is True
          assert smoke['runtime_automatic_packs']==['paper']
          assert smoke['observed_saved_order']==delta['order_low_to_high']+smoke['runtime_automatic_packs']
          assert smoke['static_audit_excludes_runtime_automatic_packs'] is True
          assert smoke['input_hashes']['server']==delta['server_sha256']
          assert smoke['input_hashes']['packs']['file/NeverOverworld.zip']==delta['overworld_sha256']
          assert smoke['input_hashes']['packs']['file/NeverNether.zip']==delta['nether_sha256']
          result={'pass':True,'scope':'resource precedence regression and one clean startup; automatic Paper datapack observed separately',
                  'runtime_order_verified':True,'runtime_automatic_packs':smoke['runtime_automatic_packs'],
                  'full_resource_acceptance':delta['full_resource_acceptance'],
                  'production_accepted':False,'all_reported_bugs_fixed':False,'user_kit_published':False}
          (out/'stack-acceptance.json').write_text(json.dumps(result,indent=2)+'\n')
          print('STACK_SCOPED_ACCEPTANCE',json.dumps(result))
          PY
      - name: Preserve actual sources, input hashes, negative findings and failures
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          out=Path('artifacts');source=out/'stack-source';source.mkdir(parents=True,exist_ok=True)
          paths=[Path('scripts/never_resource_stack.py'),Path('scripts/test_never_resource_stack.py'),
                 Path('scripts/audit-neveroverworld-r39-resources.py'),
                 Path('scripts/build-never-overworld-external-structures-r19.py'),
                 Path('.github/workflows/never-r3919-resource-stack.yml')]
          paths+=list(Path('qa/field-r3919').glob('*.py'))+list(Path('qa/field-r3915').glob('*.py'))
          records={}
          for p in paths:
              dest=source/p;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,dest)
              records[str(p)]=hashlib.sha256(p.read_bytes()).hexdigest()
          report={'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
                  'base_commit':'5df53b7ac21b2540e2939efabd7887954459d17d',
                  'source_sha256':records,'user_world_changed':False,'user_kit_published':False}
          (out/'stack-provenance.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R3919-RESOURCE-STACK-EVIDENCE-${{ github.sha }}
          path: |
            artifacts/
            !artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
