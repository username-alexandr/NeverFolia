name: NeverNether R11 Storage API
on:
  push:
    branches: [wip/nevernether-field-r1]
    paths: [.github/workflows/never-nether-r11-storage-api.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Export generated storage APIs
        run: |
          set -euo pipefail
          git config --global user.email actions@github.com
          git config --global user.name 'NeverFolia CI'
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/SOURCE-SHA.txt
          bash scripts/prepare-upstream.sh
          test "$(git -C .work/Folia rev-parse HEAD)" = 14b7fee5c866fca9a40ede4a58998fb928140f65
          bash scripts/apply-folia-patches-ci.sh .work/Folia
          bash scripts/apply-neverfolia-post-patches.sh > artifacts/production.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          root=Path('.work/Folia/folia-server/src/minecraft/java')
          names=['world/level/chunk/storage/SerializableChunkData.java','world/level/chunk/LevelChunkSection.java','world/level/chunk/PalettedContainer.java','world/level/chunk/ProtoChunk.java','world/level/chunk/LevelChunk.java','world/level/chunk/status/ChunkStatusTasks.java','world/level/levelgen/feature/MushroomFeature.java','world/level/levelgen/feature/GlowstoneFeature.java','world/level/levelgen/feature/SpringFeature.java']
          hashes={}
          with zipfile.ZipFile('artifacts/storage-api.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in names:
                  p=Path('net/minecraft')/name
                  if not (root/p).is_file(): continue
                  raw=(root/p).read_bytes();z.writestr(str(p),raw);hashes[str(p)]=hashlib.sha256(raw).hexdigest()
          assert 'net/minecraft/world/level/chunk/storage/SerializableChunkData.java' in hashes
          Path('artifacts/API-SHA256.json').write_text(json.dumps(hashes,indent=2)+'\n')
          PY
          (cd artifacts && sha256sum *.zip *.txt *.json *.log > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: NeverNether-r11-storage-api-${{ github.sha }}
          path: artifacts/*
          retention-days: 7
          if-no-files-found: error
