name: Diagnose NeverOverworld native geology

on:
  push:
    branches:
      - diag/never-overworld-native-geology-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: NR-DEV-1 native geology self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v6

      - name: Validate NeverOverworld contract
        run: python3 ./scripts/validate-never-overworld-spec.py

      - name: Self-test native deterministic ore geology transformer
        run: python3 ./scripts/apply-never-overworld-ore-geology.py --self-test

      - name: Reject obvious neighbor-chunk access in generated helper
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util

          path = Path('scripts/apply-never-overworld-ore-geology.py')
          spec = importlib.util.spec_from_file_location('geo', path)
          geo = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(geo)
          helper = geo.helper_source()
          forbidden = (
              'level.getChunk(',
              'level.getChunkSource(',
              'getChunkNow(',
              'getChunkAt(',
          )
          found = [token for token in forbidden if token in helper]
          if found:
              raise SystemExit(f'forbidden neighbor/world chunk access in native geology helper: {found}')
          required = (
              'final ChunkPos chunkPos = chunk.getPos();',
              'final int chunkMinX = chunkPos.getMinBlockX();',
              'final int chunkMaxX = chunkMinX + 15;',
              'final int chunkMinZ = chunkPos.getMinBlockZ();',
              'final int chunkMaxZ = chunkMinZ + 15;',
              'chunk.getBlockState(pos)',
              'chunk.setBlockState(pos, replacement, 0)',
          )
          missing = [token for token in required if token not in helper]
          if missing:
              raise SystemExit(f'native geology helper lost chunk-owned invariants: {missing}')
          print('[NeverFolia][NeverOverworld geology] chunk-local static audit OK')
          PY

  compile:
    name: NR-DEV-1 native geology Folia 26.2 compile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Configure Git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "NeverFolia CI"

      - name: Prepare Folia 26.2.x upstream
        run: |
          chmod +x ./scripts/prepare-upstream.sh
          ./scripts/prepare-upstream.sh

      - name: Apply Folia patches
        run: |
          chmod +x ./scripts/apply-folia-patches-ci.sh
          ./scripts/apply-folia-patches-ci.sh ./.work/Folia

      - name: Apply current NeverFolia baseline post patches
        run: |
          chmod +x ./scripts/apply-neverfolia-post-patches.sh
          ./scripts/apply-neverfolia-post-patches.sh

      - name: Apply native ore geology after baseline patches
        run: python3 ./scripts/apply-never-overworld-ore-geology.py ./.work/Folia

      - name: Compile Folia server with native ore geology
        working-directory: .work/Folia
        run: ./gradlew :folia-server:compileJava --stacktrace
