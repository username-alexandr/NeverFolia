name: R40 isolated fixture diagnosis
on:
  push:
    branches: ['fix/neveroverworld-r40-ocean-integration']
    paths: ['.github/workflows/never-r40-fixture-only.yml']
permissions:
  contents: read
  actions: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: bd568abbf84cb2d0c16519399c9e10d9c8cc79ae
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10939310250'
          run-id: 36340789810
          github-token: ${{ github.token }}
          path: baseline
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10928009164'
          run-id: 36308250793
          github-token: ${{ github.token }}
          path: debug
          merge-multiple: true
      - name: Reproduce exact compiled fixture
        run: |
          mkdir -p artifacts
          python3 qa/field-r40/build.py > artifacts/build-command.log 2>&1
          python3 - <<'PY'
          import importlib.util,json
          from pathlib import Path
          p=Path('qa/field-r40/runtime.py');spec=importlib.util.spec_from_file_location('fixture_only',p);m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          m.WORK.mkdir(parents=True,exist_ok=False)
          folder=m.prepare('fixture-only',m.ROOT/'.work/r40-build/R40ClosureQa.jar')
          r=m.phase('fixture-only',folder,m.ROOT/'candidate/server.jar',True,fixture=True)
          print('FIXTURE_ONLY_RESULT '+json.dumps(r,separators=(',',':')))
          if not r['pass']:
              print((m.OUT/'fixture-only.log').read_text())
              raise SystemExit('Exact fixture failed; no acceptance')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R40-ISOLATED-FIXTURE-DIAGNOSIS-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
