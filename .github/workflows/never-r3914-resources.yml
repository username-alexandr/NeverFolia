name: R3914 resource recovery
on:
  push:
    branches: ['fix/neveroverworld-r3914-resource-recovery']
    paths: ['qa/field-r3914/**', '.github/workflows/never-r3914-resources.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10963935012'
          run-id: 36407606753
          github-token: ${{ github.token }}
          path: inputs
          merge-multiple: true
      - name: Audit actual missing templates and compare original Dungeons and Taverns
        run: |
          mkdir -p artifacts
          set -o pipefail
          python3 qa/field-r3914/inspect.py 2>&1 | tee artifacts/inspection.log
      - name: Preserve exact source and provenance
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,shutil,json,hashlib
          out=Path('artifacts');(out/'source').mkdir(parents=True,exist_ok=True)
          for p in Path('qa/field-r3914').iterdir():
              if p.is_file():shutil.copyfile(p,out/'source'/p.name)
          shutil.copyfile('.github/workflows/never-r3914-resources.yml',out/'source/workflow.yml')
          (out/'provenance.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'world_modified':False,'production_accepted':False},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R3914-resource-evidence-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
