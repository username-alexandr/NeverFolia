name: R3914 resource repair
on:
  push:
    branches: ['fix/neveroverworld-r3914-resource-repair']
    paths: ['qa/field-r3914/**', '.github/workflows/never-r3914-resources.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10963935012'
          run-id: 36407606753
          github-token: ${{ github.token }}
          path: inputs
          merge-multiple: true
      - name: Audit exact pack and compare existing original templates
        run: |
          set -o pipefail
          python3 qa/field-r3914/inspect_resources.py 2>&1 | tee inventory-command.log
      - name: Stage proved biome reconstruction and inspect remaining geometry
        run: |
          set -o pipefail
          python3 qa/field-r3914/prepare_repairs.py 2>&1 | tee repair-command.log
      - name: Retain audit even when it identifies missing content
        if: always()
        run: |
          mkdir -p resource-evidence/source
          cp inventory-command.log resource-evidence/ 2>/dev/null || true
          cp repair-command.log resource-evidence/ 2>/dev/null || true
          cp qa/field-r3914/*.py resource-evidence/source/
          cp .github/workflows/never-r3914-resources.yml resource-evidence/source/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R3914-RESOURCE-EVIDENCE-${{ github.sha }}
          path: resource-evidence/
          if-no-files-found: error
          retention-days: 14
