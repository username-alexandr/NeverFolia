name: R3936 underground all heights
on:
  push:
    branches: ['fix/neveroverworld-r3936-underground-all-heights']
    paths:
      - 'worldgen-spec/never-overworld-structures.json'
      - 'scripts/apply-never-overworld-placement-hook.py'
      - 'qa/field-r3936/**'
      - '.github/workflows/never-r3936-underground-all-heights.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: r3936-underground-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '25'}

      - name: Download accepted R39.35
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '11144346088'
          run-id: 36823488987
          github-token: '${{ github.token }}'
          path: baseline-r3935
          merge-multiple: true

      - name: Build R39.36 candidate
        id: build
        run: |
          mkdir -p artifacts
          python3 -m py_compile scripts/apply-never-overworld-placement-hook.py qa/field-r3936/*.py
          set -o pipefail
          python3 qa/field-r3936/build.py 2>&1 | tee artifacts/r3936-build-command.log

      - name: Runtime underground QA
        id: runtime
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          python3 qa/field-r3936/runtime.py 2>&1 | tee artifacts/r3936-runtime-command.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R3936-EVIDENCE-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

      - name: Package manual test
        if: steps.build.outcome == 'success' && steps.runtime.outcome == 'success'
        run: python3 qa/field-r3936/package.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.build.outcome == 'success' && steps.runtime.outcome == 'success'
        with:
          name: NeverFolia-R39.36-Underground-All-Heights-TEST-${{ github.sha }}
          path: test-kit-r3936/
          retention-days: 14
          if-no-files-found: error

      - name: Require accepted automated gates
        if: always()
        env:
          BUILD: '${{ steps.build.outcome }}'
          RUNTIME: '${{ steps.runtime.outcome }}'
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          assert os.environ['BUILD']=='success' and os.environ['RUNTIME']=='success'
          b=json.loads(Path('artifacts/build-r3936.json').read_text())
          r=json.loads(Path('artifacts/runtime-r3936.json').read_text())
          assert b['build_pass'] is True and r['pass'] is True
          assert b['per_profile_y_bands_removed'] is True
          assert b['global_start_y'] == [-480, 480]
          assert b['dynamic_upper_bound'] == 'local OCEAN_FLOOR_WG - profile surface cover'
          assert b['vanilla_mineshaft_trial_rules_changed'] is False
          print('R39.36 automated all-height underground gates passed.')
          PY
