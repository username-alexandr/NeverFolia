name: R9 Vanilla Structure Integrity Self-Test

on:
  push:
    branches:
      - qa/r9-vanilla-structure-integrity
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r9-vanilla-structure-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    name: Structure integrity auditor self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout NeverFolia
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Syntax-check bounded natural probe
        run: bash -n ./scripts/probe-never-overworld-r9-vanilla-structures.sh
      - name: Self-test R9 vanilla structure integrity auditor
        run: python3 ./scripts/audit-never-overworld-r9-vanilla-structures.py --self-test
