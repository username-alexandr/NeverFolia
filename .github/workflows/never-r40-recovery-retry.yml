name: R40 official resource recovery by stable project ID
on:
  push:
    branches: ['fix/neveroverworld-r40-integrated-worldgen']
    paths: ['.github/workflows/never-r40-recovery-retry.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '10939310250', run-id: 36340789810, github-token: '${{ github.token }}', path: baseline, merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '10940318112', run-id: 36345953188, github-token: '${{ github.token }}', path: inspected, merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '10928009164', run-id: 36308250793, github-token: '${{ github.token }}', path: debug, merge-multiple: true}
      - name: Correct obsolete slug without accepting a different project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qa/field-r40/resource_inventory.py');text=p.read_text();old='https://api.modrinth.com/v2/project/structory-towers/version'
          assert text.count(old)==1
          p.write_text(text.replace(old,'https://api.modrinth.com/v2/project/j3FONRYr/version',1))
          PY
          set -o pipefail
          python3 qa/field-r40/resource_inventory.py > inventory-command.log 2>&1 || { tail -25 inventory-command.log; exit 1; }
          grep -E 'R40_OLDER_EXACT|R40_EXACT_RECOVERY|R40_EXACT_SOURCE|R40_TOWERS_UPSTREAM' inventory-command.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R40-RECOVERED-RESOURCE-SOURCES-${{ github.sha }}
          path: |
            inventory/
            inventory-command.log
            qa/field-r40/resource_inventory.py
          retention-days: 14
          if-no-files-found: error
