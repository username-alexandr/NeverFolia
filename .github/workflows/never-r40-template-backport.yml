name: R40 exact template backport
on:
  push:
    branches: ['fix/neveroverworld-r40-water-resources']
    paths: ['qa/field-r40/backport_templates.py', '.github/workflows/never-r40-template-backport.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  backport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10939310250'
          run-id: 36340789810
          github-token: ${{ github.token }}
          path: baseline
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10942647267'
          run-id: 36352579922
          github-token: ${{ github.token }}
          path: donor
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10942438651'
          run-id: 36353093973
          github-token: ${{ github.token }}
          path: refs
          merge-multiple: true
      - name: Restore geometry without replacing target-version gameplay
        run: |
          set -o pipefail
          python3 qa/field-r40/backport_templates.py 2>&1 | tee template-command.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R40-TEMPLATE-BACKPORT-${{ github.sha }}
          path: |
            template-output/
            template-command.log
          retention-days: 14
          if-no-files-found: error
