name: R395 inspect pinned water and enchant inputs
on:
  push:
    branches: ['fix/neveroverworld-r395-water-ice-enchants']
    paths: ['qa/field-r395/inspect_inputs.py', '.github/workflows/never-r395-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10928009164'
          run-id: 36308250793
          github-token: ${{ github.token }}
          path: debug
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10930701040'
          run-id: 36315038771
          github-token: ${{ github.token }}
          path: pack
          merge-multiple: true
      - name: Read exact sources and registries
        run: |
          mkdir -p artifacts
          set -o pipefail
          python3 qa/field-r395/inspect_inputs.py 2>&1 | tee artifacts/inspection.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R395-input-inspection-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
