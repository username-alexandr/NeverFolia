name: FIELD-R39.4 exact typed contracts
on:
  push:
    branches: ['fix/neveroverworld-r393-resource-qa']
    paths: ['.github/workflows/never-r394-contract-readout.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: NeverFolia-R39.3-FULL-PACK-TEST-fae6209634712069ced5882fd933e5666006a8c2
          run-id: 36315038771
          github-token: ${{ github.token }}
          path: candidate
      - name: Exact contracts, no writes to gameplay files
        run: |
          python3 - <<'PY'
          import sys,json,zipfile
          from pathlib import Path
          sys.path.insert(0,str(Path('qa/field-r394').resolve()))
          import build_candidate as r
          from inspect_sources import summary,plain
          from cart_contract import diff
          b=r.load('nbt',Path('scripts/build-never-overworld-external-structures-r19.py'))
          with zipfile.ZipFile('candidate/NeverOverworld.zip') as z:
              print('PACK_SHA256',r.sha(Path('candidate/NeverOverworld.zip').read_bytes()),flush=True)
              roots={}
              for name in ('armorer','cartographer','cleric','armorer_acacia','butcher_acacia','armorer_oak'):
                  path=r.PREFIX+name+'.nbt';raw=z.read(path);c,n,root=b._nbt_parse(raw);roots[name]=plain((10,root))
                  print('TYPED',name,'sha=',r.sha(raw),'compression=',c,'size=',repr(root.get('size')),'entity_count=',len(root.get('entities',(9,(0,[])))[1][1]),flush=True)
                  print('PROFILE',name,json.dumps(summary(b,raw)),flush=True)
              print('WRAPPER_DIFF_ACACIA',json.dumps(diff(roots['armorer_acacia'],roots['butcher_acacia']))[:18000],flush=True)
              print('BIOME_DIFF_ARMORER',json.dumps(diff(roots['armorer_acacia'],roots['armorer_oak']))[:18000],flush=True)
              for path in z.namelist():
                  if '/worldgen/template_pool/' in path and '/tavern/' in path and path.endswith('.json'):
                      text=z.read(path).decode()
                      if any(s in text for s in ('trader_car_cleric','trader_car_cartographer')):print('PARENT_POOL',path,text[:22000],flush=True)
          PY
