name: R41 consolidated datapack repair
on:
  push:
    branches: ['fix/neveroverworld-r41-consolidated']
    paths: ['qa/field-r41/repair_pack.py','.github/workflows/never-r41-pack.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10962234376'
          run-id: 36405767505
          github-token: ${{ github.token }}
          path: core
          merge-multiple: true
      - name: Existing cart serializer tests
        run: python3 qa/field-r394/build_candidate.py --self-test
      - name: Repair explicitly reviewed paths and missing biome models
        run: python3 qa/field-r41/repair_pack.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: R41-REPAIRED-PACK-${{ github.sha }}
          path: NeverOverworld-R41.zip
          if-no-files-found: error
          retention-days: 14
      - name: Discover actual validation API and native dispatch
        if: always()
        run: |
          python3 - <<'PY'
          import zipfile,io,json,subprocess,hashlib
          from pathlib import Path
          out=Path('r41-final-evidence');out.mkdir(exist_ok=True)
          with zipfile.ZipFile('core/server.jar') as z:
              names=[n for n in z.namelist() if n.startswith('META-INF/versions/') and n.endswith('/folia-26.2.jar')]
              assert len(names)==1
              raw=z.read(names[0])
          tmp=Path('.work/r41-api');tmp.mkdir(parents=True);jar=tmp/'engine.jar';jar.write_bytes(raw)
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              classes=[n for n in z.namelist() if n.endswith('.class') and '$' not in n and any(t in n for t in ('NeverEnchant','NeverDatapack','NativeMob','ExternalMob','TrialSpawnerConfig','StructureTemplateManager'))]
          classes+=['net/minecraft/world/entity/EntityType.class','net/minecraft/nbt/NbtUtils.class','net/minecraft/world/level/levelgen/structure/templatesystem/StructureTemplate.class','net/minecraft/server/ReloadableServerRegistries$Holder.class']
          for n in classes:
              p=subprocess.run(['javap','-p','-classpath',str(jar),n[:-6].replace('/','.')],capture_output=True,text=True,timeout=30)
              (out/(Path(n).stem+'.api.txt')).write_text(p.stdout+p.stderr)
              print('API',n,p.stdout[:13000])
          print('NATIVE_SCRIPT_PATHS',json.dumps([str(p) for p in Path('scripts').glob('*') if any(t in p.name for t in ('native','behavio','runtime'))]))
          if Path('NeverOverworld-R41.zip').exists():
              with zipfile.ZipFile('NeverOverworld-R41.zip') as z:print('BLAZE_LOOT_NAMES',json.dumps([n for n in z.namelist() if 'loot_table/' in n and any(x in n for x in ('blaze','nether_port'))]))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R41-PACK-EVIDENCE-${{ github.sha }}
          path: r41-final-evidence/
          if-no-files-found: error
          retention-days: 14
