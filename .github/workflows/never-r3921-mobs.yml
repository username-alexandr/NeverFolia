name: R3921 dungeon mob activation
on:
  push:
    branches: ['fix/neverfolia-r3921-effective-stack']
    paths: ['qa/field-r3921/**', '.github/workflows/never-r3921-mobs.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  mobs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10968482107'
          run-id: 36419010757
          github-token: ${{ github.token }}
          path: swift-input
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10987230288'
          run-id: 36459514080
          github-token: ${{ github.token }}
          path: resource-input
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10963935012'
          run-id: 36407606753
          github-token: ${{ github.token }}
          path: ice-input
          merge-multiple: true
      - name: Resolve exact integrated inputs
        run: |
          set -euo pipefail
          mkdir -p artifacts .work/r3921-mobs
          CORE="$(find swift-input -type f -name server-r3915.jar -print -quit)"
          OVERWORLD="$(find resource-input -type f -name NeverOverworld-R3918-Walls.zip -print -quit)"
          NETHER="$(find ice-input -type f -name NeverNether.zip -print -quit)"
          test -n "$CORE" && test -n "$OVERWORLD" && test -n "$NETHER"
          echo "CORE=$CORE" >> "$GITHUB_ENV"
          echo "OVERWORLD=$OVERWORLD" >> "$GITHUB_ENV"
          echo "NETHER=$NETHER" >> "$GITHUB_ENV"
          printf '%s  %s\n'             '845d0e90fcbe0fbebad7a613aa9934f608cce64a9d41abdfdf012e39e21c1d40' "$CORE"             '9daf27e23300d6687e8cc93cf82c7e6db91f69e4fe605382c6947521f0855590' "$OVERWORLD"             '5e47f953cadbd5451b04d1682642417c9a40c726cf06e935c02cecdcb5eb2a10' "$NETHER" | sha256sum -c -
          sha256sum "$CORE" "$OVERWORLD" "$NETHER" | tee artifacts/input-hashes.txt
      - name: Compile Folia-owned mob QA plugin
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,subprocess,zipfile
          core=Path(os.environ['CORE'])
          work=Path('.work/r3921-mobs')
          libs=work/'libs'; classes=work/'classes'
          libs.mkdir(parents=True); classes.mkdir()
          with zipfile.ZipFile(core) as z:
              for i,name in enumerate(z.namelist()):
                  if name.endswith('.jar') and name.startswith(('META-INF/versions/','META-INF/libraries/')):
                      (libs/f'{i}-{Path(name).name}').write_bytes(z.read(name))
          cp=os.pathsep.join(str(p) for p in sorted(libs.glob('*.jar')))
          source=Path('qa/field-r3921/R3921MobQa.java')
          p=subprocess.run(['javac','--release','25','-proc:none','-classpath',cp,'-d',str(classes),str(source)],
                           text=True,capture_output=True)
          Path('artifacts/mob-qa-javac.log').write_text(p.stdout+p.stderr)
          if p.returncode: raise SystemExit(p.returncode)
          out=work/'R3921MobQa.jar'
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for f in classes.rglob('*.class'):
                  z.write(f,f.relative_to(classes).as_posix())
              z.writestr('plugin.yml',"name: R3921MobQa\nversion: '1'\nmain: R3921MobQa\napi-version: '26.2'\nfolia-supported: true\n")
          PY
      - name: Run mob activation and restart regression
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,os,shutil,subprocess,time
          core=Path(os.environ['CORE']).resolve()
          ow=Path(os.environ['OVERWORLD']).resolve(); nn=Path(os.environ['NETHER']).resolve()
          root=Path('.work/r3921-mobs/server')
          packs=root/'world/datapacks'; plugins=root/'plugins'
          packs.mkdir(parents=True); plugins.mkdir()
          shutil.copyfile(ow,packs/'NeverOverworld.zip')
          shutil.copyfile(nn,packs/'NeverNether.zip')
          shutil.copyfile('.work/r3921-mobs/R3921MobQa.jar',plugins/'R3921MobQa.jar')
          (root/'eula.txt').write_text('eula=true\n')
          (root/'server.properties').write_text(
              'level-name=world\n'
              'level-seed=-4651369264513492755\n'
              'initial-enabled-packs=vanilla,file/NeverOverworld.zip,file/NeverNether.zip\n'
              'online-mode=false\n'
              'enforce-secure-profile=false\n'
              'server-ip=127.0.0.1\n'
              'server-port=25621\n'
              'view-distance=2\n'
              'simulation-distance=2\n'
              'spawn-protection=0\n'
              'pause-when-empty-seconds=-1\n'
              'enable-rcon=false\n'
              'enable-query=false\n'
              'enable-status=false\n'
          )
          bad=('Empty or non-existent pool:','Block-attached entity at invalid position',
               'porting_lib:','Exception loading structure','Failed to load datapacks')
          reports=[]
          for phase in ('first','restart'):
              result=plugins/'R3921MobQa/result.json'
              if result.exists(): result.unlink()
              log=Path(f'artifacts/r3921-mobs-{phase}.log')
              args=['java','-XX:ActiveProcessorCount=4','-Xms512M','-Xmx4G',
                    '-Dneverfolia.r399OceanClosure=true','-Dneverfolia.r3913IceFragments=true',
                    '-jar',str(core),'--nogui']
              with log.open('w') as stream:
                  p=subprocess.Popen(args,cwd=root,stdin=subprocess.PIPE,stdout=stream,stderr=subprocess.STDOUT,text=True)
                  deadline=time.monotonic()+300
                  while time.monotonic()<deadline and not result.is_file() and p.poll() is None:
                      time.sleep(.5)
                  if not result.is_file():
                      if p.poll() is None:
                          p.terminate()
                          try:p.wait(timeout=20)
                          except subprocess.TimeoutExpired:p.kill();p.wait(timeout=10)
                      raise SystemExit(f'{phase} result missing; premature exit={p.returncode}')
                  data=json.loads(result.read_text())
                  if p.poll() is None:
                      p.stdin.write('stop\n');p.stdin.flush()
                  try:exit_code=p.wait(timeout=120)
                  except subprocess.TimeoutExpired:
                      p.terminate()
                      try:exit_code=p.wait(timeout=20)
                      except subprocess.TimeoutExpired:p.kill();exit_code=p.wait(timeout=10)
              if exit_code != 0: raise SystemExit(f'{phase} server exit {exit_code}')
              if data.get('pass') is not True: raise SystemExit(f'{phase} mob QA failed: {data}')
              text=log.read_text(errors='replace')
              hits=[line for line in text.splitlines() if any(x in line for x in bad)]
              if hits: raise SystemExit(f'{phase} targeted console errors: {hits[:20]}')
              if len(data.get('cases',[])) < 14: raise SystemExit(f'{phase} incomplete mob cases')
              shutil.copyfile(result,Path(f'artifacts/r3921-mobs-{phase}.json'))
              reports.append(data)
          Path('artifacts/r3921-mobs-summary.json').write_text(json.dumps({
              'pass':True,'phases':len(reports),'case_counts':[len(x['cases']) for x in reports],
              'core_sha256':'845d0e90fcbe0fbebad7a613aa9934f608cce64a9d41abdfdf012e39e21c1d40',
              'overworld_sha256':'9daf27e23300d6687e8cc93cf82c7e6db91f69e4fe605382c6947521f0855590',
              'nether_sha256':'5e47f953cadbd5451b04d1682642417c9a40c726cf06e935c02cecdcb5eb2a10'
          },indent=2)+'\n')
          PY
      - name: Preserve QA source
        if: always()
        run: |
          mkdir -p artifacts/source
          cp qa/field-r3921/R3921MobQa.java artifacts/source/
          cp .github/workflows/never-r3921-mobs.yml artifacts/source/workflow.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R3921-MOB-EVIDENCE-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
