name: NeverOverworld Witch source NBT QA

on:
  push:
    branches: [wip/neveroverworld-field-r12]
    paths:
      - 'qa/field-r19/audit-witch-source-nbt.py'
      - '.github/workflows/never-overworld-witch-source-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  witch-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Fetch exact pinned Better Witch Huts v5 archive
        run: |
          set -euo pipefail
          mkdir -p .work artifacts
          python3 - <<'PY'
          import hashlib,urllib.request
          from pathlib import Path
          url='https://cdn.modrinth.com/data/ePaZVJM4/versions/CTab3l6x/Repurposed_Structures-Better_Witch_Huts_v5.zip'
          expected='ca4ae83e5a777392d50154f4ef57d8cbd7a12cc190ed69fd2dd2a51437fd64ef'
          req=urllib.request.Request(url,headers={'User-Agent':'NeverFolia-Witch-QA/1'})
          with urllib.request.urlopen(req,timeout=60) as response:
              raw=response.read()
          got=hashlib.sha256(raw).hexdigest()
          if got!=expected:
              raise SystemExit(f'Witch ZIP SHA mismatch: {got}')
          Path('.work/witch.zip').write_bytes(raw)
          print('Witch ZIP verified',got,'bytes',len(raw))
          PY

      - name: Audit Witch NBT templates and mob references
        run: |
          set -euo pipefail
          python3 qa/field-r19/audit-witch-source-nbt.py \
            --source .work/witch.zip \
            --output artifacts/witch-source-nbt-qa.json

      - name: Upload Witch NBT evidence
        uses: actions/upload-artifact@v4
        with:
          name: NeverOverworld-WITCH-SOURCE-NBT-QA-${{ github.sha }}
          path: artifacts/witch-source-nbt-qa.json
          retention-days: 14
