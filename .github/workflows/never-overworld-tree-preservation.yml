name: NeverOverworld Tree Preservation
on:
  push:
    branches: [wip/neveroverworld-tree-preservation]
    paths:
      - 'scripts/preserve-never-overworld-trees-r1.py'
      - 'scripts/apply-neverfolia-post-patches*.sh'
      - 'scripts/*never-overworld*.py'
      - 'native/neveroverworld/**'
      - 'qa/neveroverworld-trees-r1/**'
      - '.github/workflows/never-overworld-tree-preservation.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  trees:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate tree and village source transformers
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/preserve-never-overworld-trees-r1.py --self-test 2>&1 | tee artifacts/tree-transformer.log
          python3 scripts/remove-never-overworld-village-reclamation-r1.py --self-test 2>&1 | tee artifacts/village-no-reclamation.log
          python3 scripts/test-never-overworld-field-r11.py 2>&1 | tee artifacts/field-r11-tests.log
          bash -n scripts/apply-neverfolia-post-patches.sh
      - name: Materialize exact current candidate
        run: |
          set -euo pipefail
          git config --global user.email actions@github.com
          git config --global user.name 'NeverFolia CI'
          python3 scripts/prepare-never-nether-r13-upstream.py
          test "$(git -C .work/Folia rev-parse HEAD)" = 14b7fee5c866fca9a40ede4a58998fb928140f65
          bash scripts/apply-folia-patches-ci.sh .work/Folia
          bash scripts/apply-neverfolia-post-patches.sh 2>&1 | tee artifacts/production-chain.log
          for stage in 8 9 10 11 12 13 14; do
            python3 "scripts/apply-never-nether-experiment-r${stage}.py" .work/Folia --acknowledge-experimental-worldgen
          done
          python3 scripts/apply-never-nether-bug01-bounds.py .work/Folia
          python3 scripts/apply-never-nether-experiment-r15.py .work/Folia --acknowledge-experimental-worldgen
          python3 scripts/preserve-never-overworld-trees-r1.py .work/Folia --check-only
          python3 scripts/remove-never-overworld-village-reclamation-r1.py .work/Folia --check-only
      - name: Compile and exercise installed flood paths
        run: |
          set -euo pipefail
          cat > .work/tree-preservation.init.gradle <<'GROOVY'
          gradle.projectsEvaluated {
              def server = gradle.rootProject.project(':folia-server')
              def qaDir = new File(gradle.rootProject.buildDir, 'tree-preservation-qa')
              def cp = server.sourceSets.main.runtimeClasspath
              def compileQa = server.tasks.register('neverOverworldTreeQaCompile', JavaCompile) {
                  dependsOn server.tasks.named('classes')
                  source gradle.rootProject.files(
                      new File(gradle.rootProject.projectDir, '../../qa/neveroverworld-trees-r1/TreePreservationSmoke.java'),
                      new File(gradle.rootProject.projectDir, '../../qa/neveroverworld-field-r10/VillageFoundationSmoke.java'),
                      new File(gradle.rootProject.projectDir, '../../qa/neveroverworld-field-r11/FloodBoundarySmoke.java'),
                      new File(gradle.rootProject.projectDir, '../../qa/neveroverworld-desert-r1/DesertR1Smoke.java'),
                      new File(gradle.rootProject.projectDir, '../../qa/neveroverworld-desert-r1/SandstormR1Smoke.java'))
                  destinationDirectory = qaDir
                  classpath = cp
                  options.release = 25
              }
              [
                  'neverOverworldTreeSmoke': 'net.minecraft.world.level.chunk.TreePreservationSmoke',
                  'neverOverworldVillageSmoke': 'net.minecraft.world.level.levelgen.structure.VillageFoundationSmoke',
                  'neverOverworldBoundarySmoke': 'net.minecraft.world.level.chunk.FloodBoundarySmoke',
                  'neverOverworldDesertSmoke': 'net.minecraft.world.level.chunk.DesertR1Smoke',
                  'neverOverworldSandstormSmoke': 'net.minecraft.server.level.SandstormR1Smoke'
              ].each { taskName, className ->
                  server.tasks.register(taskName, JavaExec) {
                      dependsOn compileQa
                      classpath = cp + server.files(qaDir)
                      mainClass = className
                      jvmArgs '-ea'
                  }
              }
          }
          GROOVY
          (cd .work/Folia && ./gradlew :folia-server:compileJava :folia-server:neverOverworldTreeSmoke :folia-server:neverOverworldVillageSmoke :folia-server:neverOverworldBoundarySmoke :folia-server:neverOverworldDesertSmoke :folia-server:neverOverworldSandstormSmoke -I ../tree-preservation.init.gradle --no-configuration-cache --stacktrace) 2>&1 | tee artifacts/build-smoke.log
      - name: Record scope
        if: always()
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/SOURCE-SHA.txt
          printf '%s\n' 'TREE-R1 source/ProtoChunk checks and VILLAGE-NOFILL-R1 source-hook removal. Historical village-helper unit tests do not imply its runtime hook is enabled. No natural multi-seed, village-shape, existing-world repair or release acceptance.' > artifacts/SCOPE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeverOverworld-tree-preservation-${{ github.sha }}
          path: artifacts/*
          retention-days: 14
          if-no-files-found: error
