name: R40 resource compatibility corrections
on:
  push:
    branches: ['fix/neveroverworld-r40-water-resources']
    paths: ['qa/field-r40/resource_candidates.py', '.github/workflows/never-r40-resources.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10939310250'
          run-id: 36340789810
          github-token: ${{ github.token }}
          path: baseline
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10942647267'
          run-id: 36352579922
          github-token: ${{ github.token }}
          path: donor
          merge-multiple: true
      - name: Correct only reviewed references and retain unresolved entries
        run: |
          set -o pipefail
          python3 qa/field-r40/resource_candidates.py 2>&1 | tee resource-command.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R40-REFERENCE-CORRECTIONS-${{ github.sha }}
          path: |
            resource-output/
            resource-command.log
            qa/field-r40/resource_candidates.py
          retention-days: 14
          if-no-files-found: error
