name: R3918 resource recovery
on:
  push:
    branches: ['fix/neveroverworld-r3918-resource-paths']
    paths: ['qa/field-r3918/**', 'qa/resource_paths_inspect_r3918.py', '.github/workflows/never-r3918-resources.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10980264434'
          run-id: 36446043000
          github-token: ${{ github.token }}
          path: integrated-input
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10968482107'
          run-id: 36419010757
          github-token: ${{ github.token }}
          path: swift-input
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10981888711'
          run-id: 36450508420
          github-token: ${{ github.token }}
          path: candidate-input
          merge-multiple: true
      - name: Inspect exact paths and native template API
        run: |
          mkdir -p artifacts
          set -o pipefail
          python3 qa/resource_paths_inspect_r3918.py 2>&1 | tee artifacts/compact-inspection.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R3918-RESOURCE-EVIDENCE-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
