name: R3935 ocean pillar waystone repair
on:
  push:
    branches: ['fix/neveroverworld-r3935-ocean-pillar-waystone']
    paths:
      - 'qa/field-r3935fix/**'
      - '.github/workflows/never-r3935-ocean-pillar-waystone.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: r3935-ocean-pillar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '25'}

      - name: Download accepted R39.34
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '11143542262'
          run-id: 36821132145
          github-token: '${{ github.token }}'
          path: baseline-r3934
          merge-multiple: true

      - name: Prepare classpath
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          from pathlib import Path
          import os,zipfile
          libs=Path('.work/r3935-libs');libs.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile('baseline-r3934/server.jar') as z:
              i=0
              for n in z.namelist():
                  if n.endswith('.jar') and n.startswith(('META-INF/versions/','META-INF/libraries/')):
                      (libs/(str(i)+'-'+Path(n).name)).write_bytes(z.read(n));i+=1
          Path('.work/r3935-classpath.txt').write_text(os.pathsep.join(map(str,sorted(libs.glob('*.jar')))))
          print('classpath jars',i)
          PY

      - name: Build R39.35 candidate
        id: build
        run: |
          python3 -m py_compile qa/field-r3935fix/*.py
          set -o pipefail
          python3 qa/field-r3935fix/build.py 2>&1 | tee artifacts/r3935-build-command.log

      - name: Runtime ocean-pillar QA
        id: runtime
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          python3 qa/field-r3935fix/runtime.py 2>&1 | tee artifacts/r3935-runtime-command.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R3935-EVIDENCE-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

      - name: Package manual test
        if: steps.build.outcome == 'success' && steps.runtime.outcome == 'success'
        run: python3 qa/field-r3935fix/package.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.build.outcome == 'success' && steps.runtime.outcome == 'success'
        with:
          name: NeverFolia-R39.35-Ocean-Pillar-TEST-${{ github.sha }}
          path: test-kit-r3935/
          retention-days: 14
          if-no-files-found: error

      - name: Require accepted automated gates
        if: always()
        env:
          BUILD: '${{ steps.build.outcome }}'
          RUNTIME: '${{ steps.runtime.outcome }}'
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          assert os.environ['BUILD']=='success' and os.environ['RUNTIME']=='success'
          b=json.loads(Path('artifacts/build-r3935.json').read_text())
          r=json.loads(Path('artifacts/runtime-r3935.json').read_text())
          assert b['build_pass'] is True and r['pass'] is True
          assert r['ocean_pillar']['ocean_pillar_pieces'] == 1
          assert r['ocean_pillar']['air_inside_bbox'] == 0
          print('R39.35 automated ocean-pillar gates passed.')
          PY
