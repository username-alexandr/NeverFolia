name: NeverNether Probe Supervisor
on:
  push:
    branches: [wip/nevernether-field-r1]
    paths:
      - 'qa/nevernether-r8/probe_supervisor.py'
      - 'qa/nevernether-r8/run-stage-probe.py'
      - 'qa/nevernether-r11/resume-stage-probe.py'
      - 'scripts/test-never-nether-probe-supervisor.py'
      - '.github/workflows/never-nether-probe-supervisor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supervisor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Runner, checkpoint and unchanged coverage contracts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/SOURCE-SHA.txt
          git rev-parse HEAD^{tree} > artifacts/SOURCE-TREE.txt
          git archive --format=zip HEAD -o artifacts/source.zip
          python3 -m pip install numpy==2.3.5
          python3 scripts/test-never-nether-probe-supervisor.py 2>&1 | tee artifacts/supervisor-tests.log
          python3 scripts/test-never-nether-stages-r8.py 2>&1 | tee artifacts/stage-tests.log
          python3 scripts/test-never-nether-broad-r13.py 2>&1 | tee artifacts/broad-tests.log
          python3 scripts/test-never-nether-candidate-r13.py 2>&1 | tee artifacts/reconciliation-tests.log
      - name: Scope and checksums
        if: always()
        run: |
          mkdir -p artifacts
          printf '%s\n' 'Supervisor tests use short-lived Python children and synthetic checkpoints, not Minecraft worlds. Existing stage and coverage checks remain in place. No 1599-chunk worldgen result, server JAR or release acceptance is claimed by this job.' > artifacts/SCOPE.txt
          (cd artifacts && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeverNether-probe-supervisor-${{ github.sha }}
          path: artifacts/*
          retention-days: 14
          if-no-files-found: error
