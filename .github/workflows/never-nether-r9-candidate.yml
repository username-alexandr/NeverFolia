name: NeverNether R9 Candidate Compile
on:
  push:
    branches: [wip/nevernether-field-r1]
    paths:
      - 'qa/nevernether-r9/**'
      - 'scripts/*candidate-r9.py'
      - 'scripts/apply-never-nether-experiment-r9.py'
      - '.github/workflows/never-nether-r9-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Candidate source contracts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/SOURCE-SHA.txt
          python3 scripts/test-never-nether-candidate-r9.py 2>&1 | tee artifacts/candidate-contract-tests.log
      - name: Compile after normal production chain and opt-in R8
        run: |
          set -euo pipefail
          git config --global user.email actions@github.com
          git config --global user.name 'NeverFolia CI'
          bash scripts/prepare-upstream.sh
          test "$(git -C .work/Folia rev-parse HEAD)" = 14b7fee5c866fca9a40ede4a58998fb928140f65
          bash scripts/apply-folia-patches-ci.sh .work/Folia
          bash scripts/apply-neverfolia-post-patches.sh 2>&1 | tee artifacts/production-chain.log
          python3 scripts/apply-never-nether-experiment-r8.py .work/Folia --acknowledge-experimental-worldgen
          python3 scripts/apply-never-nether-experiment-r9.py .work/Folia --acknowledge-experimental-worldgen
          python3 scripts/apply-never-nether-experiment-r9.py .work/Folia --acknowledge-experimental-worldgen
          cp qa/nevernether-r9/NeverNetherCandidateR9Smoke.java .work/Folia/folia-server/src/minecraft/java/
          cat > .work/r9-smoke.init.gradle <<'GROOVY'
          gradle.projectsEvaluated {
              def server = gradle.rootProject.project(':folia-server')
              server.tasks.register('neverNetherR9Smoke', JavaExec) {
                  dependsOn server.tasks.named('classes')
                  classpath = server.sourceSets.main.runtimeClasspath
                  mainClass = 'NeverNetherCandidateR9Smoke'
                  jvmArgs '-ea'
              }
          }
          GROOVY
          (cd .work/Folia && ./gradlew :folia-server:compileJava :folia-server:neverNetherR9Smoke -I ../r9-smoke.init.gradle --no-configuration-cache --stacktrace) 2>&1 | tee artifacts/candidate-compile-smoke.log
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('.work/Folia/folia-server/build/classes/java/main')
          rel=Path('net/minecraft/world/level/levelgen/placement')
          files=list((root/rel).glob('NeverNether*R9*.class'))
          files+=list((root/rel).glob('NeverNetherFloraCandidateR8*.class'))
          files+=[root/rel/'PlacedFeature.class',root/'net/minecraft/world/level/levelgen/feature/HugeFungusFeature.class',root/'NeverNetherCandidateR9Smoke.class']
          if len(files)<9 or not all(p.is_file() for p in files): raise ValueError('Candidate class export incomplete')
          with zipfile.ZipFile('artifacts/candidate-overlay.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for p in sorted(files): archive.write(p,p.relative_to(root).as_posix())
          PY
      - name: Record scope and hashes
        if: always()
        run: |
          mkdir -p artifacts
          printf '%s\n' 'R9 EXPERIMENT ONLY. No production entry point changed. CI compiles the normal chain plus optional R8/R9 and exercises native checks; it does not generate any world or install third-party data. No release acceptance.' > artifacts/SCOPE.txt
          git ls-files qa/nevernether-r9 scripts/*candidate-r9.py scripts/apply-never-nether-experiment-r9.py | xargs sha256sum > artifacts/IMPLEMENTATION-SHA256.txt
          (cd artifacts && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeverNether-r9-candidate-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
