name: R3915 effective functional content
on:
  push:
    branches: ['fix/neveroverworld-r3915-functional-content']
    paths: ['qa/field-r3915/**', '.github/workflows/never-r3915-functional-content.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Read verified original contract and runtime adapter source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile,io,urllib.request,importlib.util,sys
          out=Path('functional-evidence');out.mkdir()
          spec=importlib.util.spec_from_file_location('external',Path('scripts/build-never-overworld-external-structures-r19.py'))
          m=importlib.util.module_from_spec(spec);sys.modules['external']=m;spec.loader.exec_module(m)
          source=m.SOURCES['dat']
          with urllib.request.urlopen(source['url'],timeout=60) as r: raw=r.read(60000000)
          if hashlib.sha256(raw).hexdigest()!=source['sha256']:raise ValueError('Original source hash mismatch')
          (out/'original.zip').write_bytes(raw)
          files=m.flatten_zip(raw);report={'source_sha256':source['sha256'],'selected':{},'native_context':[]}
          for path,data in files.items():
              if any(t in path for t in ('swift_soar','pale_residence/decor','pale_residence_decor','pale_residence_deko')):
                  obj={'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)}
                  if path.endswith(('.json','.mcfunction')):obj['text']=data.decode('utf-8')
                  report['selected'][path]=obj;print('ORIGINAL',path,json.dumps(obj,ensure_ascii=False))
          print('PALE_ALL_RESOURCES',json.dumps([p for p in files if 'pale_residence' in p]))
          for p in sorted(Path('.').rglob('*')):
              if not p.is_file() or any(t in p.parts for t in ('.git','functional-evidence')) or p.suffix not in ('.java','.py','.patch'):continue
              text=p.read_text(errors='replace');lines=text.splitlines()
              hits=[i for i,s in enumerate(lines) if any(t in s for t in ('sprint_on','sprint_off','ghasted_fireball_1','DNT_SAFE_RUNTIME_FUNCTIONS'))]
              if not hits:continue
              indexes=set()
              for i in hits[:10]: indexes.update(range(max(0,i-8),min(len(lines),i+13)))
              item={'path':p.as_posix(),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'context':[{'line':i+1,'text':lines[i]} for i in sorted(indexes)]}
              report['native_context'].append(item);print('BRIDGE_SOURCE',json.dumps(item,ensure_ascii=False))
          (out/'original-contract.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R3915-ORIGINAL-CONTRACT-${{ github.sha }}
          path: functional-evidence/
          if-no-files-found: error
          retention-days: 14
