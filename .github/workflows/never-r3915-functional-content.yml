name: R3915 Swift Soar restoration
on:
  push:
    branches: ['fix/neveroverworld-r3915-functional-content']
    paths: ['qa/field-r3915/**', '.github/workflows/never-r3915-functional-content.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r3915-${{ github.ref }}
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Test exact input guards and reproducible packaging
        run: python3 qa/field-r3915/test_restore.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10963935012'
          run-id: '36407606753'
          github-token: ${{ github.token }}
          path: inputs
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10928009164'
          run-id: '36308250793'
          github-token: ${{ github.token }}
          path: debug
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10965768659'
          run-id: '36414825586'
          github-token: ${{ github.token }}
          path: author
          merge-multiple: true
      - name: Restore exact effect and predicate graph, preserving unrelated data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,sys
          bases=list(Path('inputs').rglob('NeverOverworld.zip'))
          originals=list(Path('author').rglob('original.zip'))
          if len(bases)!=1 or len(originals)!=1:raise ValueError('Ambiguous input')
          subprocess.run([sys.executable,'qa/field-r3915/restore_swift.py','--base',str(bases[0]),'--original',str(originals[0]),'--out','artifacts/NeverOverworld-R3915.zip','--report','artifacts/swift-build.json'],check=True)
          PY
      - name: Resolve exact Java runtime and inspect available controller methods
        run: python3 qa/field-r3915/prepare_runtime.py
      - name: Require actual baseline, functional ticks, and current restart
        run: python3 qa/field-r3915/run_runtime.py
      - name: Preserve own source and all failures
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil,json,os
          out=Path('artifacts');(out/'source').mkdir(parents=True,exist_ok=True)
          for p in Path('qa/field-r3915').iterdir():
              if p.is_file():shutil.copyfile(p,out/'source'/p.name)
          shutil.copyfile('.github/workflows/never-r3915-functional-content.yml',out/'source/workflow.yml')
          (out/'provenance.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'production_accepted':False},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R3915-SWIFT-EVIDENCE-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
  cart-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10966478208'
          run-id: '36414508735'
          github-token: ${{ github.token }}
          path: cart-evidence
          merge-multiple: true
      - name: Read retained cart failure, do not reclassify it as acceptance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          out=Path('cart-diagnosis');out.mkdir()
          selected=[]
          for p in sorted(Path('cart-evidence').rglob('*')):
              if not p.is_file() or p.suffix not in ('.log','.json'):continue
              if not any(t in p.name for t in ('placement','phase','runtime','result')):continue
              text=p.read_text(errors='replace');rows=text.splitlines()
              if p.suffix=='.log':
                  indexes=set()
                  for i,line in enumerate(rows):
                      if any(t in line for t in ('AssertionError','R3914 CART','Exception','Caused by')):
                          indexes.update(range(max(0,i-3),min(len(rows),i+16)))
                  context='\n'.join(rows[i] for i in sorted(indexes))
              else:context=text
              selected.append({'file':p.as_posix(),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'context':context})
              print('RETAINED_CART_RESULT',p.as_posix(),context,flush=True)
          if not selected:raise ValueError('No actual retained cart error found')
          (out/'failure-context.json').write_text(json.dumps({'historical_failed_run':36414508735,'observations':selected,'runtime_reexecuted':False,'cart_accepted':False},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: R3915-CART-DIAGNOSIS-${{ github.sha }}
          path: cart-diagnosis/
          if-no-files-found: error
          retention-days: 14
