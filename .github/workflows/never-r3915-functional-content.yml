name: R3915 Swift Soar restoration
on:
  push:
    branches: ['fix/neveroverworld-r3915-functional-content']
    paths: ['qa/field-r3915/**', '.github/workflows/never-r3915-functional-content.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r3915-${{ github.ref }}
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10963935012'
          run-id: '36407606753'
          github-token: ${{ github.token }}
          path: inputs
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10928009164'
          run-id: '36308250793'
          github-token: ${{ github.token }}
          path: debug
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10965768659'
          run-id: '36414825586'
          github-token: ${{ github.token }}
          path: author
          merge-multiple: true
      - name: Restore exact effect and predicate graph, preserving unrelated data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,sys
          bases=list(Path('inputs').rglob('NeverOverworld.zip'))
          originals=list(Path('author').rglob('original.zip'))
          if len(bases)!=1 or len(originals)!=1:raise ValueError('Ambiguous input')
          subprocess.run([sys.executable,'qa/field-r3915/restore_swift.py','--base',str(bases[0]),'--original',str(originals[0]),'--out','artifacts/NeverOverworld-R3915.zip','--report','artifacts/swift-build.json'],check=True)
          PY
      - name: Resolve exact Java runtime and inspect available controller methods
        run: python3 qa/field-r3915/prepare_runtime.py
      - name: Real runtime verification when harness has been committed
        run: |
          if [ -f qa/field-r3915/run_runtime.py ]; then
            python3 qa/field-r3915/run_runtime.py
          else
            echo 'R3915 runtime not implemented yet; this run is build only, not accepted.'
          fi
      - name: Preserve own source and all failures
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil,json,os
          out=Path('artifacts');(out/'source').mkdir(parents=True,exist_ok=True)
          for p in Path('qa/field-r3915').iterdir():
              if p.is_file():shutil.copyfile(p,out/'source'/p.name)
          shutil.copyfile('.github/workflows/never-r3915-functional-content.yml',out/'source/workflow.yml')
          (out/'provenance.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'production_accepted':False},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R3915-SWIFT-EVIDENCE-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
