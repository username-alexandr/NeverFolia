name: R3937 NeverNether structure integration
on:
  push:
    branches: ['fix/nevernether-r3937-structure-integration']
    paths:
      - 'qa/field-r3937/**'
      - 'scripts/build-never-nether-structure-pack.py'
      - 'scripts/harden-never-nether-structure-pack.py'
      - 'worldgen-spec/never-nether-structures.json'
      - 'worldgen-sources/never-nether/manifest.json'
      - '.github/workflows/never-r3937-nether-structures.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: r3937-nether-structures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '25'}

      - name: Download accepted R39.36 baseline
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '11146831901'
          run-id: 36829577014
          github-token: '${{ github.token }}'
          path: baseline-r3936
          merge-multiple: true

      - name: Build integrated NeverNether
        id: build
        run: |
          mkdir -p artifacts
          python3 -m py_compile qa/field-r3937/*.py scripts/build-never-nether-structure-pack.py scripts/harden-never-nether-structure-pack.py
          set -o pipefail
          python3 qa/field-r3937/build.py 2>&1 | tee artifacts/r3937-build-command.log

      - name: Runtime registry QA
        id: runtime
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          python3 qa/field-r3937/runtime.py 2>&1 | tee artifacts/r3937-runtime-command.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R3937-EVIDENCE-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

      - name: Package manual test
        if: steps.build.outcome == 'success' && steps.runtime.outcome == 'success'
        run: python3 qa/field-r3937/package.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.build.outcome == 'success' && steps.runtime.outcome == 'success'
        with:
          name: NeverFolia-R39.37-NeverNether-Structures-TEST-${{ github.sha }}
          path: test-kit-r3937/
          retention-days: 14
          if-no-files-found: error

      - name: Require accepted automated gates
        if: always()
        env:
          BUILD: '${{ steps.build.outcome }}'
          RUNTIME: '${{ steps.runtime.outcome }}'
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          assert os.environ['BUILD']=='success' and os.environ['RUNTIME']=='success'
          b=json.loads(Path('artifacts/build-r3937.json').read_text())
          r=json.loads(Path('artifacts/runtime-r3937.json').read_text())
          assert b['build_pass'] is True and r['pass'] is True
          assert b['approved_custom_structure_count'] == 20
          assert b['structure_set_count'] == 4
          assert b['third_party_structure_sets_imported'] is False
          assert r['registry']['custom_present'] == 20
          assert not r['registry']['missing']
          assert not r['registry']['vanilla_missing']
          print('R39.37 NeverNether structure integration gates passed.')
          PY
