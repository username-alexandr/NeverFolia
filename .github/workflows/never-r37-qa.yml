name: NeverFolia FIELD-R37 focused QA
on:
  push:
    branches: ['wip/neveroverworld-r37-continuation']
    paths:
      - 'scripts/**'
      - 'qa/**'
      - 'worldgen-spec/**'
      - 'build.env'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r37-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile exact candidate and execute focused regressions
        run: bash qa/field-r37/run-ci.sh
      - name: Upload candidate inputs and honest QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeverFolia-R37-CANDIDATE-${{ github.sha }}
          path: |
            artifacts/server.jar
            artifacts/NeverOverworld.zip
            artifacts/NeverNether.zip
            artifacts/*.json
            artifacts/*.log
            artifacts/*.txt
            artifacts/*.md
          retention-days: 14
          if-no-files-found: warn
