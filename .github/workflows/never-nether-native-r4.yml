name: NeverNether R4 Native Compile and Codec
on:
  push:
    branches: [wip/nevernether-field-r1]
    paths:
      - 'native/nevernether/**'
      - 'scripts/apply-never-nether-native-adapters-r4.py'
      - '.github/workflows/never-nether-native-r4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Pure quota regressions
        run: |
          set -euo pipefail
          mkdir -p artifacts .work/quota-tests
          git rev-parse HEAD > artifacts/SOURCE-SHA.txt
          javac -d .work/quota-tests native/nevernether/java/net/minecraft/world/level/levelgen/structure/pools/NeverNetherPieceBudget.java native/nevernether/test/NeverNetherPieceBudgetTest.java
          java -cp .work/quota-tests NeverNetherPieceBudgetTest | tee artifacts/budget-tests.log
          python3 scripts/apply-never-nether-native-adapters-r4.py --self-test
      - name: Compile on the inspected Folia 26.2 API and exercise codecs
        run: |
          set -euo pipefail
          git config --global user.email actions@github.com
          git config --global user.name 'NeverFolia CI'
          bash scripts/prepare-upstream.sh
          git -C .work/Folia rev-parse HEAD > artifacts/FOLIA-SHA.txt
          test "$(cat artifacts/FOLIA-SHA.txt)" = 14b7fee5c866fca9a40ede4a58998fb928140f65
          bash scripts/apply-folia-patches-ci.sh .work/Folia
          python3 scripts/apply-never-nether-native-adapters-r4.py .work/Folia --include-smoke-test
          cat > .work/native-smoke.init.gradle <<'GROOVY'
          gradle.projectsEvaluated {
              def server = gradle.rootProject.project(':folia-server')
              server.tasks.register('neverNetherNativeSmoke', JavaExec) {
                  dependsOn server.tasks.named('classes')
                  classpath = server.sourceSets.main.runtimeClasspath
                  mainClass = 'net.minecraft.world.level.levelgen.structure.pools.NeverNetherNativeSmoke'
                  jvmArgs '-ea'
              }
          }
          GROOVY
          (cd .work/Folia && ./gradlew :folia-server:compileJava :folia-server:neverNetherNativeSmoke -I ../native-smoke.init.gradle --stacktrace) 2>&1 | tee artifacts/native-compile-codec.log
          printf '%s\n' 'PASS: native adapters compile and bootstrap/codec smoke passes on inspected Folia 26.2. No worldgen, no complete NeverFolia production-chain build, no monument import.' > artifacts/STATUS.txt
      - name: Capture verification scope and checksums
        if: always()
        run: |
          mkdir -p artifacts
          git ls-files native/nevernether | xargs sha256sum > artifacts/NATIVE-SOURCE-SHA256.txt
          printf '%s\n' 'This job tests only quota and void-filter adapters. It does not port pillar/noise/random processors, repair monument loot, or generate a world.' > artifacts/SCOPE.txt
          (cd artifacts && sha256sum *.txt *.log > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeverNether-native-r4-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
