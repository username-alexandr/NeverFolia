name: TEST1 Field QA

on:
  push:
    branches:
      - wip/test1-field-qa-r2
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  field-qa:
    name: Frozen TEST1 field regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout QA harness
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Self-test field regression auditors
        run: |
          python3 ./scripts/audit-never-overworld-cave-topology.py --self-test
          python3 ./scripts/audit-never-overworld-flood-surface.py --self-test
          python3 ./scripts/audit-never-overworld-field-pack.py --self-test

      - name: Resolve latest successful frozen integration artifact
        id: integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATA="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?branch=wip%2Fneverfolia-test1-integration&status=success&per_page=1")"
          RUN_ID="$(jq -r '.workflow_runs[0].id // empty' <<<"${DATA}")"
          SHA="$(jq -r '.workflow_runs[0].head_sha // empty' <<<"${DATA}")"
          if [ -z "${RUN_ID}" ] || [ -z "${SHA}" ]; then
            echo 'No successful frozen integration Build NeverFolia run found.' >&2
            exit 1
          fi
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=NeverFolia-${SHA}" >> "${GITHUB_OUTPUT}"
          echo "Frozen integration run: ${RUN_ID} @ ${SHA}"

      - name: Download frozen integration artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ steps.integration.outputs.artifact_name }}
          path: frozen-artifact
          github-token: ${{ github.token }}
          run-id: ${{ steps.integration.outputs.run_id }}

      - name: Verify frozen TEST1 datapack field contract
        run: |
          set -euo pipefail
          PACK="$(find frozen-artifact -type f -name 'NeverOverworld-Core-*.zip' | sort | head -n 1)"
          test -n "${PACK}"
          python3 ./scripts/audit-never-overworld-field-pack.py \
            --input "${PACK}" \
            --output artifacts/NeverOverworld-field-pack-audit.json

      - name: Regenerate frozen TEST1 smoke world
        run: |
          set -euo pipefail
          JAR="$(find frozen-artifact -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          PACK="$(find frozen-artifact -type f -name 'NeverOverworld-Core-*.zip' | sort | head -n 1)"
          test -n "${JAR}"
          test -n "${PACK}"
          chmod +x ./scripts/smoke-test-never-overworld-runtime.sh
          ./scripts/smoke-test-never-overworld-runtime.sh "${JAR}" "${PACK}"

      - name: Gate giant canyon and rectangular cave regressions
        run: |
          python3 ./scripts/audit-never-overworld-cave-topology.py \
            --world overworld-smoke-test/world \
            --max-chunks 1024 \
            --min-y -496 \
            --max-y -96 \
            --fail-vertical-run-above 160 \
            --fail-identical-mask-run-above 32 \
            --output artifacts/NeverOverworld-cave-topology-field-gate.json

      - name: Gate flooded trees rails flora and surface ores
        run: |
          python3 ./scripts/audit-never-overworld-flood-surface.py \
            --world overworld-smoke-test/world \
            --max-chunks 1024 \
            --fail-on-violations \
            --output artifacts/NeverOverworld-flood-surface-audit.json

      - name: Upload TEST1 field QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TEST1-field-qa-${{ steps.integration.outputs.sha }}
          path: |
            artifacts/NeverOverworld-field-pack-audit.json
            artifacts/NeverOverworld-cave-topology-audit.json
            artifacts/NeverOverworld-cave-topology-field-gate.json
            artifacts/NeverOverworld-flood-surface-audit.json
            overworld-smoke-test/server.log
          if-no-files-found: warn
          retention-days: 30
