name: R3931 native sea 128
on:
  push:
    branches: ['fix/neveroverworld-r3931-native-sea128']
    paths: ['native/overworld-r3931/**','qa/field-r3931/**','.github/workflows/never-r3931-native-sea128.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '25'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '10939310250', run-id: 36340789810, github-token: '${{ github.token }}', path: baseline, merge-multiple: true}
      - name: Build native sea candidate
        id: build
        run: |
          mkdir -p artifacts
          python3 -m py_compile qa/field-r3931/*.py
          set -o pipefail
          python3 qa/field-r3931/build.py 2>&1 | tee artifacts/build-command.log
      - name: Compare natural baseline and native-sea worlds
        id: runtime
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          python3 qa/field-r3931/runtime.py 2>&1 | tee artifacts/runtime-command.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'R3931-EVIDENCE-${{ github.sha }}', path: artifacts/, retention-days: 14, if-no-files-found: error}
      - name: Package manual test
        if: steps.build.outcome == 'success' && steps.runtime.outcome == 'success'
        run: python3 qa/field-r3931/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.build.outcome == 'success' && steps.runtime.outcome == 'success'
        with: {name: 'NeverFolia-R39.31-Native-Sea128-TEST-${{ github.sha }}', path: test-kit/, retention-days: 14, if-no-files-found: error}
      - name: Require completed comparison
        if: always()
        env: {BUILD: '${{ steps.build.outcome }}', RUNTIME: '${{ steps.runtime.outcome }}'}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          assert os.environ['BUILD']=='success' and os.environ['RUNTIME']=='success'
          r=json.loads(Path('artifacts/runtime.json').read_text());assert r['pass'] is True
          print('R39.31 natural comparison completed; manual visual acceptance still required.')
          PY
