name: R3918 remaining resource recovery
on:
  push:
    branches: ['fix/neveroverworld-r3918-pale-decor-recovery']
    paths: ['qa/field-r3918/**', '.github/workflows/never-r3918-resource-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r3918-resources-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10980264434'
          run-id: '36446043000'
          github-token: ${{ github.token }}
          path: combined-input
          merge-multiple: true
      - name: Inspect actual missing templates and Pale Residence connectors
        run: python3 qa/field-r3918/inspect_resources.py
      - name: Retain exact own source and inspection evidence
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,os,shutil
          out=Path('r3918-evidence');(out/'source').mkdir(parents=True,exist_ok=True)
          for p in Path('qa/field-r3918').glob('*.py'):shutil.copyfile(p,out/'source'/p.name)
          shutil.copyfile('.github/workflows/never-r3918-resource-recovery.yml',out/'source/workflow.yml')
          (out/'provenance.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'user_world_changed':False,'production_accepted':False},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R3918-RESOURCE-EVIDENCE-${{ github.sha }}
          path: r3918-evidence/
          if-no-files-found: error
          retention-days: 14
