name: R398 FULL safety and controlled ocean regression
on:
  push:
    branches: ['fix/neveroverworld-r398-ordered-hydrostate']
    paths:
      - 'qa/field-r398/build_guarded.py'
      - 'qa/field-r398/R398FullChunkQa.java'
      - 'qa/field-r398/guard_runtime.py'
      - 'qa/field-r398/natural_runtime.py'
      - '.github/workflows/never-r398-full-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r398-full-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10927954200'
          run-id: 36308250793
          github-token: ${{ github.token }}
          path: baseline
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10928009164'
          run-id: 36308250793
          github-token: ${{ github.token }}
          path: debug
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10930701040'
          run-id: 36315038771
          github-token: ${{ github.token }}
          path: r393
          merge-multiple: true
      - name: Compile exact native sources with FULL guards
        id: build
        run: |
          mkdir -p artifacts
          set -o pipefail
          python3 qa/field-r398/build_guarded.py 2>&1 | tee artifacts/r398-build-command.log
      - name: Real FULL chunk baseline mutation and fixed preservation
        id: safety
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 qa/field-r398/guard_runtime.py 2>&1 | tee artifacts/r398-full-command.log
      - name: Six natural phases including baseline repeat and reverse
        id: natural
        if: steps.safety.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 qa/field-r398/natural_runtime.py 2>&1 | tee artifacts/r398-natural-command.log
      - name: Preserve exact source and outcome distinction
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          SAFETY: ${{ steps.safety.outcome }}
          NATURAL: ${{ steps.natural.outcome }}
        run: |
          mkdir -p artifacts/source/field-r398
          cp qa/field-r398/*.py qa/field-r398/*.java artifacts/source/field-r398/
          cp .github/workflows/never-r398-full-safety.yml artifacts/source/
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r={'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'build':os.environ['BUILD'],'full_guard':os.environ['SAFETY'],'natural':os.environ['NATURAL'],'production_accepted':False,'known_missing_templates':95,'full_gradle_build':False}
          r['candidate_files']={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('candidate').glob('*') if p.is_file()}
          Path('artifacts/r398-provenance.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R398-FULL-SAFETY-EVIDENCE-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
      - name: Keep full release gate strict
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          SAFETY: ${{ steps.safety.outcome }}
          NATURAL: ${{ steps.natural.outcome }}
        run: |
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          if os.environ['BUILD']!='success' or os.environ['SAFETY']!='success':raise SystemExit('Build/FULL safety not accepted')
          if os.environ['NATURAL']!='success':raise SystemExit('Natural absolute-order regression remains open; do not publish as a fixed generator')
          if json.loads(Path('artifacts/runtime.json').read_text()).get('bounded_regression_pass') is not True:raise SystemExit('Strict natural result not accepted')
          print('Bounded tests passed; full world, ice, 95 missing templates and GUI remain separate.')
          PY
