name: NeverNether Native API Probe
on:
  push:
    branches: [wip/nevernether-field-r1]
    paths: [.github/workflows/never-nether-native-api-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare exact upstream structure APIs
        run: |
          set -euo pipefail
          git config --global user.email actions@github.com
          git config --global user.name 'NeverFolia CI'
          bash scripts/prepare-upstream.sh
          bash scripts/apply-folia-patches-ci.sh .work/Folia
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/SOURCE-SHA.txt
          git -C .work/Folia rev-parse HEAD > artifacts/FOLIA-SHA.txt
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('.work/Folia/folia-server/src/minecraft/java')
          wanted = {'JigsawPlacement.java', 'JigsawStructure.java', 'SinglePoolElement.java', 'ListPoolElement.java', 'StructurePoolElementType.java', 'StructureProcessor.java', 'StructureProcessorType.java', 'RuleProcessor.java', 'StructureTemplate.java', 'StructurePlaceSettings.java', 'WorldGenLevel.java', 'ServerLevelAccessor.java', 'BuiltInRegistries.java', 'StructureTemplatePool.java'}
          paths = sorted(p for p in root.rglob('*.java') if p.name in wanted)
          missing = wanted - {p.name for p in paths}
          if missing: raise SystemExit(f'Native API files missing: {sorted(missing)}')
          with zipfile.ZipFile('artifacts/Native-API-source-inspection.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for p in paths: z.write(p, str(p.relative_to(root)))
          PY
          (cd artifacts && sha256sum *.zip *.txt > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: NeverNether-native-api-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
