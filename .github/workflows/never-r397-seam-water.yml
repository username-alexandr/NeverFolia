name: R397 combined water seam regression
on:
  push:
    branches: ['fix/neveroverworld-r397-seam-water']
    paths: ['qa/field-r397/**','native/overworld-r395/**','native/overworld-r38/NeverOverworldWaterPolicyR38.java','.github/workflows/never-r397-seam-water.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r397-${{ github.ref }}
  cancel-in-progress: true
jobs:
  seam:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10927954200'
          run-id: 36308250793
          github-token: ${{ github.token }}
          path: baseline
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10928009164'
          run-id: 36308250793
          github-token: ${{ github.token }}
          path: debug
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10930701040'
          run-id: 36315038771
          github-token: ${{ github.token }}
          path: r393
          merge-multiple: true
      - name: Compile actual combined policy and ocean closure
        id: build
        run: |
          mkdir -p artifacts
          set -o pipefail
          python3 qa/field-r397/build.py 2>&1 | tee artifacts/r397-build-command.log
      - name: Natural generation, restart, reverse and original-binary control
        id: runtime
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 qa/field-r397/runtime.py 2>&1 | tee artifacts/r397-runtime-command.log
      - name: Compare actual before-write seam witnesses
        id: witness
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 qa/field-r397/review.py 2>&1 | tee artifacts/r397-review-command.log
      - name: Retain exact source and failed evidence
        if: always()
        run: |
          mkdir -p artifacts/source
          cp -R qa/field-r397 native/overworld-r395 artifacts/source/
          cp native/overworld-r38/NeverOverworldWaterPolicyR38.java .github/workflows/never-r397-seam-water.yml artifacts/source/
          python3 - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          out={'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'production_accepted':False,'known_missing_templates':95}
          out['candidate_files']={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('candidate').glob('*') if p.is_file()}
          Path('artifacts/r397-provenance.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R397-SEAM-EVIDENCE-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
      - name: Strict combined regression gate
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          RUNTIME: ${{ steps.runtime.outcome }}
          WITNESS: ${{ steps.witness.outcome }}
        run: |
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          assert all(os.environ[k]=='success' for k in ('BUILD','RUNTIME','WITNESS')),dict(os.environ)
          report=json.loads(Path('artifacts/runtime.json').read_text())
          assert report['bounded_regression_pass'] is True
          assert report['baseline_reverse_equal'] is True
          assert report['restart_equal'] is True and report['reverse_equal'] is True
          print('Combined bounded water regression passed; not full generation acceptance.')
          PY
