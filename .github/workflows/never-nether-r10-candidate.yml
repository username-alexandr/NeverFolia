name: NeverNether R10 Substrate Candidate Compile
on:
  push:
    branches: [wip/nevernether-field-r1]
    paths:
      - 'qa/nevernether-r10/**'
      - 'scripts/*candidate-r10.py'
      - 'scripts/apply-never-nether-experiment-r10.py'
      - 'worldgen-spec/never-nether-r10-hooks.json'
      - '.github/workflows/never-nether-r10-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Source contracts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/SOURCE-SHA.txt
          git rev-parse HEAD^{tree} > artifacts/SOURCE-TREE.txt
          git archive --format=zip HEAD -o artifacts/source.zip
          python3 scripts/test-never-nether-candidate-r10.py 2>&1 | tee artifacts/candidate-contract-tests.log
      - name: Compile full normal chain plus opt-in R8 R9 R10
        run: |
          set -euo pipefail
          git config --global user.email actions@github.com
          git config --global user.name 'NeverFolia CI'
          bash scripts/prepare-upstream.sh
          test "$(git -C .work/Folia rev-parse HEAD)" = 14b7fee5c866fca9a40ede4a58998fb928140f65
          bash scripts/apply-folia-patches-ci.sh .work/Folia
          bash scripts/apply-neverfolia-post-patches.sh 2>&1 | tee artifacts/production-chain.log
          python3 scripts/apply-never-nether-experiment-r8.py .work/Folia --acknowledge-experimental-worldgen
          python3 scripts/apply-never-nether-experiment-r9.py .work/Folia --acknowledge-experimental-worldgen
          python3 scripts/apply-never-nether-experiment-r10.py .work/Folia --acknowledge-experimental-worldgen
          python3 scripts/apply-never-nether-experiment-r10.py .work/Folia --acknowledge-experimental-worldgen
          cp qa/nevernether-r10/NeverNetherCandidateR10Smoke.java .work/Folia/folia-server/src/minecraft/java/
          cat > .work/r10-smoke.init.gradle <<'GROOVY'
          gradle.projectsEvaluated {
              def server = gradle.rootProject.project(':folia-server')
              server.tasks.register('neverNetherR10Smoke', JavaExec) {
                  dependsOn server.tasks.named('classes')
                  classpath = server.sourceSets.main.runtimeClasspath
                  mainClass = 'NeverNetherCandidateR10Smoke'
                  jvmArgs '-ea'
              }
          }
          GROOVY
          (cd .work/Folia && ./gradlew :folia-server:compileJava :folia-server:neverNetherR10Smoke -I ../r10-smoke.init.gradle --no-configuration-cache --stacktrace) 2>&1 | tee artifacts/candidate-compile-smoke.log
          python3 - <<'PY'
          from pathlib import Path
          import json,zipfile
          root=Path('.work/Folia/folia-server/build/classes/java/main')
          profile=json.loads(Path('worldgen-spec/never-nether-r10-hooks.json').read_text())
          files=set()
          for name in profile['files']:
              p=root/Path(name).with_suffix('.class')
              if not p.is_file(): raise ValueError('Missing compiled source: '+name)
              files.add(p)
              files.update(p.parent.glob(p.stem+'$*.class'))
          files.update((root/'net/minecraft/world/level/levelgen/placement').glob('NeverNetherSubstrateR10*.class'))
          files.add(root/'NeverNetherCandidateR10Smoke.class')
          if len(files)<9 or not all(p.is_file() for p in files): raise ValueError('Candidate class export incomplete')
          with zipfile.ZipFile('artifacts/candidate-overlay.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for p in sorted(files): archive.write(p,p.relative_to(root).as_posix())
          PY
      - name: Record scope and hashes
        if: always()
        run: |
          mkdir -p artifacts
          printf '%s\n' 'R10 EXPERIMENT ONLY. Normal production chain unchanged. Immutable substrate/provenance is in memory, not persisted; restart/unload support is NOT accepted. CI compiles and unit-tests, but generates no world. No production server JAR.' > artifacts/SCOPE.txt
          git ls-files qa/nevernether-r10 scripts/*candidate-r10.py scripts/apply-never-nether-experiment-r10.py worldgen-spec/never-nether-r10-hooks.json | xargs sha256sum > artifacts/IMPLEMENTATION-SHA256.txt
          (cd artifacts && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeverNether-r10-candidate-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
