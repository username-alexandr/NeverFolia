name: NeverNether R14 Height API Inspection
on:
  push:
    branches: [wip/nevernether-field-r1]
    paths: [.github/workflows/never-nether-r14-height-api.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Inspect immutable R13 upstream and all height-sensitive sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/SOURCE-SHA.txt
          git config --global user.email actions@github.com
          git config --global user.name 'NeverFolia CI'
          python3 scripts/prepare-never-nether-r13-upstream.py
          bash scripts/apply-folia-patches-ci.sh .work/Folia
          bash scripts/apply-neverfolia-post-patches.sh > artifacts/production-chain.log 2>&1
          for stage in 8 9 10 11 12 13; do
            python3 "scripts/apply-never-nether-experiment-r${stage}.py" .work/Folia --acknowledge-experimental-worldgen
          done
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          root=Path('.work/Folia/folia-server/src/minecraft/java')
          names=['world/level/Level.java','world/level/LevelHeightAccessor.java','world/level/chunk/ChunkAccess.java','world/level/chunk/LevelChunk.java','world/level/chunk/ProtoChunk.java','world/level/chunk/LevelChunkSection.java','world/level/dimension/DimensionType.java','world/level/levelgen/NoiseSettings.java','world/level/levelgen/NoiseBasedChunkGenerator.java','server/level/WorldGenRegion.java','server/level/ServerLevel.java','server/level/ServerPlayerGameMode.java','server/network/ServerGamePacketListenerImpl.java','world/level/levelgen/feature/BasaltColumnsFeature.java','world/level/levelgen/feature/BasaltPillarFeature.java','world/level/levelgen/feature/BlockColumnFeature.java','world/level/levelgen/feature/ReplaceBlobsFeature.java','world/level/levelgen/structure/templatesystem/StructureTemplate.java']
          files={root/'net/minecraft'/n for n in names}
          files.update(root.rglob('NeverNether*.java'))
          files.update(root.rglob('SerializableChunkData.java'))
          manifest={}
          with zipfile.ZipFile('artifacts/r13-height-api.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(files):
                  raw=p.read_bytes();rel=p.relative_to(root).as_posix();z.writestr(rel,raw);manifest[rel]=hashlib.sha256(raw).hexdigest()
          Path('artifacts/API-SHA256.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
          printf '%s\n' 'Pinned source inspection only. No height change, world generation, build acceptance or release.' > artifacts/SCOPE.txt
          (cd artifacts && sha256sum *.zip *.json *.log *.txt > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeverNether-r14-height-api-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
