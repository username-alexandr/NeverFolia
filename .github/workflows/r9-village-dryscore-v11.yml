name: R9 Village Dry Score V11

on:
  push:
    branches:
      - qa/r9-village-dryscore-v11
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r9-village-dryscore-v11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build one V11 dry-score JAR
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout NeverFolia
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Configure Git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "NeverFolia CI"
      - name: Validate V11 contracts
        run: |
          python3 ./scripts/tune-never-overworld-village-locate-r9-v5.py --self-test
          python3 ./scripts/tune-never-overworld-village-dryscore-v11.py --self-test
          python3 ./scripts/adapt-never-overworld-highland-villages.py --self-test
          python3 ./scripts/audit-never-overworld-village-persisted-bbox.py --self-test
          bash -n ./scripts/probe-never-overworld-village-locate-r9-v2.sh
          bash -n ./scripts/qa-never-overworld-village-v4-bbox.sh
      - name: Prepare Folia 26.2.x upstream
        run: |
          chmod +x ./scripts/prepare-upstream.sh
          ./scripts/prepare-upstream.sh
      - name: Apply Folia patches
        run: |
          chmod +x ./scripts/apply-folia-patches-ci.sh
          ./scripts/apply-folia-patches-ci.sh ./.work/Folia
      - name: Apply NeverFolia post patches
        run: |
          chmod +x ./scripts/apply-neverfolia-post-patches.sh
          ./scripts/apply-neverfolia-post-patches.sh
      - name: Apply corrected V5 baseline
        run: python3 ./scripts/tune-never-overworld-village-locate-r9-v5.py ./.work/Folia
      - name: Apply V11 shared dry-score matrix
        run: python3 ./scripts/tune-never-overworld-village-dryscore-v11.py ./.work/Folia
      - name: Build runnable Paperclip JAR
        working-directory: .work/Folia
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew :folia-server:createPaperclipJar --stacktrace
      - name: Collect JAR and build V11 NeverOverworld pack
        run: |
          set -euo pipefail
          mkdir -p artifacts/v11-build
          JAR="$(find .work/Folia/folia-server/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources.jar' ! -name '*javadoc.jar' | sort | head -n 1)"
          test -n "${JAR}" && test -f "${JAR}"
          cp "${JAR}" artifacts/v11-build/NeverFolia-r9-village-v11.jar
          PACK="artifacts/v11-build/NeverOverworld-Core-r9-village-v11.zip"
          python3 ./scripts/build-never-overworld-core-pack.py --server-jar artifacts/v11-build/NeverFolia-r9-village-v11.jar --output "${PACK}"
          python3 ./scripts/build-never-overworld-native-structures.py --input "${PACK}"
          python3 ./scripts/normalize-never-overworld-structure-type.py --input "${PACK}"
          python3 ./scripts/fingerprint-never-overworld-pack.py --input "${PACK}" --inject
          python3 ./scripts/fingerprint-never-overworld-pack.py --input "${PACK}" --verify
      - name: Upload V11 runtime inputs
        uses: actions/upload-artifact@v4
        with:
          name: r9-village-v11-runtime-inputs-${{ github.sha }}
          path: artifacts/v11-build/*
          retention-days: 7

  matrix:
    name: ${{ matrix.profile }} / 10 locates + 5 starts + 5 bbox
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        profile:
          - score10
          - score9
          - score8
    env:
      JAVA_TOOL_OPTIONS: -Dneverfolia.villageDryScoreProfile=${{ matrix.profile }}
    steps:
      - name: Checkout NeverFolia
        uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Download shared V11 runtime inputs
        uses: actions/download-artifact@v5
        with:
          name: r9-village-v11-runtime-inputs-${{ github.sha }}
          path: artifacts/v11-build
      - name: Verify selected JVM profile
        run: |
          echo "JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS}"
          test "${JAVA_TOOL_OPTIONS}" = "-Dneverfolia.villageDryScoreProfile=${{ matrix.profile }}"
      - name: Run all 10 locate targets to persisted starts
        run: |
          chmod +x ./scripts/probe-never-overworld-village-locate-r9-v2.sh
          ./scripts/probe-never-overworld-village-locate-r9-v2.sh \
            artifacts/v11-build/NeverFolia-r9-village-v11.jar \
            artifacts/v11-build/NeverOverworld-Core-r9-village-v11.zip
      - name: Preserve locate proof
        if: always()
        run: |
          mkdir -p "artifacts/v11-${{ matrix.profile }}/locate"
          cp -f artifacts/village-locate-r9-v2-proof.json "artifacts/v11-${{ matrix.profile }}/locate/" 2>/dev/null || true
          cp -f overworld-village-locate-r9-v2-test/*.tsv "artifacts/v11-${{ matrix.profile }}/locate/" 2>/dev/null || true
          cp -f overworld-village-locate-r9-v2-test/*.log "artifacts/v11-${{ matrix.profile }}/locate/" 2>/dev/null || true
      - name: Run full persisted Jigsaw bbox water=0 proof
        run: |
          chmod +x ./scripts/qa-never-overworld-village-v4-bbox.sh
          ./scripts/qa-never-overworld-village-v4-bbox.sh \
            artifacts/v11-build/NeverFolia-r9-village-v11.jar \
            artifacts/v11-build/NeverOverworld-Core-r9-village-v11.zip \
            "artifacts/v11-${{ matrix.profile }}/bbox" \
            "${GITHUB_SHA}-${{ matrix.profile }}"
      - name: Assert runtime used selected profile
        if: always()
        run: |
          logs="$(find overworld-village-locate-r9-v2-test village-v4-bbox-test -type f -name '*.log' -print 2>/dev/null | tr '\n' ' ')"
          if [ -n "${logs}" ]; then grep -h "profile=${{ matrix.profile }}" ${logs} | head -n 8 || true; fi
      - name: Upload V11 profile proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R9-village-v11-${{ matrix.profile }}-${{ github.sha }}
          path: |
            artifacts/v11-${{ matrix.profile }}/**/*
            village-v4-bbox-test/locate-*.log
          if-no-files-found: warn
          retention-days: 14
