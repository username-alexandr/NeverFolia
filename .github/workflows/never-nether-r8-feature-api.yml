name: NeverNether R8 Feature API Probe
on:
  push:
    branches: [wip/nevernether-field-r1]
    paths: [.github/workflows/never-nether-r8-feature-api.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Generate pinned upstream sources and export narrow inspection set
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.email actions@github.com
          git config --global user.name 'NeverFolia CI'
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/SOURCE-SHA.txt
          bash scripts/prepare-upstream.sh
          test "$(git -C .work/Folia rev-parse HEAD)" = 14b7fee5c866fca9a40ede4a58998fb928140f65
          bash scripts/apply-folia-patches-ci.sh .work/Folia
          bash scripts/apply-neverfolia-post-patches.sh > artifacts/production-transformers.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          root=Path('.work/Folia/folia-server/src/minecraft/java')
          names=[
            'world/level/levelgen/feature/HugeFungusFeature.java',
            'world/level/levelgen/feature/NetherForestVegetationFeature.java',
            'world/level/levelgen/feature/WeepingVinesFeature.java',
            'world/level/levelgen/feature/TwistingVinesFeature.java',
            'world/level/levelgen/placement/CountOnEveryLayerPlacement.java',
            'world/level/levelgen/placement/PlacedFeature.java',
            'world/level/levelgen/placement/PlacementContext.java',
            'world/level/chunk/ChunkGenerator.java',
            'world/level/chunk/status/ChunkStatusTasks.java',
            'world/level/chunk/status/ChunkPyramid.java',
            'server/level/WorldGenRegion.java',
            'world/level/levelgen/structure/templatesystem/StructureTemplate.java',
            'world/level/levelgen/structure/templatesystem/StructurePlaceSettings.java',
            'world/level/levelgen/structure/pools/SinglePoolElement.java',
            'world/level/levelgen/structure/PoolElementStructurePiece.java']
          manifest={}
          with zipfile.ZipFile('artifacts/feature-api.zip','w',zipfile.ZIP_DEFLATED) as z:
            for name in names:
              path=Path('net/minecraft')/name
              data=(root/path).read_bytes()
              z.writestr(str(path),data)
              manifest[str(path)]=hashlib.sha256(data).hexdigest()
          Path('artifacts/API-SHA256.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
          printf '%s\n' 'Inspection sources only, not a compiled build, field test or release.' > artifacts/SCOPE.txt
          (cd artifacts && sha256sum *.zip *.txt *.json *.log > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: NeverNether-r8-feature-api-${{ github.sha }}
          path: artifacts/*
          retention-days: 7
          if-no-files-found: error
