name: Benchmark NeverOverworld Ore Balance

on:
  push:
    branches:
      - 'wip/never-overworld-vanilla-ore-density*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-latest
  cancel-in-progress: true

jobs:
  benchmark:
    name: True vanilla 26.2 ore reference
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASELINE_RUN_ID: '33744350673'
      BASELINE_SHA: '0cadfea8ff1b6273abe64108c10afd6b60deb2ba'
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout NeverFolia repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Download proven baseline NeverFolia JAR
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASELINE_RUN_ID}/artifacts" \
            --jq ".artifacts[] | select(.name == \"NeverFolia-${BASELINE_SHA}\") | .id" | head -n1)"
          test -n "${ARTIFACT_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/neverfolia-baseline.zip
          unzip -q /tmp/neverfolia-baseline.zip -d /tmp/neverfolia-baseline
          JAR="$(find /tmp/neverfolia-baseline -type f -name 'NeverFolia-*.jar' | sort | head -n1)"
          test -n "${JAR}"
          cp "${JAR}" artifacts/NeverFolia-baseline.jar

      - name: Generate true vanilla 26.2 reference sample
        run: |
          set -euo pipefail
          chmod +x ./scripts/smoke-test-vanilla-ore-reference.sh
          ./scripts/smoke-test-vanilla-ore-reference.sh artifacts/NeverFolia-baseline.jar

      - name: Audit true vanilla 26.2 ore density
        run: |
          set -euo pipefail
          python3 ./scripts/audit-vanilla-ore-reference.py \
            --world vanilla-ore-reference-test/world \
            --max-chunks 1024 \
            --output artifacts/Vanilla-26.2-ore-reference.json

      - name: Upload vanilla ore reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vanilla-26.2-ore-reference-${{ github.sha }}
          path: |
            artifacts/Vanilla-26.2-ore-reference.json
            vanilla-ore-reference-test/server.log
          if-no-files-found: warn
          retention-days: 14
