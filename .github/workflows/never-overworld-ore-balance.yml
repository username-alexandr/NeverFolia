name: Benchmark NeverOverworld Ore Balance

on:
  push:
    branches:
      - 'wip/never-overworld-vanilla-ore-density*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-latest
  cancel-in-progress: true

jobs:
  benchmark:
    name: NR-DEV-1 vanilla-like ore density gate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout NeverFolia repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Self-test ore balance auditor and density gate
        run: |
          python3 ./scripts/audit-never-overworld-ore-balance.py --self-test
          python3 ./scripts/gate-never-overworld-vanilla-ore-density.py --self-test

      - name: Wait for current compiled NeverFolia JAR
        run: |
          set -euo pipefail
          mkdir -p artifacts
          TARGET_NAME="NeverFolia-compiled-${GITHUB_SHA}"
          ARTIFACT_ID=""
          BUILD_RUN_ID=""
          for _ in $(seq 1 120); do
            BUILD_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=push&per_page=30" \
              --jq '.workflow_runs[] | select(.name == "Build NeverFolia") | .id' | head -n1)"
            if [ -n "${BUILD_RUN_ID}" ]; then
              ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}/artifacts" \
                --jq ".artifacts[] | select(.name == \"${TARGET_NAME}\") | .id" | head -n1)"
            fi
            if [ -n "${ARTIFACT_ID}" ]; then
              break
            fi
            sleep 15
          done
          if [ -z "${ARTIFACT_ID}" ]; then
            echo "Current compiled artifact ${TARGET_NAME} was not published by Build NeverFolia." >&2
            echo "Build run seen: ${BUILD_RUN_ID:-none}" >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/neverfolia-current.zip
          unzip -q /tmp/neverfolia-current.zip -d /tmp/neverfolia-current
          JAR="$(find /tmp/neverfolia-current -type f -name 'NeverFolia-*.jar' | sort | head -n1)"
          if [ -z "${JAR}" ]; then
            echo 'Current NeverFolia JAR missing from compiled artifact.' >&2
            exit 1
          fi
          cp "${JAR}" artifacts/NeverFolia-current.jar
          echo "Current build run: ${BUILD_RUN_ID}"
          echo "Compiled artifact: ${ARTIFACT_ID}"

      - name: Build current NeverOverworld pack against current JAR
        run: |
          set -euo pipefail
          PACK="artifacts/NeverOverworld-Core-NR-DEV-1-balance-benchmark.zip"
          python3 ./scripts/build-never-overworld-core-pack.py \
            --server-jar artifacts/NeverFolia-current.jar \
            --output "${PACK}"
          python3 ./scripts/build-never-overworld-native-structures.py --input "${PACK}"
          python3 ./scripts/normalize-never-overworld-structure-type.py --input "${PACK}"
          python3 ./scripts/fingerprint-never-overworld-pack.py --input "${PACK}" --inject
          python3 ./scripts/fingerprint-never-overworld-pack.py --input "${PACK}" --verify

      - name: Generate deterministic NeverOverworld sample
        run: |
          set -euo pipefail
          chmod +x ./scripts/smoke-test-never-overworld-runtime.sh
          ./scripts/smoke-test-never-overworld-runtime.sh \
            artifacts/NeverFolia-current.jar \
            artifacts/NeverOverworld-Core-NR-DEV-1-balance-benchmark.zip

      - name: Generate true vanilla 26.2 reference sample
        run: |
          set -euo pipefail
          chmod +x ./scripts/smoke-test-vanilla-ore-reference.sh
          ./scripts/smoke-test-vanilla-ore-reference.sh artifacts/NeverFolia-current.jar

      - name: Compare deep density with true vanilla 26.2 FULL chunks
        run: |
          set -euo pipefail
          python3 ./scripts/audit-never-overworld-ore-balance.py \
            --world overworld-smoke-test/world \
            --vanilla-world vanilla-ore-reference-test/world \
            --max-chunks 1024 \
            --output artifacts/NeverOverworld-ore-balance-audit.json

      - name: Enforce vanilla-like deep ore density
        run: |
          set -euo pipefail
          python3 ./scripts/gate-never-overworld-vanilla-ore-density.py \
            --world overworld-smoke-test/world \
            --max-chunks 1024 \
            --min-ratio 0.65 \
            --max-ratio 1.35 \
            --output artifacts/NeverOverworld-vanilla-like-ore-density.json

      - name: Upload ore balance benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeverOverworld-ore-balance-${{ github.sha }}
          path: |
            artifacts/NeverOverworld-ore-balance-audit.json
            artifacts/NeverOverworld-vanilla-like-ore-density.json
            overworld-smoke-test/server.log
            vanilla-ore-reference-test/server.log
          if-no-files-found: warn
          retention-days: 14
