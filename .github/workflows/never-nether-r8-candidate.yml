name: NeverNether R8 Candidate Compile
on:
  push:
    branches: [wip/nevernether-field-r1]
    paths:
      - 'qa/nevernether-r8/**'
      - 'scripts/*stages-r8.py'
      - 'scripts/apply-never-nether-experiment-r8.py'
      - '.github/workflows/never-nether-r8-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Stage comparison contracts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/SOURCE-SHA.txt
          python3 -m pip install numpy==2.3.5
          python3 scripts/test-never-nether-stages-r8.py 2>&1 | tee artifacts/stage-contract-tests.log
      - name: Compile candidate after normal production chain
        run: |
          set -euo pipefail
          git config --global user.email actions@github.com
          git config --global user.name 'NeverFolia CI'
          bash scripts/prepare-upstream.sh
          test "$(git -C .work/Folia rev-parse HEAD)" = 14b7fee5c866fca9a40ede4a58998fb928140f65
          bash scripts/apply-folia-patches-ci.sh .work/Folia
          bash scripts/apply-neverfolia-post-patches.sh 2>&1 | tee artifacts/production-chain.log
          python3 scripts/apply-never-nether-experiment-r8.py .work/Folia --acknowledge-experimental-worldgen
          python3 scripts/apply-never-nether-experiment-r8.py .work/Folia --acknowledge-experimental-worldgen
          cp qa/nevernether-r8/NeverNetherCandidateSmoke.java .work/Folia/folia-server/src/minecraft/java/
          cat > .work/r8-smoke.init.gradle <<'GROOVY'
          gradle.projectsEvaluated {
              def server = gradle.rootProject.project(':folia-server')
              server.tasks.register('neverNetherR8Smoke', JavaExec) {
                  dependsOn server.tasks.named('classes')
                  classpath = server.sourceSets.main.runtimeClasspath
                  mainClass = 'NeverNetherCandidateSmoke'
                  jvmArgs '-ea'
              }
          }
          GROOVY
          (cd .work/Folia && ./gradlew :folia-server:compileJava :folia-server:neverNetherR8Smoke -I ../r8-smoke.init.gradle --no-configuration-cache --stacktrace) 2>&1 | tee artifacts/candidate-compile-smoke.log
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('.work/Folia/folia-server/build/classes/java/main')
          rel=Path('net/minecraft/world/level/levelgen/placement')
          files=list((root/rel).glob('NeverNether*R8*.class')) + [root/rel/'PlacedFeature.class',root/'NeverNetherCandidateSmoke.class']
          if len(files)<6 or not all(p.is_file() for p in files): raise ValueError('Candidate class export incomplete')
          with zipfile.ZipFile('artifacts/candidate-overlay.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for p in sorted(files): archive.write(p,p.relative_to(root).as_posix())
          PY
      - name: Record exact scope and hashes
        if: always()
        run: |
          mkdir -p artifacts
          printf '%s\n' 'R8 EXPERIMENT ONLY. Normal production chain is unchanged. CI compiles and unit-tests the optional candidate; no source assets or worlds are generated here. Full worldgen acceptance remains separate.' > artifacts/SCOPE.txt
          git ls-files qa/nevernether-r8 scripts/*stages-r8.py scripts/apply-never-nether-experiment-r8.py | xargs sha256sum > artifacts/IMPLEMENTATION-SHA256.txt
          (cd artifacts && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeverNether-r8-candidate-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
