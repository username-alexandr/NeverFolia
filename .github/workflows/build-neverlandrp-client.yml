name: Build NeverLandRP Fabric Client 1.3.0

on:
  push:
    branches:
      - build/neverlandrp-fabric-130-20261025
    paths:
      - rp-client-source.b64
      - .github/workflows/build-neverlandrp-client.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Extract RP project
        shell: bash
        run: |
          mkdir -p rp-client
          base64 -d rp-client-source.b64 > /tmp/neverlandrp-source.zip
          echo 'd484519ad76349e221f806884f72e011e3dda82fb56e9bd269fa07171fe0944d  /tmp/neverlandrp-source.zip' | sha256sum --check
          unzip -q /tmp/neverlandrp-source.zip -d rp-client
      - name: Build NeverLandRP Fabric mod
        working-directory: rp-client
        run: gradle --no-daemon --stacktrace clean build
      - name: Verify output JAR and metadata
        shell: bash
        run: |
          set -euo pipefail
          JAR=rp-client/build/libs/NeverLandRP-Fabric-26.2-1.3.0.jar
          test -s "$JAR"
          unzip -t "$JAR" | tail -n 2
          unzip -p "$JAR" fabric.mod.json | grep -F '"fabricloader": ">=0.19.4"'
          unzip -Z1 "$JAR" | grep -Fx 'online/neverland/rp/client/RpAnimationsClient.class'
          sha256sum "$JAR"
      - name: Upload ready-to-install JAR
        uses: actions/upload-artifact@v4
        with:
          name: NeverLandRP-Fabric-26.2-1.3.0
          path: rp-client/build/libs/NeverLandRP-Fabric-26.2-1.3.0.jar
          if-no-files-found: error
          retention-days: 30
