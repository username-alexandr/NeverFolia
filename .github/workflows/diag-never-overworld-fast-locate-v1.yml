name: Gate NeverOverworld fast locate v1

on:
  push:
    branches:
      - wip/never-overworld-fast-locate-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Fast locate v1 self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate NeverOverworld structures contract
        run: python3 ./scripts/validate-never-overworld-structures-spec.py
      - name: Self-test native placement resolver
        run: |
          python3 ./scripts/apply-never-overworld-placement-hook.py --self-test
          python3 ./scripts/normalize-never-overworld-placement-chunkpos-api.py --self-test
      - name: Self-test predictive fast locate transformer
        run: python3 ./scripts/apply-never-overworld-fast-locate.py --self-test
      - name: Self-test structure pack builder
        run: python3 ./scripts/build-never-overworld-native-structures.py --self-test
      - name: Shell-check fast locate runtime probe
        run: bash -n ./scripts/probe-never-overworld-fast-locate.sh

  runtime:
    name: Java 25 zero-generation locate proof
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Configure Git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "NeverFolia CI"
      - name: Prepare Folia 26.2.x upstream
        run: |
          chmod +x ./scripts/prepare-upstream.sh
          ./scripts/prepare-upstream.sh
      - name: Apply Folia patches
        run: |
          chmod +x ./scripts/apply-folia-patches-ci.sh
          ./scripts/apply-folia-patches-ci.sh ./.work/Folia
      - name: Apply NeverFolia post-patch chain including fast locate
        run: |
          chmod +x ./scripts/apply-neverfolia-post-patches.sh
          ./scripts/apply-neverfolia-post-patches.sh
      - name: Build runnable Paperclip JAR
        working-directory: .work/Folia
        run: ./gradlew :folia-server:createPaperclipJar --stacktrace
      - name: Collect test JAR
        run: |
          set -euo pipefail
          mkdir -p artifacts
          JAR="$(find .work/Folia/folia-server/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources.jar' ! -name '*javadoc.jar' | sort | head -n 1)"
          test -n "${JAR}"
          cp "${JAR}" artifacts/NeverFolia-fast-locate-v1.jar
      - name: Build native-only NR Core with structures v1
        run: |
          set -euo pipefail
          python3 ./scripts/build-never-overworld-core-pack.py \
            --server-jar artifacts/NeverFolia-fast-locate-v1.jar \
            --output artifacts/NeverOverworld-Core-fast-locate-v1.zip
          python3 ./scripts/promote-never-overworld-native-geology-pack.py \
            --input artifacts/NeverOverworld-Core-fast-locate-v1.zip
          python3 ./scripts/build-never-overworld-native-structures.py \
            --input artifacts/NeverOverworld-Core-fast-locate-v1.zip
          python3 ./scripts/normalize-never-overworld-structure-type.py \
            --input artifacts/NeverOverworld-Core-fast-locate-v1.zip
          python3 ./scripts/fingerprint-never-overworld-pack.py \
            --input artifacts/NeverOverworld-Core-fast-locate-v1.zip --inject
          python3 ./scripts/fingerprint-never-overworld-pack.py \
            --input artifacts/NeverOverworld-Core-fast-locate-v1.zip --verify
      - name: Prove locate creates zero chunks and predicts real natural start
        run: |
          chmod +x ./scripts/probe-never-overworld-fast-locate.sh
          ./scripts/probe-never-overworld-fast-locate.sh \
            artifacts/NeverFolia-fast-locate-v1.jar \
            artifacts/NeverOverworld-Core-fast-locate-v1.zip
      - name: Upload fast locate proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeverOverworld-fast-locate-v1-${{ github.sha }}
          path: |
            artifacts/fast-locate-proof.json
            artifacts/NeverOverworld-Core-fast-locate-v1.zip
            overworld-fast-locate-test/server.log
            overworld-fast-locate-test/prediction.json
            overworld-fast-locate-test/chunks-before-locate.txt
            overworld-fast-locate-test/chunks-after-locate.txt
          if-no-files-found: warn
          retention-days: 14
