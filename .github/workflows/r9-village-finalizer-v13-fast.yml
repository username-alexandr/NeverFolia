name: R9 Village V13 Finalizer Fast

on:
  push:
    branches:
      - qa/r9-village-finalizer-v13
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate corrected V5 baseline
        run: python3 ./scripts/tune-never-overworld-village-locate-r9-v5.py --self-test
      - name: Validate V13 production finalizer
        run: python3 ./scripts/finalize-never-overworld-village-footprint-v13.py --self-test
