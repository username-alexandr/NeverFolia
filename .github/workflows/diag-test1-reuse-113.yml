name: Diagnose TEST1 from build 113

on:
  push:
    branches:
      - diag/test1-reuse-113
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    name: Reuse #113 JAR / integration + determinism
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Download compiled JAR from build #113
        uses: actions/download-artifact@v4
        with:
          name: NeverFolia-compiled-2892c24ff3911444d46ead12388266e9a5958f86
          path: artifacts
          github-token: ${{ github.token }}
          run-id: 33654624910

      - name: Build and fingerprint TEST1 packs
        run: |
          set -euo pipefail
          JAR="$(find artifacts -maxdepth 1 -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          test -n "${JAR}"
          python3 ./scripts/build-never-nether-core-test1-pack.py --output artifacts/NeverNether-Core-NN-DEV-1-test1.zip
          python3 ./scripts/fingerprint-never-nether-pack.py --input artifacts/NeverNether-Core-NN-DEV-1-test1.zip --inject
          python3 ./scripts/fingerprint-never-nether-pack.py --input artifacts/NeverNether-Core-NN-DEV-1-test1.zip --verify
          python3 ./scripts/build-never-overworld-core-pack.py --server-jar "${JAR}" --output artifacts/NeverOverworld-Core-NR-DEV-1-test1.zip
          python3 ./scripts/fingerprint-never-overworld-pack.py --input artifacts/NeverOverworld-Core-NR-DEV-1-test1.zip --inject
          python3 ./scripts/fingerprint-never-overworld-pack.py --input artifacts/NeverOverworld-Core-NR-DEV-1-test1.zip --verify

      - name: Verify combined TEST1 runtime with corrected storage resolver
        run: |
          set -euo pipefail
          JAR="$(find artifacts -maxdepth 1 -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          chmod +x ./scripts/smoke-test-neverfolia-test1-integration.sh
          ./scripts/smoke-test-neverfolia-test1-integration.sh \
            "${JAR}" \
            artifacts/NeverOverworld-Core-NR-DEV-1-test1.zip \
            artifacts/NeverNether-Core-NN-DEV-1-test1.zip

      - name: Verify NeverNether strict chunk-order determinism
        run: |
          set -euo pipefail
          JAR="$(find artifacts -maxdepth 1 -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          chmod +x ./scripts/test-never-nether-generation-determinism.sh
          ./scripts/test-never-nether-generation-determinism.sh "${JAR}" artifacts/NeverNether-Core-NN-DEV-1-test1.zip

      - name: Verify NeverOverworld strict chunk-order determinism
        run: |
          set -euo pipefail
          JAR="$(find artifacts -maxdepth 1 -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          chmod +x ./scripts/test-never-overworld-generation-determinism.sh
          ./scripts/test-never-overworld-generation-determinism.sh "${JAR}" artifacts/NeverOverworld-Core-NR-DEV-1-test1.zip

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeverFolia-TEST1-reuse-113-${{ github.sha }}
          path: |
            test1-integration-smoke/server.log
            determinism-test/world-a-hash.json
            determinism-test/world-b-hash.json
            determinism-test/component-diff.json
            determinism-test/world-a/server.log
            determinism-test/world-b/server.log
            overworld-determinism-test/world-a-hash.json
            overworld-determinism-test/world-b-hash.json
            overworld-determinism-test/world-a/server.log
            overworld-determinism-test/world-b/server.log
          if-no-files-found: warn
          retention-days: 14
