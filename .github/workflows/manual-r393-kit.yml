name: Package R39.3 manual test machine kit
on:
  push:
    branches: ['package/r393-manual-test-kit']
    paths: ['.github/workflows/manual-r393-kit.yml', 'qa/manual-r393-kit/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10927954200'
          run-id: 36308250793
          github-token: ${{ github.token }}
          path: baseline
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10930701040'
          run-id: 36315038771
          github-token: ${{ github.token }}
          path: r393
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10930681164'
          run-id: 36315038771
          github-token: ${{ github.token }}
          path: runtime-evidence
          merge-multiple: true
      - name: Assemble unchanged binaries and new-world launch files
        run: python3 qa/manual-r393-kit/package.py
      - name: Parse PowerShell launcher and check refusal before EULA acceptance
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'manual-kit/start.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          $text = & pwsh -NoProfile -File ./manual-kit/start.ps1 -CheckOnly 2>&1
          $code = $LASTEXITCODE
          if ($code -ne 1 -or ($text | Out-String) -notmatch 'EULA_NOT_ACCEPTED') { throw ('Unexpected preflight result: ' + ($text | Out-String)) }
          $doc = Get-Content -Raw ./manual-kit/PACKAGE-CHECK.json | ConvertFrom-Json
          $doc | Add-Member NoteProperty powershell_syntax_checked $true
          $doc | Add-Member NoteProperty powershell_eula_refusal_checked_on_linux $true
          $doc | Add-Member NoteProperty windows_game_launch_tested $false
          $doc | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 ./manual-kit/PACKAGE-CHECK.json
          $global:LASTEXITCODE = 0
      - name: Final exact manifest and preservation checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('manual-kit')
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          doc=json.loads((root/'PROVENANCE.json').read_text())
          for name,expected in doc['files_sha256'].items():
              assert sha(root/name)==expected,(name,'changed after packaging')
          assert 'eula=false' in (root/'eula.txt').read_text()
          assert not list((root/'world').rglob('level.dat'))
          assert not list((root/'world').rglob('*.mca'))
          files=sorted(p for p in root.rglob('*') if p.is_file())
          (root/'ALL-FILES-SHA256SUMS.txt').write_text(''.join(sha(p)+'  '+p.relative_to(root).as_posix()+'\n' for p in files))
          print(json.dumps({'files':len(files)+1,'uncompressed_bytes':sum(p.stat().st_size for p in root.rglob('*') if p.is_file()),'package_ready':True,'new_gameplay_test':False,'production_accepted':False},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NeverFolia-Test-R39.3-Complete
          path: manual-kit/
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
