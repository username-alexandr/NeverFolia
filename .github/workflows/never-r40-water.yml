name: R40 wider ocean runtime
on:
  push:
    branches: ['fix/neveroverworld-r40-water-resources']
    paths: ['qa/field-r40/build.py', 'qa/field-r40/runtime.py', 'qa/field-r40/R40Qa.java', '.github/workflows/never-r40-water.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  water:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10939310250'
          run-id: 36340789810
          github-token: ${{ github.token }}
          path: baseline
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10928009164'
          run-id: 36308250793
          github-token: ${{ github.token }}
          path: debug
          merge-multiple: true
      - name: Build preserved reference and two schedule-matched variants
        run: |
          mkdir -p artifacts
          set -o pipefail
          python3 qa/field-r40/build.py 2>&1 | tee artifacts/build-command.log
      - name: Actual new-world generation, both orders, protected cells and restart
        run: |
          set -o pipefail
          python3 qa/field-r40/runtime.py 2>&1 | tee artifacts/runtime-command.log
      - name: Keep exact tested sources
        if: always()
        run: |
          mkdir -p artifacts/qa-source
          cp qa/field-r40/*.py qa/field-r40/*.java .github/workflows/never-r40-water.yml artifacts/qa-source/
          printf '%s\n' '${{ github.sha }}' > artifacts/COMMIT.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R40-WATER-EVIDENCE-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
      - name: Mark the bounded candidate, not a final all-bugs release
        run: |
          python3 - <<'PY'
          import json,shutil
          from pathlib import Path
          r=json.loads(Path('artifacts/runtime40.json').read_text())
          assert r['bounded_pass'] is True
          assert len(r['phases'])==6 and all(p['pass'] is True for p in r['phases'].values())
          shutil.copyfile('artifacts/runtime40.json','wide40/runtime40.json')
          shutil.copyfile('artifacts/build40.json','wide40/build40.json')
          Path('wide40/NOT-FINAL.txt').write_text('Experimental 5x5 ocean closure, opt-in -Dneverfolia.r40OceanClosure=true. Paired datapacks unchanged. No claim that ice, resources or all generation is fixed. No saved-world repair.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: R40-WATER-BOUNDED-CANDIDATE-${{ github.sha }}
          path: wide40/
          retention-days: 14
          if-no-files-found: error
