name: TEST1 Vanilla Structure QA

on:
  push:
    branches:
      - wip/test1-field-qa-r2
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  vanilla-structure-qa:
    name: Frozen TEST1 vanilla structure regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout QA harness
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Resolve latest successful frozen integration artifact
        id: integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATA="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?branch=wip%2Fneverfolia-test1-integration&status=success&per_page=1")"
          RUN_ID="$(jq -r '.workflow_runs[0].id // empty' <<<"${DATA}")"
          SHA="$(jq -r '.workflow_runs[0].head_sha // empty' <<<"${DATA}")"
          if [ -z "${RUN_ID}" ] || [ -z "${SHA}" ]; then
            echo 'No successful frozen integration run found.' >&2
            exit 1
          fi
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=NeverFolia-${SHA}" >> "${GITHUB_OUTPUT}"

      - name: Download frozen integration artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ steps.integration.outputs.artifact_name }}
          path: frozen-artifact
          github-token: ${{ github.token }}
          run-id: ${{ steps.integration.outputs.run_id }}

      - name: Probe vanilla structure field policies
        run: |
          set -euo pipefail
          JAR="$(find frozen-artifact -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          PACK="$(find frozen-artifact -type f -name 'NeverOverworld-Core-*.zip' | sort | head -n 1)"
          test -n "${JAR}"
          test -n "${PACK}"
          chmod +x ./scripts/probe-never-overworld-vanilla-field-structures.sh
          ./scripts/probe-never-overworld-vanilla-field-structures.sh "${JAR}" "${PACK}"

      - name: Upload vanilla structure QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TEST1-vanilla-structure-qa-${{ steps.integration.outputs.sha }}
          path: |
            artifacts/NeverOverworld-vanilla-field-structures.json
            overworld-vanilla-field-structures-test/locate-results.tsv
            overworld-vanilla-field-structures-test/server.log
          if-no-files-found: warn
          retention-days: 30
