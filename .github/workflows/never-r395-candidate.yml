name: R395 experimental ocean closure and enchant UI
on:
  push:
    branches: ['fix/neveroverworld-r395-water-ice-enchants']
    paths:
      - 'native/overworld-r395/**'
      - 'client/neverland-enchantment-ui/**'
      - 'qa/field-r395/build_candidate.py'
      - 'qa/field-r395/run_runtime.py'
      - 'qa/field-r395/R395QaPlugin.java'
      - 'qa/field-r395/OceanConnectivityTest.java'
      - '.github/workflows/never-r395-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r395-experimental-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10927954200'
          run-id: 36308250793
          github-token: ${{ github.token }}
          path: baseline
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10928009164'
          run-id: 36308250793
          github-token: ${{ github.token }}
          path: debug
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10930701040'
          run-id: 36315038771
          github-token: ${{ github.token }}
          path: r393
          merge-multiple: true
      - name: Compile real Java 25 classes and standalone solver regressions
        id: build
        run: |
          mkdir -p artifacts
          set -o pipefail
          python3 qa/field-r395/build_candidate.py 2>&1 | tee artifacts/build-command.log
      - name: Natural chunks, control, restart, reverse and live enchant registry
        id: runtime
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 qa/field-r395/run_runtime.py 2>&1 | tee artifacts/runtime-command.log
      - name: Retain exact source and reproducibility inputs
        if: always()
        run: |
          mkdir -p artifacts/source
          cp -R native/overworld-r395 client/neverland-enchantment-ui qa/field-r395 artifacts/source/
          cp .github/workflows/never-r395-candidate.yml artifacts/source/
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          result={'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'production_accepted':False,'known_missing_templates':95}
          result['candidate_files']={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('candidate').glob('*') if p.is_file()}
          Path('artifacts/provenance.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R395-EVIDENCE-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
      - name: Assemble experimental diagnostic binaries only after bounded runtime pass
        if: steps.runtime.outcome == 'success'
        run: |
          cp artifacts/build.json artifacts/runtime.json candidate/
          printf '%s\n' 'EXPERIMENTAL R395; not a production release.' 'Generation closure is OFF unless -Dneverfolia.r395OceanClosure=true is supplied.' 'Use ONLY a new isolated world. This build does not repair saved chunks.' 'Client UI JAR belongs in Fabric 26.2 client mods, NOT server plugins.' 'Client Java compilation and live registry predicate test are not a real Fabric client launch.' 'Frozen solids are NOT removed. 95 resource gaps remain. Read runtime.json and build.json.' > candidate/READ-FIRST.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.runtime.outcome == 'success'
        with:
          name: R395-EXPERIMENTAL-BOUNDED-PASS-${{ github.sha }}
          path: candidate/
          retention-days: 14
          if-no-files-found: error
      - name: Require completed bounded regression, never confuse this with production acceptance
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
        run: |
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          assert os.environ['BUILD_OUTCOME']=='success','Actual candidate build failed'
          assert os.environ['RUNTIME_OUTCOME']=='success','Runtime failed or skipped; evidence is diagnostic only'
          assert json.loads(Path('artifacts/runtime.json').read_text())['bounded_regression_pass'] is True
          print('Bounded regression only. Production still NOT accepted: finite-cache scope, unverified client launch, ice and missing templates remain.')
          PY
