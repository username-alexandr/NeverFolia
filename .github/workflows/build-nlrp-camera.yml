name: Build NeverLandRP Camera addon 26.2

on:
  push:
    branches:
      - build/neverlandrp-camera-132-20261026
    paths:
      - nlrp-camera-source.b64
      - .github/workflows/build-nlrp-camera.yml

permissions:
  contents: read

jobs:
  camera-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Unpack source
        shell: bash
        run: |
          mkdir -p camera-src
          base64 -d nlrp-camera-source.b64 > /tmp/nlrp-camera.zip
          echo 'abe00630b0fcc3ed4574d308006527ee15d4baa8740f6490f2c9b2b957ac79f9  /tmp/nlrp-camera.zip' | sha256sum -c -
          unzip -q /tmp/nlrp-camera.zip -d camera-src
      - name: Compile Fabric mod and run protocol tests
        working-directory: camera-src
        run: gradle --no-daemon --stacktrace clean build
      - name: Check mod contents
        shell: bash
        run: |
          set -euo pipefail
          jar=camera-src/build/libs/NeverLandRP-Camera-Fabric-26.2-1.0.0.jar
          test -s "$jar"
          unzip -t "$jar" | tail -n 1
          unzip -p "$jar" fabric.mod.json | grep -F '"fabricloader": ">=0.19.4"'
          unzip -Z1 "$jar" | grep -Fx 'online/neverland/rp/camera/mixin/CameraMixin.class'
          unzip -Z1 "$jar" | grep -Fx 'online/neverland/rp/camera/NeverLandRPCameraClient.class'
          sha256sum "$jar"
      - uses: actions/upload-artifact@v4
        with:
          name: NeverLandRP-Camera-Fabric-26.2-1.0.0
          path: camera-src/build/libs/NeverLandRP-Camera-Fabric-26.2-1.0.0.jar
          if-no-files-found: error
          retention-days: 30
