name: NeverNether TEST1 Bootstrap Cache
on:
  push:
    branches: [wip/nevernether-field-r1]
    paths: [.github/workflows/never-nether-test1-bootstrap.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Fetch exact Mojang bootstrap from inspected Paperclip metadata
        run: |
          set -euo pipefail
          mkdir -p artifacts
          curl --fail --location --retry 2 --max-time 90 'https://piston-data.mojang.com/v1/objects/823e2250d24b3ddac457a60c92a6a941943fcd6a/server.jar' -o artifacts/mojang_26.2.jar
          echo 'cdacdfb25898de5e4b4b0e5ddcc2722f77067e46605709c2d886c000ebb63ec5  artifacts/mojang_26.2.jar' | sha256sum --check --strict
          git rev-parse HEAD > artifacts/SOURCE-SHA.txt
          printf '%s\n' 'Immutable unmodified upstream download for isolated Paperclip bootstrap QA only. This is not the NeverFolia server, not a public release, and is not included in the user test bundle. Use the normal Paperclip download on first user launch.' > artifacts/SCOPE.txt
          (cd artifacts && sha256sum *.jar *.txt > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: NeverNether-test1-bootstrap-${{ github.sha }}
          path: artifacts/*
          retention-days: 1
          if-no-files-found: error
