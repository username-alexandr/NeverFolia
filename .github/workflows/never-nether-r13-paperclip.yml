name: NeverNether R13 Diagnostic Paperclip
on:
  push:
    branches: [wip/nevernether-field-r1]
    paths: [.github/workflows/never-nether-r13-paperclip.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the normal chain plus explicit R8 through R13 experiment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/SOURCE-SHA.txt
          git rev-parse HEAD^{tree} > artifacts/SOURCE-TREE.txt
          git config --global user.email actions@github.com
          git config --global user.name 'NeverFolia CI'
          bash scripts/prepare-upstream.sh
          git -C .work/Folia rev-parse HEAD > artifacts/FOLIA-SHA.txt
          test "$(cat artifacts/FOLIA-SHA.txt)" = 14b7fee5c866fca9a40ede4a58998fb928140f65
          bash scripts/apply-folia-patches-ci.sh .work/Folia
          bash scripts/apply-neverfolia-post-patches.sh 2>&1 | tee artifacts/production-chain.log
          for stage in 8 9 10 11 12 13; do
            python3 "scripts/apply-never-nether-experiment-r${stage}.py" .work/Folia --acknowledge-experimental-worldgen
          done
          (cd .work/Folia && ./gradlew :folia-server:createPaperclipJar --no-configuration-cache --stacktrace) 2>&1 | tee artifacts/paperclip-build.log
          python3 - <<'PY'
          import hashlib,json,os,shutil,zipfile
          from pathlib import Path
          candidates=[]
          for p in Path('.work/Folia/folia-server/build/libs').glob('*.jar'):
              with zipfile.ZipFile(p) as z:
                  if 'META-INF/MANIFEST.MF' not in z.namelist(): continue
                  manifest=z.read('META-INF/MANIFEST.MF').decode('utf-8').replace('\r\n','\n').replace('\n ','')
                  main=next((line.split(':',1)[1].strip() for line in manifest.splitlines() if line.startswith('Main-Class:')), '')
                  if 'paperclip' in main.lower():
                      if z.testzip() is not None: raise ValueError('Corrupt candidate JAR')
                      candidates.append((p,main))
          if len(candidates)!=1: raise ValueError(f'Expected exactly one runnable Paperclip, found {candidates}')
          p,main=candidates[0]
          dest=Path('artifacts')/f"NeverFolia-NN-R13-DIAGNOSTIC-{os.environ['GITHUB_SHA'][:7]}.jar"
          shutil.copyfile(p,dest)
          info={'schema':1,'source_sha':os.environ['GITHUB_SHA'],'jar':dest.name,'jar_sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),'main_class':main,'profile':'NN-R13-SUBSTRATE-1-RECONCILED-NATURAL','experimental':True,'release_ready':False,'scope':'Diagnostic R13 binary. Ordinary production entry point remains unchanged; use a separate new world only. No claim of broad-order, old-world migration, dungeon or fluid acceptance.'}
          Path('artifacts/BUILD-INFO.json').write_text(json.dumps(info,indent=2)+'\n')
          PY
      - name: Isolated loopback-only startup of the packaged JAR with Core
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-never-nether-core-test1-pack.py --output artifacts/NeverNether-Core-DIAGNOSTIC.zip
          python3 scripts/fingerprint-never-nether-pack.py --input artifacts/NeverNether-Core-DIAGNOSTIC.zip --inject
          python3 - <<'PY'
          import json,shutil,subprocess,time
          from pathlib import Path
          root=Path.cwd(); info=json.loads((root/'artifacts/BUILD-INFO.json').read_text())
          world=root/'.work/r13-paperclip-smoke';world.mkdir(exist_ok=False)
          (world/'world/datapacks').mkdir(parents=True)
          shutil.copyfile(root/'artifacts/NeverNether-Core-DIAGNOSTIC.zip',world/'world/datapacks/NeverNether.zip')
          (world/'eula.txt').write_text('eula=true\n')
          (world/'server.properties').write_text('level-name=world\nlevel-seed=7270913\ninitial-enabled-packs=vanilla,file/NeverNether.zip\nserver-ip=127.0.0.1\nserver-port=25594\nonline-mode=false\nenforce-secure-profile=false\nview-distance=2\nsimulation-distance=2\nenable-status=false\nmax-tick-time=-1\npause-when-empty-seconds=-1\n')
          log=root/'artifacts/paperclip-startup.log';ready=False;forced=False;started=time.monotonic()
          with log.open('w') as f:
              p=subprocess.Popen(['java','-Xms512M','-Xmx2G','-XX:ActiveProcessorCount=4','-jar',str(root/'artifacts'/info['jar']),'--nogui'],cwd=world,stdin=subprocess.PIPE,stdout=f,stderr=subprocess.STDOUT,text=True)
              try:
                  while time.monotonic()-started<180:
                      if p.poll() is not None: break
                      if 'Done (' in log.read_text(errors='replace'):
                          ready=True;time.sleep(5);break
                      time.sleep(1)
              finally:
                  if p.poll() is None:
                      try:p.stdin.write('stop\n');p.stdin.flush();p.wait(timeout=90)
                      except (OSError,subprocess.TimeoutExpired):
                          forced=True;p.terminate()
                          try:p.wait(timeout=20)
                          except subprocess.TimeoutExpired:p.kill();p.wait(timeout=10)
          result={'schema':1,'ready_observed':ready,'forced_stop':forced,'exit_code':p.returncode,'elapsed_seconds':time.monotonic()-started,'release_ready':False,'scope':'Packaged JAR and finalized Core startup/normal stop only. No external structure assets, no full 1599-chunk test.'}
          (root/'artifacts/paperclip-process.json').write_text(json.dumps(result,indent=2)+'\n')
          check=subprocess.run(['python3','scripts/validate-never-nether-startup-r5.py','--log',str(log),'--exit-code',str(p.returncode),'--pack','artifacts/NeverNether-Core-DIAGNOSTIC.zip','--output','artifacts/paperclip-startup-report.json'],cwd=root)
          if not ready or forced or p.returncode!=0 or check.returncode!=0:raise SystemExit('Diagnostic Paperclip startup failed; not a release')
          PY
      - name: Preserve scope and checksums
        if: always()
        run: |
          mkdir -p artifacts
          printf '%s\n' 'DIAGNOSTIC EXPERIMENT ONLY. A successful compile/startup is not full worldgen acceptance. Do not install on existing worlds, remove fingerprint locks or promote this artifact to production.' > artifacts/SCOPE.txt
          (cd artifacts && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeverNether-r13-diagnostic-paperclip-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
