name: R3944 isolated toolchain
on:
  push:
    branches: [work/r3944-placement-toolchain]
    paths: [.github/workflows/r3944-toolchain.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25.0.4.1'
      - name: Export compiler runtime and original repository source
        run: |
          set -euo pipefail
          mkdir -p /tmp/r3944-toolchain
          tar -C "$JAVA_HOME" --exclude='lib/src.zip' -czf /tmp/r3944-toolchain/jdk25-runtime.tar.gz bin lib conf release legal
          git archive --format=tar.gz HEAD > /tmp/r3944-toolchain/repository-source.tar.gz
          cd /tmp/r3944-toolchain
          sha256sum *.tar.gz > SHA256SUMS.txt
          java -version 2> JAVA-VERSION.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: R3944-TOOLCHAIN
          path: /tmp/r3944-toolchain/
          compression-level: 0
          retention-days: 1
