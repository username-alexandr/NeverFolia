name: R39.11 manual test kit
on:
  push:
    branches: ['build/neverfolia-r3911-manual-test']
    paths: ['qa/manual-r3911/**', '.github/workflows/never-r3911-manual-kit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r3911-manual-kit
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10939310250'
          run-id: 36340789810
          github-token: ${{ github.token }}
          repository: username-alexandr/NeverFolia
          path: baseline
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10928009164'
          run-id: 36308250793
          github-token: ${{ github.token }}
          repository: username-alexandr/NeverFolia
          path: debug
          merge-multiple: true
      - name: Compile R399-based wide candidate and check preserved hotfixes
        run: |
          mkdir -p artifacts
          set -o pipefail
          python3 -m py_compile qa/manual-r3911/*.py
          python3 qa/manual-r3911/build.py 2>&1 | tee artifacts/build-command.log
      - name: Bounded generation and restart, then package for manual acceptance
        run: |
          set -o pipefail
          python3 qa/manual-r3911/smoke_and_package.py 2>&1 | tee artifacts/smoke-package-command.log
      - name: Retain build sources and actual results
        if: always()
        run: |
          mkdir -p artifacts/manual-source
          cp qa/manual-r3911/*.py .github/workflows/never-r3911-manual-kit.yml artifacts/manual-source/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R3911-build-evidence-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: NeverFolia-R39.11-Manual-TEST-${{ github.sha }}
          path: manual-kit/
          retention-days: 14
          if-no-files-found: error
