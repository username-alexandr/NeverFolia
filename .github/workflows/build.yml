name: Build NeverFolia

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Java 25 / NeverFolia build
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout NeverFolia repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate NeverNether worldgen specification
        run: python3 ./scripts/validate-never-nether-spec.py

      - name: Validate NeverOverworld worldgen specification
        run: python3 ./scripts/validate-never-overworld-spec.py

      - name: Validate reserved NeverEnd worldgen specification
        run: python3 ./scripts/validate-never-end-spec.py

      - name: Self-test NeverNether structure importer
        run: python3 ./scripts/build-never-nether-structure-pack.py --self-test

      - name: Self-test NeverNether chunk component diff
        run: python3 ./scripts/diff-never-nether-chunks.py --self-test

      - name: Self-test NeverNether Basalt Columns ownership transformer
        run: python3 ./scripts/apply-never-nether-basalt-columns-ownership.py --self-test

      - name: Self-test NeverNether NetherrackReplaceBlobs ownership transformer
        run: python3 ./scripts/apply-never-nether-netherrack-blobs-ownership.py --self-test

      - name: Self-test finalized NeverNether Core TEST1 pack
        run: python3 ./scripts/build-never-nether-core-test1-pack.py --self-test

      - name: Self-test semantic NeverNether generation hasher
        run: python3 ./scripts/hash-never-nether-generation-chunks.py --self-test

      - name: Self-test NeverOverworld Core builder
        run: python3 ./scripts/build-never-overworld-core-pack.py --self-test

      - name: Self-test semantic NeverOverworld generation hasher
        run: python3 ./scripts/hash-never-overworld-generation-chunks.py --self-test

      - name: Self-test NeverOverworld Moonrise LIGHT flood hook
        run: python3 ./scripts/apply-never-overworld-moonrise-light-flood-hook.py --self-test

      - name: Self-test NeverOverworld native fluid picker
        run: python3 ./scripts/apply-never-overworld-fluid-picker.py --self-test

      - name: Self-test NeverOverworld fingerprint tool
        run: python3 ./scripts/fingerprint-never-overworld-pack.py --self-test

      - name: Self-test NeverOverworld fingerprint guard
        run: python3 ./scripts/apply-never-overworld-fingerprint-guard.py --self-test

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "NeverFolia CI"

      - name: Prepare Folia 26.2.x upstream
        run: |
          chmod +x ./scripts/prepare-upstream.sh
          ./scripts/prepare-upstream.sh

      - name: Apply Folia patches
        run: |
          chmod +x ./scripts/apply-folia-patches-ci.sh
          ./scripts/apply-folia-patches-ci.sh ./.work/Folia

      - name: Apply NeverFolia post patches
        run: |
          chmod +x ./scripts/apply-neverfolia-post-patches.sh
          ./scripts/apply-neverfolia-post-patches.sh

      - name: Build runnable Paperclip JAR
        working-directory: .work/Folia
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_STARTED_AT: ${{ github.event.repository.updated_at }}
        run: ./gradlew :folia-server:createPaperclipJar --stacktrace

      - name: Collect NeverFolia JAR
        run: |
          set -euo pipefail
          source ./build.env
          mkdir -p artifacts
          JAR="$(find .work/Folia/folia-server/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources.jar' ! -name '*javadoc.jar' | sort | head -n 1)"
          if [ -z "${JAR}" ]; then
            echo 'Runnable server JAR not found.'
            exit 1
          fi
          OUT="artifacts/NeverFolia-${NEVERFOLIA_VERSION}-${GITHUB_SHA::7}.jar"
          cp "${JAR}" "${OUT}"
          {
            echo "NeverFolia version: ${NEVERFOLIA_VERSION}"
            echo "Git commit: ${GITHUB_SHA}"
            echo "Folia ref: ${FOLIA_REF}"
            echo "Overworld worldgen: ${WORLDGEN_OVERWORLD}"
            echo "Overworld test core: NR-DEV-1-core-test1"
            echo "Overworld mode: VANILLA_FLOODED"
            echo "Overworld flood level: Y=128"
            echo "Overworld flood phase: Moonrise ChunkLightTask / surface-connected / chunk-owned v3"
            echo "Overworld aquifer: native lava branch disabled"
            echo "Nether worldgen: ${WORLDGEN_NETHER}"
            echo "Nether test core: NN-DEV-1-core-test1"
            echo "End worldgen: ${WORLDGEN_END}"
            echo "End mode: NeverEnd reserved / vanilla-compatible fallback"
          } > artifacts/BUILD-INFO.txt

      - name: Upload compiled NeverFolia JAR early
        uses: actions/upload-artifact@v4
        with:
          name: NeverFolia-compiled-${{ github.sha }}
          path: |
            artifacts/*.jar
            artifacts/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30

      - name: Build and fingerprint NeverNether core test datapack
        run: |
          python3 ./scripts/build-never-nether-core-test1-pack.py --output artifacts/NeverNether-Core-NN-DEV-1-test1.zip
          python3 ./scripts/fingerprint-never-nether-pack.py --input artifacts/NeverNether-Core-NN-DEV-1-test1.zip --inject
          python3 ./scripts/fingerprint-never-nether-pack.py --input artifacts/NeverNether-Core-NN-DEV-1-test1.zip --verify

      - name: Build and fingerprint NeverOverworld core test datapack
        run: |
          set -euo pipefail
          JAR="$(find artifacts -maxdepth 1 -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          python3 ./scripts/build-never-overworld-core-pack.py \
            --server-jar "${JAR}" \
            --output artifacts/NeverOverworld-Core-NR-DEV-1-test1.zip
          python3 ./scripts/fingerprint-never-overworld-pack.py --input artifacts/NeverOverworld-Core-NR-DEV-1-test1.zip --inject
          python3 ./scripts/fingerprint-never-overworld-pack.py --input artifacts/NeverOverworld-Core-NR-DEV-1-test1.zip --verify

      - name: Smoke test NeverNether runtime and fingerprint guard
        run: |
          set -euo pipefail
          JAR="$(find artifacts -maxdepth 1 -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          PACK="$(find artifacts -maxdepth 1 -type f -name 'NeverNether-Core-*.zip' | sort | head -n 1)"
          chmod +x ./scripts/smoke-test-never-nether-runtime.sh
          ./scripts/smoke-test-never-nether-runtime.sh "${JAR}" "${PACK}"

      - name: Smoke test NeverOverworld flooded runtime
        run: |
          set -euo pipefail
          JAR="$(find artifacts -maxdepth 1 -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          PACK="$(find artifacts -maxdepth 1 -type f -name 'NeverOverworld-Core-*.zip' | sort | head -n 1)"
          chmod +x ./scripts/smoke-test-never-overworld-runtime.sh
          ./scripts/smoke-test-never-overworld-runtime.sh "${JAR}" "${PACK}"

      - name: Smoke test NeverOverworld fingerprint guard
        run: |
          set -euo pipefail
          JAR="$(find artifacts -maxdepth 1 -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          PACK="$(find artifacts -maxdepth 1 -type f -name 'NeverOverworld-Core-*.zip' | sort | head -n 1)"
          chmod +x ./scripts/smoke-test-never-overworld-fingerprint.sh
          ./scripts/smoke-test-never-overworld-fingerprint.sh "${JAR}" "${PACK}"

      - name: Smoke test combined NeverOverworld + NeverNether TEST1 runtime
        run: |
          set -euo pipefail
          JAR="$(find artifacts -maxdepth 1 -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          OVERWORLD_PACK="$(find artifacts -maxdepth 1 -type f -name 'NeverOverworld-Core-*.zip' | sort | head -n 1)"
          NETHER_PACK="$(find artifacts -maxdepth 1 -type f -name 'NeverNether-Core-*.zip' | sort | head -n 1)"
          chmod +x ./scripts/smoke-test-neverfolia-test1-integration.sh
          ./scripts/smoke-test-neverfolia-test1-integration.sh "${JAR}" "${OVERWORLD_PACK}" "${NETHER_PACK}"

      - name: Verify NeverNether strict chunk-order generation determinism
        run: |
          set -euo pipefail
          JAR="$(find artifacts -maxdepth 1 -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          PACK="$(find artifacts -maxdepth 1 -type f -name 'NeverNether-Core-*.zip' | sort | head -n 1)"
          chmod +x ./scripts/test-never-nether-generation-determinism.sh
          ./scripts/test-never-nether-generation-determinism.sh "${JAR}" "${PACK}"

      - name: Upload NeverNether determinism diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeverNether-determinism-${{ github.sha }}
          path: |
            determinism-test/world-a-hash.json
            determinism-test/world-b-hash.json
            determinism-test/component-diff.json
            determinism-test/world-a/server.log
            determinism-test/world-b/server.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify NeverOverworld strict chunk-order generation determinism
        run: |
          set -euo pipefail
          JAR="$(find artifacts -maxdepth 1 -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          PACK="$(find artifacts -maxdepth 1 -type f -name 'NeverOverworld-Core-*.zip' | sort | head -n 1)"
          chmod +x ./scripts/test-never-overworld-generation-determinism.sh
          ./scripts/test-never-overworld-generation-determinism.sh "${JAR}" "${PACK}"

      - name: Upload NeverOverworld determinism diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeverOverworld-determinism-${{ github.sha }}
          path: |
            overworld-determinism-test/world-a-hash.json
            overworld-determinism-test/world-b-hash.json
            overworld-determinism-test/world-a/server.log
            overworld-determinism-test/world-b/server.log
          if-no-files-found: warn
          retention-days: 14

      - name: Generate artifact checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum *.jar *.zip > SHA256SUMS.txt

      - name: Upload NeverFolia build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeverFolia-${{ github.sha }}
          path: |
            artifacts/*.jar
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
            artifacts/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
