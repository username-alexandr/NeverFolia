name: Build NeverFolia

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java 25 / NeverFolia build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout NeverFolia repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate NeverNether worldgen specification
        shell: bash
        run: python3 ./scripts/validate-never-nether-spec.py

      - name: Self-test NeverNether structure importer
        shell: bash
        run: python3 ./scripts/build-never-nether-structure-pack.py --self-test

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "NeverFolia CI"

      - name: Prepare Folia 26.2.x upstream
        shell: bash
        run: |
          chmod +x ./scripts/prepare-upstream.sh
          ./scripts/prepare-upstream.sh

      - name: Apply Folia patches
        working-directory: .work/Folia
        run: ./gradlew applyAllPatches --stacktrace

      - name: Apply NeverFolia post patches
        shell: bash
        run: |
          chmod +x ./scripts/apply-neverfolia-post-patches.sh
          ./scripts/apply-neverfolia-post-patches.sh

      - name: Build runnable Paperclip JAR
        working-directory: .work/Folia
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_STARTED_AT: ${{ github.event.repository.updated_at }}
        run: ./gradlew :folia-server:createPaperclipJar --stacktrace

      - name: Collect NeverFolia JAR
        shell: bash
        run: |
          set -euo pipefail
          source ./build.env
          mkdir -p artifacts

          JAR="$(find .work/Folia/folia-server/build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*sources.jar' ! -name '*javadoc.jar' | sort | head -n 1)"

          if [ -z "${JAR}" ]; then
            echo "Runnable server JAR not found."
            find .work/Folia/folia-server/build -maxdepth 4 -type f -name '*.jar' -print || true
            exit 1
          fi

          OUT="artifacts/NeverFolia-${NEVERFOLIA_VERSION}-${GITHUB_SHA::7}.jar"
          cp "${JAR}" "${OUT}"

          {
            echo "NeverFolia version: ${NEVERFOLIA_VERSION}"
            echo "Git commit: ${GITHUB_SHA}"
            echo "Folia ref: ${FOLIA_REF}"
            echo "Overworld worldgen: ${WORLDGEN_OVERWORLD}"
            echo "Nether worldgen: ${WORLDGEN_NETHER}"
            echo "Nether test core: NN-DEV-1-core-test1"
            echo "End worldgen: ${WORLDGEN_END}"
          } > artifacts/BUILD-INFO.txt

      - name: Build NeverNether core test datapack
        shell: bash
        run: |
          python3 ./scripts/build-never-nether-core-pack.py \
            --output artifacts/NeverNether-Core-NN-DEV-1-test1.zip

      - name: Smoke test NeverNether runtime generation
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find artifacts -maxdepth 1 -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          PACK="$(find artifacts -maxdepth 1 -type f -name 'NeverNether-Core-*.zip' | sort | head -n 1)"

          rm -rf smoke-test
          mkdir -p smoke-test/world/datapacks
          cp "${PACK}" smoke-test/world/datapacks/NeverNether-Core.zip

          cat > smoke-test/eula.txt <<'EOF'
          eula=true
          EOF

          cat > smoke-test/server.properties <<'EOF'
          level-name=world
          level-seed=NeverNether-CI-Test-1
          level-type=minecraft:normal
          initial-enabled-packs=vanilla,file/NeverNether-Core.zip
          initial-disabled-packs=
          online-mode=false
          enforce-secure-profile=false
          server-port=25575
          view-distance=2
          simulation-distance=2
          spawn-protection=0
          max-tick-time=-1
          enable-status=false
          EOF

          cd smoke-test
          mkfifo console.pipe
          tail -f /dev/null > console.pipe &
          KEEPER_PID=$!
          java -Xms1G -Xmx2G -jar "../${JAR}" nogui < console.pipe > server.log 2>&1 &
          SERVER_PID=$!

          ready=0
          for _ in $(seq 1 180); do
            if grep -q 'Done (' server.log; then
              ready=1
              break
            fi
            if ! kill -0 "${SERVER_PID}" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "${ready}" -ne 1 ]; then
            echo "NeverFolia did not reach ready state during NeverNether smoke test."
            cat server.log
            kill "${SERVER_PID}" 2>/dev/null || true
            kill "${KEEPER_PID}" 2>/dev/null || true
            exit 1
          fi

          echo 'stop' > console.pipe

          for _ in $(seq 1 45); do
            if ! kill -0 "${SERVER_PID}" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill "${SERVER_PID}" 2>/dev/null || true
          kill "${KEEPER_PID}" 2>/dev/null || true
          wait "${SERVER_PID}" 2>/dev/null || true

          if ! grep -q "Selecting spawn point for level 'minecraft:the_nether'" server.log; then
            echo "Nether spawn generation was not observed."
            cat server.log
            exit 1
          fi

          if ! grep -q "Saving chunks for level 'ServerLevel\[world\]'/minecraft:the_nether" server.log; then
            echo "Nether chunk save was not observed."
            cat server.log
            exit 1
          fi

          if grep -Eqi "Failed to parse|Couldn't parse|Unknown registry|Errors in currently selected datapacks|Failed to load datapacks|Failed to load registries" server.log; then
            echo "NeverNether datapack/registry error detected."
            cat server.log
            exit 1
          fi

          python3 - <<'PY'
          import gzip
          from pathlib import Path

          level = Path('world/level.dat')
          if not level.is_file():
              raise SystemExit('world/level.dat was not created')
          with gzip.open(level, 'rb') as fh:
              payload = fh.read()
          if b'file/NeverNether-Core.zip' not in payload:
              raise SystemExit('NeverNether-Core.zip is not recorded in the enabled datapack list')

          candidates = (
              Path('world/dimensions/minecraft/the_nether/region'),
              Path('world_nether/region'),
              Path('world_nether/DIM-1/region'),
              Path('world/DIM-1/region'),
          )
          discovered = []
          for region_dir in candidates:
              if region_dir.is_dir():
                  files = sorted(region_dir.glob('*.mca'))
                  if files:
                      discovered.append((region_dir, files))

          if not discovered:
              all_regions = sorted(Path('.').glob('**/region/*.mca'))
              listing = '\n'.join(f'  - {path}' for path in all_regions) or '  (none)'
              raise SystemExit(
                  'No Nether region file was generated in any supported Paper/Folia layout.\n'
                  f'Region files found:\n{listing}'
              )

          for region_dir, files in discovered:
              print(f'NeverNether runtime verification: {len(files)} region file(s) in {region_dir}')
          PY

          echo "NeverNether runtime smoke test passed."
          tail -n 80 server.log

      - name: Generate artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum *.jar *.zip > SHA256SUMS.txt

      - name: Upload NeverFolia build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeverFolia-${{ github.sha }}
          path: |
            artifacts/*.jar
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
            artifacts/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
