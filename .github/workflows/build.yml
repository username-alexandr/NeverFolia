name: Build NeverFolia

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 25 / NeverFolia build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout NeverFolia repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate NeverNether worldgen specification
        run: python3 ./scripts/validate-never-nether-spec.py

      - name: Self-test NeverNether structure importer
        run: python3 ./scripts/build-never-nether-structure-pack.py --self-test

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "NeverFolia CI"

      - name: Prepare Folia 26.2.x upstream
        run: |
          chmod +x ./scripts/prepare-upstream.sh
          ./scripts/prepare-upstream.sh

      - name: Apply Folia patches
        working-directory: .work/Folia
        run: ./gradlew applyAllPatches --stacktrace

      - name: Apply NeverFolia post patches
        run: |
          chmod +x ./scripts/apply-neverfolia-post-patches.sh
          ./scripts/apply-neverfolia-post-patches.sh

      - name: Build runnable Paperclip JAR
        working-directory: .work/Folia
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_STARTED_AT: ${{ github.event.repository.updated_at }}
        run: ./gradlew :folia-server:createPaperclipJar --stacktrace

      - name: Collect NeverFolia JAR
        run: |
          set -euo pipefail
          source ./build.env
          mkdir -p artifacts
          JAR="$(find .work/Folia/folia-server/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources.jar' ! -name '*javadoc.jar' | sort | head -n 1)"
          if [ -z "${JAR}" ]; then
            echo 'Runnable server JAR not found.'
            exit 1
          fi
          OUT="artifacts/NeverFolia-${NEVERFOLIA_VERSION}-${GITHUB_SHA::7}.jar"
          cp "${JAR}" "${OUT}"
          {
            echo "NeverFolia version: ${NEVERFOLIA_VERSION}"
            echo "Git commit: ${GITHUB_SHA}"
            echo "Folia ref: ${FOLIA_REF}"
            echo "Overworld worldgen: ${WORLDGEN_OVERWORLD}"
            echo "Nether worldgen: ${WORLDGEN_NETHER}"
            echo "Nether test core: NN-DEV-1-core-test1"
            echo "End worldgen: ${WORLDGEN_END}"
          } > artifacts/BUILD-INFO.txt

      - name: Build and fingerprint NeverNether core test datapack
        run: |
          python3 ./scripts/build-never-nether-core-pack.py --output artifacts/NeverNether-Core-NN-DEV-1-test1.zip
          python3 ./scripts/fingerprint-never-nether-pack.py --input artifacts/NeverNether-Core-NN-DEV-1-test1.zip --inject
          python3 ./scripts/fingerprint-never-nether-pack.py --input artifacts/NeverNether-Core-NN-DEV-1-test1.zip --verify

      - name: Smoke test NeverNether runtime and fingerprint guard
        run: |
          set -euo pipefail
          JAR="$(find artifacts -maxdepth 1 -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          PACK="$(find artifacts -maxdepth 1 -type f -name 'NeverNether-Core-*.zip' | sort | head -n 1)"
          chmod +x ./scripts/smoke-test-never-nether-runtime.sh
          ./scripts/smoke-test-never-nether-runtime.sh "${JAR}" "${PACK}"

      - name: Verify NeverNether chunk-order determinism
        run: |
          set -euo pipefail
          JAR="$(find artifacts -maxdepth 1 -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          PACK="$(find artifacts -maxdepth 1 -type f -name 'NeverNether-Core-*.zip' | sort | head -n 1)"
          chmod +x ./scripts/test-never-nether-determinism.sh
          ./scripts/test-never-nether-determinism.sh "${JAR}" "${PACK}"

      - name: Generate artifact checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum *.jar *.zip > SHA256SUMS.txt

      - name: Upload NeverFolia build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeverFolia-${{ github.sha }}
          path: |
            artifacts/*.jar
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
            artifacts/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
