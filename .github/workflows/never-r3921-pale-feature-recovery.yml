name: R3921 Pale feature recovery
on:
  push:
    branches: ['fix/neveroverworld-r3921-pale-feature-recovery']
  pull_request:
    branches: ['fix/neveroverworld-r3920-effective-stack']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r3921-pale-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pale:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: |
          mkdir -p artifacts
          printf '%s\n' '${{ github.sha }}' > artifacts/source-commit.txt
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10993651734'
          run-id: 36475485993
          github-token: ${{ github.token }}
          path: r3920-input
          merge-multiple: true
      - name: Inventory exact v4.5 Pale feature dependencies
        run: |
          set -o pipefail
          python3 qa/field-r3921/probe_pale_feature_dependencies.py 2>&1 | tee artifacts/pale-feature-probe.log
      - name: Preserve probe source
        if: always()
        run: |
          mkdir -p artifacts/source
          cp qa/field-r3921/probe_pale_feature_dependencies.py artifacts/source/
          cp .github/workflows/never-r3921-pale-feature-recovery.yml artifacts/source/workflow.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R3921-PALE-PROBE-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
