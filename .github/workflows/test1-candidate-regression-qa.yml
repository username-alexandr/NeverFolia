name: TEST1 Candidate Regression QA

on:
  workflow_run:
    workflows:
      - Build NeverFolia
    types:
      - completed
    branches:
      - wip/test1-field-fixes-candidate

permissions:
  actions: read
  contents: read

jobs:
  regressions:
    name: Candidate vanilla structures and shoreline flora
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Download exact candidate build artifact
        uses: actions/download-artifact@v5
        with:
          name: NeverFolia-${{ github.event.workflow_run.head_sha }}
          path: candidate-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify artifact inputs
        run: |
          set -euo pipefail
          find candidate-artifact -maxdepth 2 -type f -print
          JAR="$(find candidate-artifact -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          PACK="$(find candidate-artifact -type f -name 'NeverOverworld-Core-*.zip' | sort | head -n 1)"
          test -n "${JAR}"
          test -n "${PACK}"
          echo "candidate_sha=${{ github.event.workflow_run.head_sha }}"
          sha256sum "${JAR}" "${PACK}"

      - name: Probe vanilla field structures and fast locate
        run: |
          set -euo pipefail
          JAR="$(find candidate-artifact -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          PACK="$(find candidate-artifact -type f -name 'NeverOverworld-Core-*.zip' | sort | head -n 1)"
          chmod +x ./scripts/probe-never-overworld-vanilla-field-structures.sh
          ./scripts/probe-never-overworld-vanilla-field-structures.sh "${JAR}" "${PACK}"

      - name: Probe positive shoreline flora relocation
        run: |
          set -euo pipefail
          JAR="$(find candidate-artifact -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          PACK="$(find candidate-artifact -type f -name 'NeverOverworld-Core-*.zip' | sort | head -n 1)"
          chmod +x ./scripts/probe-never-overworld-shoreline-flora.sh
          ./scripts/probe-never-overworld-shoreline-flora.sh "${JAR}" "${PACK}"

      - name: Upload candidate regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TEST1-candidate-regression-${{ github.event.workflow_run.head_sha }}
          path: |
            artifacts/NeverOverworld-vanilla-field-structures.json
            artifacts/NeverOverworld-shoreline-flora.json
            overworld-vanilla-field-structures-test/locate-results.tsv
            overworld-vanilla-field-structures-test/server.log
            overworld-shoreline-flora-test/biome-results.tsv
            overworld-shoreline-flora-test/server.log
          if-no-files-found: warn
          retention-days: 30
