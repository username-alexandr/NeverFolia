name: FIELD-R37 source transfer and focused QA
on:
  push:
    branches: ['wip/neveroverworld-r37-continuation']
    paths: ['.github/workflows/never-r37-bootstrap.yml']
permissions:
  contents: write
concurrency:
  group: r37-bootstrap
  cancel-in-progress: false
jobs:
  integrate-and-test:
    if: github.repository == 'username-alexandr/NeverFolia' && github.ref == 'refs/heads/wip/neveroverworld-r37-continuation'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify and apply exactly the reviewed R37 patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8b52c3f30df55452a06d4ceece2ad84add52ee61 HEAD
          python3 - <<'PY'
          import base64, gzip, hashlib, subprocess
          from pathlib import Path
          parts=Path('qa/field-r37-bootstrap')
          encoded=''.join((parts/f'patch.{i}.b64').read_text().strip() for i in range(3))
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          expected='37f3ad9ef90548a5f2b1b5111335d784a463d5617189884e6e90a32ba541b21a'
          if hashlib.sha256(patch).hexdigest()!=expected:
              raise SystemExit('Source transfer checksum mismatch; no patch applied')
          allowed={'.github/workflows/never-r37-qa.yml','docs/FIELD-R37.md',
              'qa/field-r19/validate-external-structures-pack.py',
              'qa/field-r36/probe-water-square-seed.py',
              'qa/field-r37/R37DungeonQaPlugin.java','qa/field-r37/plugin.yml',
              'qa/field-r37/run-ci.sh','qa/field-r37/test-imports.py',
              'qa/field-r37/test-materialized.py',
              'scripts/apply-never-overworld-fixpack-r22.py',
              'scripts/apply-never-overworld-r37.py',
              'scripts/apply-never-overworld-water-contract-r33.py',
              'scripts/build-never-overworld-external-structures-r19.py'}
          paths={line.split(' b/',1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git ')}
          if paths!=allowed:
              raise SystemExit('Unexpected source paths; no patch applied')
          p=Path('/tmp/neverfolia-r37.patch');p.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply',str(p)],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          PY
          git rm -- qa/field-r37-bootstrap/patch.0.b64 qa/field-r37-bootstrap/patch.1.b64 qa/field-r37-bootstrap/patch.2.b64 .github/workflows/never-r37-bootstrap.yml
          git config user.name 'NeverFolia CI'
          git config user.email actions@github.com
          git commit -m 'fix(worldgen): R37 bounded ocean columns, complete NBT sanitation and dungeon runtime'
          git push origin HEAD:refs/heads/wip/neveroverworld-r37-continuation
          echo "R37_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile exact candidate and execute focused regressions
        run: bash qa/field-r37/run-ci.sh
      - name: Upload candidate inputs and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeverFolia-R37-CANDIDATE-${{ env.R37_SOURCE_SHA || github.sha }}
          path: |
            artifacts/server.jar
            artifacts/NeverOverworld.zip
            artifacts/NeverNether.zip
            artifacts/*.json
            artifacts/*.log
            artifacts/*.txt
            artifacts/*.md
          retention-days: 14
          if-no-files-found: warn
