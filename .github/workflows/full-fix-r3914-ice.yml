name: R3914 piece-aware ice integration
on:
  push:
    branches: ['fix/neveroverworld-r3914-full-fix-work']
    paths: ['native/overworld-r3913/**', 'qa/full-fix-r3914/prepare_ice_build.py', '.github/workflows/full-fix-r3914-ice.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r3914-ice-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10939310250'
          run-id: 36340789810
          github-token: ${{ github.token }}
          path: baseline
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10928009164'
          run-id: 36308250793
          github-token: ${{ github.token }}
          path: debug
          merge-multiple: true
      - name: Build pinned wide-ocean parent, preserve previous snow and mine fixes
        run: python3 qa/manual-r3911/build.py
      - name: Prepare exact-source integration and stricter effect tests
        run: python3 qa/full-fix-r3914/prepare_ice_build.py
      - name: Compile actual new ice class and cache-aware LIGHT call
        run: python3 qa/field-r3913/build.py
      - name: Real fixtures, paired natural worlds and restart; zero effect is not acceptance
        run: python3 qa/field-r3913/runtime.py
      - name: Preserve internal candidate only on successful scoped checks
        run: |
          python3 - <<'PY'
          import json,shutil
          from pathlib import Path
          r=json.loads(Path('artifacts/r3913-runtime.json').read_text())
          assert r['pass'] is True and r['natural_effect_observed'] is True
          out=Path('internal-candidate');out.mkdir()
          for n in ('server.jar','NeverOverworld.zip','NeverNether.zip'):shutil.copyfile(Path('candidate')/n,out/n)
          for n in ('r3913-build.json','r3913-runtime.json'):shutil.copyfile(Path('artifacts')/n,out/n)
          (out/'NOT-A-USER-RELEASE.txt').write_text('Internal integration checkpoint. Other reported bugs are not closed. No user-world repair.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: R3914-internal-ice-kernel-${{ github.sha }}
          path: internal-candidate/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve exact source and provenance, including failures
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,shutil
          from pathlib import Path
          out=Path('artifacts/r3914-source');out.mkdir(parents=True,exist_ok=True)
          for root in ('qa/field-r3913','native/overworld-r3913','qa/full-fix-r3914'):
              for p in Path(root).iterdir():
                  if p.is_file():shutil.copyfile(p,out/p.name)
          shutil.copyfile('.github/workflows/full-fix-r3914-ice.yml',out/'workflow.yml')
          (out/'provenance.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'production_accepted':False,'local_user_r3911_not_used':True},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R3914-ice-integration-evidence-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
