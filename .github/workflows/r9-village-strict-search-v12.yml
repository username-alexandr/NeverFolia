name: R9 Village Strict Search V12

on:
  push:
    branches:
      - qa/r9-village-strict-search-v12
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r9-village-strict-search-v12-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build one V12 strict-search JAR
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout NeverFolia
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Configure Git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "NeverFolia CI"
      - name: Validate V12 contracts
        run: |
          python3 ./scripts/tune-never-overworld-village-locate-r9-v5.py --self-test
          python3 ./scripts/tune-never-overworld-village-strict-search-v12.py --self-test
          python3 ./scripts/adapt-never-overworld-highland-villages.py --self-test
          python3 ./scripts/audit-never-overworld-village-persisted-bbox.py --self-test
          bash -n ./scripts/probe-never-overworld-village-locate-r9-v2.sh
          bash -n ./scripts/qa-never-overworld-village-v4-bbox.sh
      - name: Prepare Folia 26.2.x upstream
        run: |
          chmod +x ./scripts/prepare-upstream.sh
          ./scripts/prepare-upstream.sh
      - name: Apply Folia patches
        run: |
          chmod +x ./scripts/apply-folia-patches-ci.sh
          ./scripts/apply-folia-patches-ci.sh ./.work/Folia
      - name: Apply NeverFolia post patches
        run: |
          chmod +x ./scripts/apply-neverfolia-post-patches.sh
          ./scripts/apply-neverfolia-post-patches.sh
      - name: Apply corrected V5 baseline
        run: python3 ./scripts/tune-never-overworld-village-locate-r9-v5.py ./.work/Folia
      - name: Apply V12 strict 12-of-12 contract and ring selector
        run: python3 ./scripts/tune-never-overworld-village-strict-search-v12.py ./.work/Folia
      - name: Build runnable Paperclip JAR
        working-directory: .work/Folia
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew :folia-server:createPaperclipJar --stacktrace
      - name: Collect JAR and build V12 NeverOverworld pack
        run: |
          set -euo pipefail
          mkdir -p artifacts/v12-build
          JAR="$(find .work/Folia/folia-server/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources.jar' ! -name '*javadoc.jar' | sort | head -n 1)"
          test -n "${JAR}" && test -f "${JAR}"
          cp "${JAR}" artifacts/v12-build/NeverFolia-r9-village-v12.jar
          PACK="artifacts/v12-build/NeverOverworld-Core-r9-village-v12.zip"
          python3 ./scripts/build-never-overworld-core-pack.py --server-jar artifacts/v12-build/NeverFolia-r9-village-v12.jar --output "${PACK}"
          python3 ./scripts/build-never-overworld-native-structures.py --input "${PACK}"
          python3 ./scripts/normalize-never-overworld-structure-type.py --input "${PACK}"
          python3 ./scripts/fingerprint-never-overworld-pack.py --input "${PACK}" --inject
          python3 ./scripts/fingerprint-never-overworld-pack.py --input "${PACK}" --verify
      - name: Upload V12 runtime inputs
        uses: actions/upload-artifact@v4
        with:
          name: r9-village-v12-runtime-inputs-${{ github.sha }}
          path: artifacts/v12-build/*
          retention-days: 7

  matrix:
    name: rings-${{ matrix.rings }} / strict 10 locates + 5 starts + bbox
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        rings: [96, 128, 192, 256]
    env:
      JAVA_TOOL_OPTIONS: -Dneverfolia.villageLocateRings=${{ matrix.rings }}
    steps:
      - name: Checkout NeverFolia
        uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Download shared V12 runtime inputs
        uses: actions/download-artifact@v5
        with:
          name: r9-village-v12-runtime-inputs-${{ github.sha }}
          path: artifacts/v12-build
      - name: Verify selected ring budget
        run: |
          echo "JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS}"
          test "${JAVA_TOOL_OPTIONS}" = "-Dneverfolia.villageLocateRings=${{ matrix.rings }}"
      - name: Run all 10 locate targets to persisted starts
        run: |
          chmod +x ./scripts/probe-never-overworld-village-locate-r9-v2.sh
          ./scripts/probe-never-overworld-village-locate-r9-v2.sh \
            artifacts/v12-build/NeverFolia-r9-village-v12.jar \
            artifacts/v12-build/NeverOverworld-Core-r9-village-v12.zip
      - name: Preserve locate proof
        if: always()
        run: |
          mkdir -p "artifacts/v12-rings-${{ matrix.rings }}/locate"
          cp -f artifacts/village-locate-r9-v2-proof.json "artifacts/v12-rings-${{ matrix.rings }}/locate/" 2>/dev/null || true
          cp -f overworld-village-locate-r9-v2-test/*.tsv "artifacts/v12-rings-${{ matrix.rings }}/locate/" 2>/dev/null || true
          cp -f overworld-village-locate-r9-v2-test/*.log "artifacts/v12-rings-${{ matrix.rings }}/locate/" 2>/dev/null || true
      - name: Run full persisted Jigsaw bbox water=0 proof
        run: |
          chmod +x ./scripts/qa-never-overworld-village-v4-bbox.sh
          ./scripts/qa-never-overworld-village-v4-bbox.sh \
            artifacts/v12-build/NeverFolia-r9-village-v12.jar \
            artifacts/v12-build/NeverOverworld-Core-r9-village-v12.zip \
            "artifacts/v12-rings-${{ matrix.rings }}/bbox" \
            "${GITHUB_SHA}-rings-${{ matrix.rings }}"
      - name: Upload V12 profile proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R9-village-v12-rings-${{ matrix.rings }}-${{ github.sha }}
          path: |
            artifacts/v12-rings-${{ matrix.rings }}/**/*
            village-v4-bbox-test/*.tsv
            village-v4-bbox-test/locate-*.log
          if-no-files-found: warn
          retention-days: 14
