name: NeverNether R12 Decoration Proposal Compile
on:
  push:
    branches: [wip/nevernether-field-r1]
    paths:
      - 'qa/nevernether-r12/**'
      - 'scripts/*candidate-r12.py'
      - 'scripts/apply-never-nether-experiment-r12.py'
      - 'worldgen-spec/never-nether-r12-hooks.json'
      - '.github/workflows/never-nether-r12-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Source contracts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/SOURCE-SHA.txt
          git rev-parse HEAD^{tree} > artifacts/SOURCE-TREE.txt
          git archive --format=zip HEAD -o artifacts/source.zip
          python3 scripts/test-never-nether-candidate-r12.py 2>&1 | tee artifacts/source-contract-tests.log
      - name: Compile normal production chain plus optional R8 through R12
        run: |
          set -euo pipefail
          git config --global user.email actions@github.com
          git config --global user.name 'NeverFolia CI'
          bash scripts/prepare-upstream.sh
          test "$(git -C .work/Folia rev-parse HEAD)" = 14b7fee5c866fca9a40ede4a58998fb928140f65
          bash scripts/apply-folia-patches-ci.sh .work/Folia
          bash scripts/apply-neverfolia-post-patches.sh 2>&1 | tee artifacts/production-chain.log
          for stage in 8 9 10 11 12; do
            python3 "scripts/apply-never-nether-experiment-r${stage}.py" .work/Folia --acknowledge-experimental-worldgen
          done
          python3 scripts/apply-never-nether-experiment-r12.py .work/Folia --acknowledge-experimental-worldgen
          cp qa/nevernether-r12/NeverNetherCandidateR12Smoke.java .work/Folia/folia-server/src/minecraft/java/
          cp qa/nevernether-r11/NeverNetherStorageR11Smoke.java .work/Folia/folia-server/src/minecraft/java/
          cp qa/nevernether-r11/NeverNetherGuardR11Smoke.java .work/Folia/folia-server/src/minecraft/java/
          cat > .work/r12-smoke.init.gradle <<'GROOVY'
          gradle.projectsEvaluated {
              def server = gradle.rootProject.project(':folia-server')
              ['NeverNetherCandidateR12Smoke', 'NeverNetherStorageR11Smoke', 'NeverNetherGuardR11Smoke'].each { name ->
                  server.tasks.register(name, JavaExec) {
                      dependsOn server.tasks.named('classes')
                      classpath = server.sourceSets.main.runtimeClasspath
                      mainClass = name == 'NeverNetherGuardR11Smoke' ? name : 'net.minecraft.world.level.levelgen.placement.' + name
                      jvmArgs '-ea'
                  }
              }
          }
          GROOVY
          (cd .work/Folia && ./gradlew :folia-server:compileJava :folia-server:NeverNetherCandidateR12Smoke :folia-server:NeverNetherStorageR11Smoke :folia-server:NeverNetherGuardR11Smoke -I ../r12-smoke.init.gradle --no-configuration-cache --stacktrace) 2>&1 | tee artifacts/compile-proposal-storage.log
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path
          root=Path('.work/Folia/folia-server/build/classes/java/main')
          profile=json.loads(Path('worldgen-spec/never-nether-r12-hooks.json').read_text())
          files=set()
          names=list(profile['files'])+['net/minecraft/world/level/levelgen/placement/NeverNetherProposalR12.java']
          for name in names:
              file=root/Path(name).with_suffix('.class')
              if not file.is_file():raise ValueError('Missing compiled class: '+name)
              files.add(file);files.update(file.parent.glob(file.stem+'$*.class'))
          for name in ['NeverNetherCandidateR12Smoke','NeverNetherStorageR11Smoke','NeverNetherGuardR11Smoke']:
              file=(root if name=='NeverNetherGuardR11Smoke' else root/'net/minecraft/world/level/levelgen/placement')/f'{name}.class'
              files.add(file)
          with zipfile.ZipFile('artifacts/candidate-overlay.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for p in sorted(files):archive.write(p,p.relative_to(root).as_posix())
          PY
      - name: Scope and checksums
        if: always()
        run: |
          mkdir -p artifacts
          printf '%s\n' 'R12 optional candidate only. New persisted generator policy; no previous-world migration. CI compiles and checks native proposal/storage semantics, not world generation, balance or playability. No server JAR released.' > artifacts/SCOPE.txt
          git ls-files qa/nevernether-r12 scripts/*candidate-r12.py scripts/apply-never-nether-experiment-r12.py worldgen-spec/never-nether-r12-hooks.json | xargs sha256sum > artifacts/IMPLEMENTATION-SHA256.txt
          (cd artifacts && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeverNether-r12-candidate-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
