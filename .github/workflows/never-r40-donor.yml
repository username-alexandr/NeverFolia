name: R40 author correction review
on:
  push:
    branches: ['fix/neveroverworld-r40-water-resources']
    paths: ['qa/field-r40/inspect_upstream_fixes.py', '.github/workflows/never-r40-donor.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10939310250'
          run-id: 36340789810
          github-token: ${{ github.token }}
          path: baseline
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10942189103'
          run-id: 36351980511
          github-token: ${{ github.token }}
          path: inventory
          merge-multiple: true
      - name: Inspect only; never install a donor version
        run: |
          set -o pipefail
          python3 qa/field-r40/inspect_upstream_fixes.py 2>&1 | tee donor-command.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R40-DONOR-REVIEW-${{ github.sha }}
          path: |
            donor-review/
            donor-command.log
          retention-days: 14
          if-no-files-found: error
