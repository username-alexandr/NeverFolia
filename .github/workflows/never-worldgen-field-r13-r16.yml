name: NeverWorldgen FIELD-R22 FIXPACK / Nether-R16 natural acceptance
on:
  push:
    branches:
      - wip/neveroverworld-field-r12
      - wip/neveroverworld-r22-r19-integration-v2
      - 'fix/**'
      - 'release/**'
    paths:
      - 'native/neveroverworld/field-r13/**'
      - 'native/neveroverworld/field-r14/**'
      - 'native/neveroverworld/field-r15/**'
      - 'native/neveroverworld/field-r16/**'
      - 'scripts/apply-never-overworld-field-r14.py'
      - 'scripts/apply-never-overworld-field-r15.py'
      - 'scripts/apply-never-overworld-field-r16.py'
      - 'scripts/apply-never-overworld-fixpack-r17.py'
      - 'scripts/apply-never-overworld-fixpack-r18.py'
      - 'scripts/apply-never-overworld-field-r18.py'
      - 'native/neveroverworld/field-r18/**'
      - 'qa/field-r18/**'
      - 'qa/field-r19/**'
      - 'scripts/apply-never-overworld-fixpack-r19.py'
      - 'scripts/apply-never-overworld-external-structure-policy-r19.py'
      - 'scripts/apply-never-overworld-external-fast-locate-r19.py'
      - 'scripts/build-never-overworld-external-structures-r19.py'
      - 'worldgen-spec/never-overworld-external-structures-r19.json'
      - 'scripts/apply-never-overworld-field-r20.py'
      - 'scripts/apply-never-overworld-fixpack-r20.py'
      - 'scripts/apply-never-overworld-field-r21.py'
      - 'scripts/apply-never-overworld-fixpack-r21.py'
      - 'scripts/apply-never-overworld-field-r22.py'
      - 'scripts/apply-never-overworld-flood-hook.py'
      - 'scripts/apply-never-overworld-field-r10.py'
      - 'scripts/prepare-never-nether-noise-r5.py'
      - 'third_party/OpenSimplex2/**'
      - 'scripts/apply-never-overworld-fixpack-r22.py'
      - 'scripts/normalize-never-overworld-light-flood-call.py'
      - 'qa/field-r20/**'
      - 'qa/field-r22/**'
      - 'qa/field-r23/**'
      - 'qa/field-r24/**'
      - 'qa/field-r14-r16/**'
      - 'qa/field-r15-r16/**'
      - 'qa/field-r16-r16/**'
      - 'scripts/apply-never-overworld-field-r13.py'
      - 'scripts/apply-never-nether-experiment-r16.py'
      - 'scripts/build-never-nether-field-r16.py'
      - 'qa/nevernether-r16/**'
      - 'qa/field-r13-r16/**'
      - 'qa/ore-light-r12/**'
      - 'scripts/probe-never-overworld-paired-r12.py'
      - 'scripts/probe-never-overworld-trees-villages-r1.py'
      - '.github/workflows/never-worldgen-field-r13-r16.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-r22-fixpack-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  natural:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Materialize unified FIELD-R22 FIXPACK / Nether-R16 candidate
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 -m py_compile qa/field-r13-r16/probe-natural.py
          git config --global user.email actions@github.com
          git config --global user.name 'NeverFolia CI'
          python3 scripts/prepare-never-nether-r13-upstream.py
          test "$(git -C .work/Folia rev-parse HEAD)" = 14b7fee5c866fca9a40ede4a58998fb928140f65
          bash scripts/apply-folia-patches-ci.sh .work/Folia
          bash scripts/apply-neverfolia-post-patches.sh 2>&1 | tee artifacts/production-chain.log
          for stage in 8 9 10 11 12 13 14; do
            python3 "scripts/apply-never-nether-experiment-r${stage}.py" .work/Folia --acknowledge-experimental-worldgen
          done
          python3 scripts/apply-never-nether-bug01-bounds.py .work/Folia
          python3 scripts/apply-never-nether-experiment-r15.py .work/Folia --acknowledge-experimental-worldgen
          python3 qa/ore-light-r12/defer-upper-pruning.py .work/Folia
          sha256sum \
            .work/Folia/folia-server/src/minecraft/java/net/minecraft/world/level/chunk/NeverOverworldFlood.java \
            .work/Folia/folia-server/src/minecraft/java/net/minecraft/world/level/levelgen/feature/AbstractHugeMushroomFeature.java \
            .work/Folia/folia-server/src/minecraft/java/net/minecraft/world/level/levelgen/feature/BambooFeature.java \
            .work/Folia/folia-server/src/minecraft/java/net/minecraft/world/level/levelgen/feature/SimpleBlockFeature.java | tee artifacts/r13-input-sha256.txt
          python3 scripts/apply-never-overworld-fixpack-r22.py .work/Folia
          python3 scripts/apply-never-nether-experiment-r16.py .work/Folia
          python3 scripts/apply-never-overworld-fixpack-r22.py .work/Folia --check-only
          python3 scripts/apply-never-nether-experiment-r16.py .work/Folia --check-only
      - name: Compile and run regressions
        run: |
          set -euo pipefail
          cat > .work/r13-r16.init.gradle <<'GROOVY'
          gradle.projectsEvaluated {
              def server=gradle.rootProject.project(':folia-server')
              def qaDir=new File(gradle.rootProject.buildDir,'r13-r16-qa')
              def cp=server.sourceSets.main.runtimeClasspath
              def files=[
                'qa/neveroverworld-field-r12/FieldPolicyR12Test.java',
                'qa/neveroverworld-field-r12/FieldR12Smoke.java',
                'qa/neveroverworld-trees-r1/TreePreservationSmoke.java',
                'qa/ore-light-r12/UpperOreLightR12Smoke.java',
                'qa/neveroverworld-field-r10/VillageFoundationSmoke.java',
                'qa/neveroverworld-field-r11/FloodBoundarySmoke.java',
                'qa/neveroverworld-desert-r1/DesertR1Smoke.java',
                'qa/neveroverworld-desert-r1/SandstormR1Smoke.java',
                'qa/field-r13-r16/NeverOverworldEcologyR13Smoke.java',
                'qa/field-r14-r16/FloodConnectivityR14Smoke.java',
                'qa/field-r15-r16/FieldR15FloodEcologySmoke.java',
                'qa/field-r16-r16/VillageFoundationR16Smoke.java',
                'qa/field-r18/FieldR18Smoke.java',
                'qa/field-r19/ExternalStructurePolicyR19Smoke.java',
                'qa/field-r20/FieldR20Smoke.java',
                'qa/field-r22/FieldR22Smoke.java',
                'qa/nevernether-r15/NeverNetherFieldCleanupR15Smoke.java',
                'qa/nevernether-r16/NeverNetherFieldCleanupR16Smoke.java'
              ]
              def compileQa=server.tasks.register('r13R16QaCompile',JavaCompile){
                  dependsOn server.tasks.named('classes')
                  source server.files(files.collect{new File(gradle.rootProject.projectDir,'../../'+it)})
                  destinationDirectory=qaDir;classpath=cp;options.release=25
              }
              [
                r13Policy:'net.minecraft.world.level.chunk.FieldPolicyR12Test',
                r13Native:'net.minecraft.world.level.chunk.FieldR12Smoke',
                r13Trees:'net.minecraft.world.level.chunk.TreePreservationSmoke',
                r13Ore:'net.minecraft.world.level.chunk.UpperOreLightR12Smoke',
                r13Village:'net.minecraft.world.level.levelgen.structure.VillageFoundationSmoke',
                r13Boundary:'net.minecraft.world.level.chunk.FloodBoundarySmoke',
                r13Desert:'net.minecraft.world.level.chunk.DesertR1Smoke',
                r13Sandstorm:'net.minecraft.server.level.SandstormR1Smoke',
                r13Ecology:'net.minecraft.world.level.chunk.NeverOverworldEcologyR13Smoke',
                r14Flood:'net.minecraft.world.level.chunk.FloodConnectivityR14Smoke',
                r15FloodEco:'net.minecraft.world.level.chunk.FieldR15FloodEcologySmoke',
                r16Village:'net.minecraft.world.level.levelgen.structure.VillageFoundationR16Smoke',
                r18Native:'net.minecraft.world.level.chunk.FieldR18Smoke',
                r19External:'net.minecraft.world.level.chunk.ExternalStructurePolicyR19Smoke',
                r20Native:'net.minecraft.world.level.chunk.FieldR20Smoke',
                r22Native:'net.minecraft.world.level.chunk.FieldR22Smoke',
                r16Old:'net.minecraft.world.level.levelgen.placement.NeverNetherFieldCleanupR15Smoke',
                r16New:'net.minecraft.world.level.levelgen.placement.NeverNetherFieldCleanupR16Smoke'
              ].each{k,v->server.tasks.register(k,JavaExec){dependsOn compileQa;classpath=cp+server.files(qaDir);mainClass=v;jvmArgs '-ea'}}
          }
          GROOVY
          (cd .work/Folia && ./gradlew :folia-server:r13Policy :folia-server:r13Native :folia-server:r13Trees :folia-server:r13Ore :folia-server:r13Village :folia-server:r13Boundary :folia-server:r13Desert :folia-server:r13Sandstorm :folia-server:r13Ecology :folia-server:r14Flood :folia-server:r15FloodEco :folia-server:r16Village :folia-server:r18Native :folia-server:r19External :folia-server:r20Native :folia-server:r22Native :folia-server:r16Old :folia-server:r16New :folia-server:createPaperclipJar -I ../r13-r16.init.gradle --no-configuration-cache --stacktrace) 2>&1 | tee artifacts/build-smoke.log
          cp .work/Folia/folia-server/build/libs/folia-paperclip-*.jar artifacts/server.jar
          cp .work/Folia/folia-server/build/libs/folia-bundler-*.jar artifacts/pack-input-bundler.jar || true
      - name: Build matching Overworld, historical R15 Nether and candidate R16 Nether packs
        run: |
          set -euo pipefail
          if [ ! -f artifacts/pack-input-bundler.jar ]; then
            python3 - <<'PY'
          import shutil,zipfile
          from pathlib import Path
          found=[]
          for p in Path('.work/Folia/folia-server/build/libs').glob('*.jar'):
              try:
                  with zipfile.ZipFile(p) as z:
                      if any(n.startswith('META-INF/versions/') and n.endswith('/folia-26.2.jar') for n in z.namelist()):found.append(p)
              except zipfile.BadZipFile:pass
          if len(found)!=1:raise SystemExit('pack-input bundler not uniquely found')
          shutil.copyfile(found[0],'artifacts/pack-input-bundler.jar')
          PY
          fi
          python3 scripts/build-never-overworld-core-pack.py --server-jar artifacts/pack-input-bundler.jar --output artifacts/NeverOverworld.zip
          python3 scripts/build-never-overworld-native-structures.py --input artifacts/NeverOverworld.zip
          python3 scripts/normalize-never-overworld-structure-type.py --input artifacts/NeverOverworld.zip
          python3 scripts/build-never-overworld-external-structures-r19.py \
            --input artifacts/NeverOverworld.zip \
            --output artifacts/NeverOverworld-R19.zip
          mv artifacts/NeverOverworld-R19.zip artifacts/NeverOverworld.zip
          python3 scripts/fingerprint-never-overworld-pack.py --input artifacts/NeverOverworld.zip --inject
          python3 scripts/fingerprint-never-overworld-pack.py --input artifacts/NeverOverworld.zip --verify
          python3 scripts/build-never-nether-core-test1-pack.py --output .work/NeverNether-R13.zip
          python3 scripts/fingerprint-never-nether-pack.py --input .work/NeverNether-R13.zip --inject
          python3 scripts/build-never-nether-height-r14.py --input .work/NeverNether-R13.zip --output .work/NeverNether-R14.zip
          python3 scripts/build-never-nether-field-r15.py --input .work/NeverNether-R14.zip --output artifacts/NeverNether-R15.zip
          python3 scripts/fingerprint-never-nether-pack.py --input artifacts/NeverNether-R15.zip --verify
          python3 scripts/build-never-nether-field-r16.py --input artifacts/NeverNether-R15.zip --output artifacts/NeverNether.zip
          python3 scripts/fingerprint-never-nether-pack.py --input artifacts/NeverNether.zip --verify
      - name: Validate imported Overworld dungeon placement graph
        run: |
          set -euo pipefail
          python3 qa/field-r19/validate-external-structures-pack.py \
            --pack artifacts/NeverOverworld.zip \
            --spec worldgen-spec/never-overworld-external-structures-r19.json \
            --output artifacts/external-structures-pack-qa.json
      - name: Record exact FIELD-R22 FIXPACK / Nether-R16 build profile
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p={
            'schema':1,'profile':'FIELD-R22-NR16-NATURAL-1','source_sha':os.environ['GITHUB_SHA'],
            'workflow_run':int(os.environ['GITHUB_RUN_ID']),
            'upstream_sha':'14b7fee5c866fca9a40ede4a58998fb928140f65',
            'jar_sha256':hashlib.sha256(Path('artifacts/server.jar').read_bytes()).hexdigest(),
            'r22_fixpack':True,'nether_r16_installed':True,'production_ready':False
          }
          Path('artifacts/BUILD-PROFILE.json').write_text(json.dumps(p,indent=2)+'\n')
          PY
      - name: Fetch pinned delivered baseline without substituting another revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,os,urllib.request,urllib.error,urllib.parse,zipfile
          from pathlib import Path
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          request=urllib.request.Request('https://api.github.com/repos/username-alexandr/NeverFolia/actions/artifacts/10611756410/zip',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          try:
              with urllib.request.build_opener(NoRedirect).open(request,timeout=60) as response: raw=response.read(80000001)
          except urllib.error.HTTPError as error:
              if error.code!=302: raise
              location=error.headers['Location']
              if urllib.parse.urlsplit(location).scheme!='https': raise ValueError('insecure artifact redirect')
              with urllib.request.urlopen(location,timeout=60) as response: raw=response.read(80000001)
          if hashlib.sha256(raw).hexdigest()!='38f6b569afca06dccfae42d1dd8b733397e08a942e8c54301addd652ee9302a5': raise ValueError('baseline artifact changed')
          with zipfile.ZipFile(io.BytesIO(raw)) as outer:
              names=outer.namelist()
              if len(names)!=1 or not names[0].endswith('.zip'): raise ValueError('unexpected baseline artifact')
              bundle=outer.read(names[0])
          if hashlib.sha256(bundle).hexdigest()!='783f87732256f24f0b90c66d97aff04c78f4439dcb73524a211014eabfaf3f4a': raise ValueError('baseline bundle changed')
          with zipfile.ZipFile(io.BytesIO(bundle)) as archive: jar=archive.read('server.jar')
          if hashlib.sha256(jar).hexdigest()!='dfdbcffce9d4404bbb610828eb804db622ab410f94b37344293ce94d2349ce11': raise ValueError('baseline JAR changed')
          Path('.work/baseline-32c6df3.jar').write_bytes(jar)
          print('Pinned baseline verified; R15 pack is historical-Nether compatibility only')
          PY
      - name: Reproduce FIELD-R24 water/berry seed
        run: |
          set -euo pipefail
          python3 qa/field-r24/probe-water-flora-seed.py \
            --jar artifacts/server.jar \
            --overworld artifacts/NeverOverworld.zip \
            --nether artifacts/NeverNether.zip \
            --output artifacts \
            --source-sha "$GITHUB_SHA"

      - name: Reproduce user-reported FIELD-R22 seed and reject chunk water walls
        run: |
          set -euo pipefail
          python3 qa/field-r20/probe-user-seed.py \
            --jar artifacts/server.jar \
            --overworld artifacts/NeverOverworld.zip \
            --nether artifacts/NeverNether.zip \
            --output artifacts \
            --source-sha "$GITHUB_SHA"

      - name: Reproduce FIELD-R23 sealed-cave overflood seed
        run: |
          set -euo pipefail
          python3 qa/field-r23/probe-cave-flood-seed.py \
            --jar artifacts/server.jar \
            --overworld artifacts/NeverOverworld.zip \
            --nether artifacts/NeverNether.zip \
            --output artifacts \
            --source-sha "$GITHUB_SHA"

      - name: Generate independent worlds and require FIELD-R22 FIXPACK / Nether-R16 natural acceptance
        run: |
          set -euo pipefail
          python3 qa/field-r13-r16/probe-natural.py \
            --jar artifacts/server.jar \
            --baseline-jar .work/baseline-32c6df3.jar \
            --overworld artifacts/NeverOverworld.zip \
            --historical-nether artifacts/NeverNether-R15.zip \
            --nether artifacts/NeverNether.zip \
            --output artifacts \
            --build-manifest artifacts/BUILD-PROFILE.json \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" 2>&1 | tee artifacts/field-r13-r16-natural.log
      - name: Publish accepted FIELD-R22 FIXPACK / Nether-R16 manual test bundle
        uses: actions/upload-artifact@v4
        with:
          name: NeverFolia-FIELD-R22-NR16-FIXPACK-TEST-${{ github.sha }}
          path: artifacts/NeverFolia-FIELD-R22-NR16-FIXPACK-TEST-*.zip
          retention-days: 14
          if-no-files-found: error
      - name: Keep complete diagnostics on success or failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeverFolia-FIELD-R22-NR16-FIXPACK-DIAGNOSTICS-${{ github.sha }}
          path: |
            artifacts/**/*.json
            artifacts/**/*.log
            artifacts/**/*.txt
          retention-days: 14
          if-no-files-found: warn
