name: NeverNether R11 Section Persistence Compile
on:
  push:
    branches: [wip/nevernether-field-r1]
    paths:
      - 'qa/nevernether-r11/**'
      - 'scripts/*storage-r11.py'
      - 'scripts/apply-never-nether-experiment-r11.py'
      - 'worldgen-spec/never-nether-r11-hooks.json'
      - 'worldgen-spec/never-nether-r11-loader-hooks.json'
      - '.github/workflows/never-nether-r11-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Exact source contracts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/SOURCE-SHA.txt
          git rev-parse HEAD^{tree} > artifacts/SOURCE-TREE.txt
          git archive --format=zip HEAD -o artifacts/source.zip
          python3 scripts/test-never-nether-storage-r11.py 2>&1 | tee artifacts/source-contracts.log
      - name: Compile normal production chain and optional R8 R9 remote R10 R11
        run: |
          set -euo pipefail
          git config --global user.email actions@github.com
          git config --global user.name 'NeverFolia CI'
          bash scripts/prepare-upstream.sh
          test "$(git -C .work/Folia rev-parse HEAD)" = 14b7fee5c866fca9a40ede4a58998fb928140f65
          bash scripts/apply-folia-patches-ci.sh .work/Folia
          bash scripts/apply-neverfolia-post-patches.sh 2>&1 | tee artifacts/production-chain.log
          for revision in 8 9 10 11; do
            python3 "scripts/apply-never-nether-experiment-r${revision}.py" .work/Folia --acknowledge-experimental-worldgen
          done
          python3 scripts/apply-never-nether-experiment-r11.py .work/Folia --acknowledge-experimental-worldgen
          cp qa/nevernether-r11/NeverNetherStorageR11Smoke.java qa/nevernether-r11/NeverNetherGuardR11Smoke.java .work/Folia/folia-server/src/minecraft/java/
          cat > .work/r11-smoke.init.gradle <<'GROOVY'
          gradle.projectsEvaluated {
              def server = gradle.rootProject.project(':folia-server')
              server.tasks.register('neverNetherR11GuardSmoke', JavaExec) {
                  dependsOn server.tasks.named('classes')
                  classpath = server.sourceSets.main.runtimeClasspath
                  mainClass = 'NeverNetherGuardR11Smoke'
                  jvmArgs '-ea'
              }
              server.tasks.register('neverNetherR11Smoke', JavaExec) {
                  dependsOn server.tasks.named('classes')
                  classpath = server.sourceSets.main.runtimeClasspath
                  mainClass = 'net.minecraft.world.level.levelgen.placement.NeverNetherStorageR11Smoke'
                  jvmArgs '-ea'
              }
          }
          GROOVY
          (cd .work/Folia && ./gradlew :folia-server:compileJava :folia-server:neverNetherR11Smoke :folia-server:neverNetherR11GuardSmoke -I ../r11-smoke.init.gradle --no-configuration-cache --stacktrace) 2>&1 | tee artifacts/compile-storage-smoke.log
          python3 - <<'PY'
          from pathlib import Path
          import json,zipfile
          root=Path('.work/Folia/folia-server/build/classes/java/main')
          profile=json.loads(Path('worldgen-spec/never-nether-r11-hooks.json').read_text())
          profile['files'].update(json.loads(Path('worldgen-spec/never-nether-r11-loader-hooks.json').read_text())['files'])
          files=set()
          for name in profile['files']:
              p=root/Path(name).with_suffix('.class')
              if not p.is_file():raise ValueError('Missing compiled class '+name)
              files.add(p);files.update(p.parent.glob(p.stem+'$*.class'))
          rel=root/'net/minecraft/world/level/levelgen/placement'
          files.update(rel.glob('NeverNetherStorageR11*.class'))
          files.update(rel.glob('NeverNetherLoadGuardR11*.class'))
          files.add(root/'NeverNetherGuardR11Smoke.class')
          if not files:raise ValueError('Empty class overlay')
          with zipfile.ZipFile('artifacts/candidate-overlay.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(files):z.write(p,p.relative_to(root).as_posix())
          PY
      - name: Scope and integrity records
        if: always()
        run: |
          mkdir -p artifacts
          printf '%s\n' 'R11 OPT-IN EXPERIMENT. Native synthetic-section/NBT tests, not a complete world restart test. No original datapack assets or production server JAR. Normal production chain does not enable R11.' > artifacts/SCOPE.txt
          git ls-files qa/nevernether-r11 scripts/*storage-r11.py scripts/apply-never-nether-experiment-r11.py worldgen-spec/never-nether-r11-hooks.json worldgen-spec/never-nether-r11-loader-hooks.json | xargs sha256sum > artifacts/IMPLEMENTATION-SHA256.txt
          (cd artifacts && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeverNether-r11-storage-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
