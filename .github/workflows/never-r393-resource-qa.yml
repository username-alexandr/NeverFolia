name: FIELD-R39.3 exact candidate runtime and resource gate
on:
  push:
    branches: ['fix/neveroverworld-r393-resource-qa']
    paths:
      - '.github/workflows/never-r393-resource-qa.yml'
      - 'qa/field-r393/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Builder regression tests
        run: |
          mkdir -p artifacts
          set -o pipefail
          python3 qa/field-r393/build_candidate.py --self-test 2>&1 | tee artifacts/r393-builder-tests.log
      - uses: actions/download-artifact@v4
        with:
          name: NeverFolia-R38-CANDIDATE-c6e522c65e5ecd0852c27d724c652189464f51cc
          run-id: 36308250793
          github-token: ${{ github.token }}
          path: baseline
      - name: Reproduce exact full R39.3 pack without changing the engine
        run: |
          mkdir -p candidate
          python3 qa/field-r393/build_candidate.py --input baseline/NeverOverworld.zip --output candidate/NeverOverworld.zip --report artifacts/r393-build.json
          cp baseline/server.jar baseline/NeverNether.zip candidate/
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          expected={'server.jar':'411f628603ae531216c173fde1dbd8c702effb170889f72e5f2c0f1af81b6a32','NeverOverworld.zip':'a5fb99cd0b15efc2ec78a1f155c763112f3e3d2669c1519aae69e468de7902be','NeverNether.zip':'5e47f953cadbd5451b04d1682642417c9a40c726cf06e935c02cecdcb5eb2a10'}
          for name,value in expected.items():
              with Path('candidate',name).open('rb') as f:actual=hashlib.file_digest(f,'sha256').hexdigest()
              if actual!=value:raise ValueError('Not the reviewed candidate: '+name)
          Path('artifacts/r393-inputs.json').write_text(json.dumps(expected,indent=2)+'\n')
          PY
      - name: Real Java 25 startup and restart in a new loopback-only world
        id: runtime
        run: python3 qa/field-r393/smoke_candidate.py --candidate candidate --work .work/r393-smoke --output artifacts
      - name: Exact candidate static resource closure
        id: closure
        if: always() && steps.runtime.outcome != 'skipped'
        continue-on-error: true
        run: python3 scripts/audit-neveroverworld-r39-resources.py --jar candidate/server.jar --pack candidate/NeverOverworld.zip --report artifacts/r393-resource-closure.json
      - name: Preserve evidence and exact tested source
        if: always()
        run: |
          mkdir -p artifacts/source
          cp qa/field-r393/*.py artifacts/source/
          cp .github/workflows/never-r393-resource-qa.yml artifacts/source/
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          Path('artifacts/provenance.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'core_commit':'c6e522c65e5ecd0852c27d724c652189464f51cc','scope':'Full R39.3 resources; bounded Java 25 start/restart only; not water geometry, mob behavior or template placement acceptance','production_accepted':False},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeverFolia-R39.3-evidence-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && steps.runtime.outcome == 'success'
        with:
          name: NeverFolia-R39.3-FULL-PACK-TEST-${{ github.sha }}
          path: candidate/NeverOverworld.zip
          retention-days: 14
          if-no-files-found: error
      - name: Production resource acceptance remains blocked by missing templates
        if: always()
        env:
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          CLOSURE_OUTCOME: ${{ steps.closure.outcome }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          if os.environ['RUNTIME_OUTCOME']!='success':raise SystemExit('Real startup/restart failed or was not executed')
          report=json.loads(Path('artifacts/r393-resource-closure.json').read_text())
          if os.environ['CLOSURE_OUTCOME']!='success' or report.get('pass') is not True:
              raise SystemExit('Not a production release: unresolved resource closure '+json.dumps(report.get('counts',{})))
          print('Static references and bounded startup accepted; placement and gameplay remain separate')
          PY
