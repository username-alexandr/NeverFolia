name: R395 inspect retained generation-order differences
on:
  push:
    branches: ['fix/neveroverworld-r395-water-ice-enchants']
    paths: ['qa/field-r395/review_differences.py', '.github/workflows/never-r395-review.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10934025853'
          run-id: 36324714489
          github-token: ${{ github.token }}
          path: evidence
          merge-multiple: true
      - name: Read actual differing block states and unchanged ice
        run: |
          set -o pipefail
          python3 qa/field-r395/review_differences.py 2>&1 | tee retained-review.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R395-retained-difference-review-${{ github.sha }}
          path: |
            review/
            retained-review.log
          retention-days: 14
          if-no-files-found: error
