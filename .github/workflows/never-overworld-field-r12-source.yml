name: NeverOverworld FIELD-R12 source contract
on:
  push:
    branches: [wip/neveroverworld-field-r12]
    paths: ['.github/workflows/never-overworld-field-r12-source.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Materialize inspected 32c6df3 production source contract
        run: |
          set -euo pipefail
          git config --global user.email actions@github.com
          git config --global user.name 'NeverFolia CI'
          python3 scripts/prepare-never-nether-r13-upstream.py
          test "$(git -C .work/Folia rev-parse HEAD)" = 14b7fee5c866fca9a40ede4a58998fb928140f65
          bash scripts/apply-folia-patches-ci.sh .work/Folia
          bash scripts/apply-neverfolia-post-patches.sh
      - name: Capture complete source contracts, not a gameplay acceptance
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          base=Path('.work/Folia/folia-server/src/minecraft/java')
          files={}
          for folder in ['scripts','native/neveroverworld','qa/neveroverworld-field-r10','qa/neveroverworld-field-r11','qa/neveroverworld-trees-r1','.github/workflows','docs/worldgen']:
              for f in Path(folder).rglob('*'):
                  if f.is_file() and f.suffix in ('.py','.java','.sh','.json','.yml','.md'):
                      files['repo/'+f.as_posix()]=f.read_bytes()
          roots=[
              'net/minecraft/world/level/levelgen/feature',
              'net/minecraft/world/level/levelgen/structure',
              'net/minecraft/world/level/chunk',
          ]
          for folder in roots:
              for f in (base/folder).rglob('*.java'):
                  files['runtime/'+f.relative_to(base).as_posix()]=f.read_bytes()
          for name in ['WorldGenLevel','LevelAccessor','LevelReader','BlockGetter','CommonLevelAccessor','LevelWriter']:
              f=base/'net/minecraft/world/level'/f'{name}.java'
              files['runtime/'+f.relative_to(base).as_posix()]=f.read_bytes()
          for name in ['WorldGenRegion','ServerLevel']:
              f=base/'net/minecraft/server/level'/f'{name}.java'
              files['runtime/'+f.relative_to(base).as_posix()]=f.read_bytes()
          files['SOURCE-CONTRACT.json']=(json.dumps({'source_sha':os.environ['GITHUB_SHA'],'base_gameplay_sha':'32c6df3029fca001fd3602012e446a901f80eb2f','upstream_sha':'14b7fee5c866fca9a40ede4a58998fb928140f65','sha256':{n:hashlib.sha256(v).hexdigest() for n,v in files.items()},'gameplay_acceptance':False},indent=2)+'\n').encode()
          with zipfile.ZipFile('artifacts/field-r12-source-contract.zip','w',zipfile.ZIP_DEFLATED) as z:
              for n,v in sorted(files.items()):z.writestr(n,v)
          print('Captured source contracts:',len(files),'files; no acceptance claim')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NeverOverworld-field-r12-source-${{ github.sha }}
          path: artifacts/field-r12-source-contract.zip
          retention-days: 7
          if-no-files-found: error
