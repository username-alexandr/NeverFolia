name: NeverOverworld Field R11 Candidate
on:
  push:
    branches: [staging/neveroverworld-field-r11]
    paths:
      - 'native/neveroverworld/field-r11/**'
      - 'qa/neveroverworld-field-r11/**'
      - 'scripts/apply-never-overworld-field-r11.py'
      - 'scripts/test-never-overworld-field-r11.py'
      - '.github/workflows/never-overworld-field-r11.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  field-r11:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Exact R11 source contracts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/SOURCE-SHA.txt
          git rev-parse HEAD^{tree} > artifacts/SOURCE-TREE.txt
          python3 scripts/test-never-overworld-field-r11.py 2>&1 | tee artifacts/field-r11-python-tests.log
      - name: Compile full FIELD-R10 plus R11 and native smoke
        run: |
          set -euo pipefail
          git config --global user.email actions@github.com
          git config --global user.name 'NeverFolia CI'
          python3 scripts/prepare-never-nether-r13-upstream.py
          test "$(git -C .work/Folia rev-parse HEAD)" = 14b7fee5c866fca9a40ede4a58998fb928140f65
          bash scripts/apply-folia-patches-ci.sh .work/Folia
          bash scripts/apply-neverfolia-post-patches.sh 2>&1 | tee artifacts/production-chain.log
          python3 scripts/apply-never-overworld-field-r11.py .work/Folia --check-only
          python3 scripts/apply-never-overworld-field-r11.py .work/Folia
          python3 scripts/apply-never-overworld-field-r11.py .work/Folia
          for stage in 8 9 10 11 12 13 14; do
            python3 "scripts/apply-never-nether-experiment-r${stage}.py" .work/Folia --acknowledge-experimental-worldgen
          done
          python3 scripts/apply-never-nether-bug01-bounds.py .work/Folia
          cat > .work/field-r11.init.gradle <<'GROOVY'
          gradle.projectsEvaluated {
              def server = gradle.rootProject.project(':folia-server')
              def qaDir = new File(gradle.rootProject.buildDir, 'field-r11-qa-classes')
              def runtimeClasspath = server.sourceSets.main.runtimeClasspath
              def qaCompile = server.tasks.register('neverOverworldFieldR11QaCompile', JavaCompile) {
                  dependsOn server.tasks.named('classes')
                  source new File(gradle.rootProject.projectDir, '../../qa/neveroverworld-field-r11/FloodBoundarySmoke.java')
                  destinationDirectory = qaDir
                  classpath = runtimeClasspath
                  options.release = 25
              }
              server.tasks.register('neverOverworldFieldR11Smoke', JavaExec) {
                  dependsOn qaCompile
                  classpath = runtimeClasspath + server.files(qaDir)
                  mainClass = 'net.minecraft.world.level.chunk.FloodBoundarySmoke'
                  jvmArgs '-ea'
              }
          }
          GROOVY
          (cd .work/Folia && ./gradlew :folia-server:compileJava :folia-server:neverOverworldFieldR11Smoke :folia-server:createPaperclipJar -I ../field-r11.init.gradle --no-configuration-cache --stacktrace) 2>&1 | tee artifacts/native-build-smoke.log
          python3 - <<'PY'
          import hashlib,json,os,shutil,zipfile
          from pathlib import Path
          jars=list(Path('.work/Folia/folia-server/build/libs').glob('folia-paperclip-*.jar'))
          if len(jars)!=1: raise ValueError(f'Expected one Paperclip: {jars}')
          src=jars[0]
          with zipfile.ZipFile(src) as z:
              if z.testzip() is not None: raise ValueError('Corrupt Paperclip')
          dest=Path('artifacts')/f"NeverFolia-NN-FIELD-R11-TEST-{os.environ['GITHUB_SHA'][:7]}.jar";shutil.copyfile(src,dest)
          info={'schema':1,'source_sha':os.environ['GITHUB_SHA'],'jar':dest.name,'jar_sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),'base':'FIELD-R10 c987d9c','seed':-2996952393010080672,'policy':'owner-chunk boundary-connected floodable components Y=-64..127','release_ready':False,'scope':'Compile/native candidate; natural user-seed seam and visual acceptance remains separate.'}
          Path('artifacts/BUILD-INFO.json').write_text(json.dumps(info,indent=2)+'\n')
          root=Path('.work/Folia/folia-server/src/minecraft/java/net/minecraft/world/level/levelgen/structure/structures')
          names=['OceanMonumentStructure.java','OceanMonumentPieces.java']
          with zipfile.ZipFile('artifacts/monument-api.zip','w',zipfile.ZIP_DEFLATED) as z:
              for n in names:
                  p=root/n
                  if not p.is_file(): raise ValueError('Missing monument source '+n)
                  z.write(p,n)
          PY
      - name: Scope and hashes
        if: always()
        run: |
          mkdir -p artifacts
          git ls-files 'native/neveroverworld/field-r11/**' 'qa/neveroverworld-field-r11/**' 'scripts/*field-r11*' | xargs sha256sum > artifacts/IMPLEMENTATION-SHA256.txt
          printf '%s\n' 'FIELD-R11 candidate only. Do not promote before same-seed saved-world seam audit and opposite-order checks. Monument sources are exported read-only for the next fix.' > artifacts/SCOPE.txt
          (cd artifacts && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeverOverworld-field-r11-${{ github.sha }}
          path: artifacts/*
          retention-days: 14
          if-no-files-found: error
