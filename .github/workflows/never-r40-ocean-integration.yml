name: R40 integrated ocean candidate
on:
  push:
    branches: ['fix/neveroverworld-r40-ocean-integration']
    paths: ['qa/field-r40/**', '.github/workflows/never-r40-ocean-integration.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10939310250'
          run-id: 36340789810
          github-token: ${{ github.token }}
          path: baseline
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10928009164'
          run-id: 36308250793
          github-token: ${{ github.token }}
          path: debug
          merge-multiple: true
      - name: Compile integrated kernel, prove inherited hotfix byte preservation
        id: build
        run: |
          mkdir -p artifacts
          set -o pipefail
          python3 -m py_compile qa/field-r40/*.py
          python3 qa/field-r40/build.py 2>&1 | tee artifacts/build-command.log
      - name: Actual closure fixtures, paired natural generation, and restart
        id: runtime
        run: |
          set -o pipefail
          python3 qa/field-r40/runtime.py 2>&1 | tee artifacts/runtime-command.log
      - name: Preserve evidence and source identity even on failure
        if: always()
        run: |
          mkdir -p artifacts/r40-source
          cp qa/field-r40/* .github/workflows/never-r40-ocean-integration.yml artifacts/r40-source/ 2>/dev/null || test -d artifacts/r40-source
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d={'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'production_accepted':False,'scope':'Integrated R399 plus bounded R395; fixture adapters and genuine natural scheduling are reported separately','source_sha256':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('artifacts/r40-source').iterdir() if p.is_file()}}
          Path('artifacts/r40-provenance.json').write_text(json.dumps(d,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R40-INTEGRATION-EVIDENCE-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
      - name: Package complete isolated test kit only after current success
        if: steps.build.outcome == 'success' && steps.runtime.outcome == 'success'
        run: python3 qa/field-r40/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.build.outcome == 'success' && steps.runtime.outcome == 'success'
        with:
          name: NeverFolia-R40-Ocean-Integrated-TEST-${{ github.sha }}
          path: test-kit/
          retention-days: 14
          if-no-files-found: error
      - name: Require actual completed integration, never production acceptance
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          RUNTIME: ${{ steps.runtime.outcome }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          assert os.environ['BUILD']=='success' and os.environ['RUNTIME']=='success','Build or bounded integration failed or was skipped'
          r=json.loads(Path('artifacts/r40-runtime.json').read_text())
          assert r['bounded_integration_pass'] is True and not r.get('error')
          print('Bounded R40 integration passed. Full visual worldgen and production remain unaccepted.')
          PY
