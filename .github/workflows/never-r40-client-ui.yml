name: R40 real Fabric creative-book UI
on:
  push:
    branches: ['fix/neveroverworld-r40-integrated-worldgen']
    paths: ['qa/field-r40/client_ui.py', 'qa/field-r40/ClientUiQaMixin.java', 'client/neverland-enchantment-ui/**', '.github/workflows/never-r40-client-ui.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '25'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '10939310250', run-id: 36340789810, github-token: '${{ github.token }}', path: baseline, merge-multiple: true}
      - name: Ensure the isolated graphical test display is available
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb libgl1-mesa-dri
          fi
      - name: Verify actual rendered creative-list generation and translations
        run: |
          set -o pipefail
          python3 qa/field-r40/client_ui.py 2>&1 | tee client-ui-command.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R40-CLIENT-UI-EVIDENCE-${{ github.sha }}
          path: |
            client-ui-evidence/
            client-ui-command.log
            qa/field-r40/client_ui.py
            qa/field-r40/ClientUiQaMixin.java
          retention-days: 14
          if-no-files-found: error
