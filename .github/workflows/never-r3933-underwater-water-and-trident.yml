name: R3933 underwater water and trident
on:
  push:
    branches: ['fix/neveroverworld-r3933-underwater-water-and-trident']
    paths:
      - 'qa/field-r3933/**'
      - '.github/workflows/never-r3933-underwater-water-and-trident.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: r3933-underwater-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '25'}

      - name: Download R39.9 natural baseline
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10939310250'
          run-id: 36340789810
          github-token: '${{ github.token }}'
          path: baseline
          merge-multiple: true

      - name: Download accepted R39.32 baseline
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '11136616166'
          run-id: 36802916891
          github-token: '${{ github.token }}'
          path: baseline-r3932
          merge-multiple: true

      - name: Build R39.33 candidate
        id: build
        run: |
          mkdir -p artifacts
          python3 -m py_compile qa/field-r3933/*.py
          set -o pipefail
          python3 qa/field-r3933/build.py 2>&1 | tee artifacts/r3933-build-command.log

      - name: Runtime and policy audit
        id: runtime
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          python3 qa/field-r3933/runtime.py 2>&1 | tee artifacts/r3933-runtime-command.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R3933-EVIDENCE-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

      - name: Package manual test
        if: steps.build.outcome == 'success' && steps.runtime.outcome == 'success'
        run: python3 qa/field-r3933/package.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.build.outcome == 'success' && steps.runtime.outcome == 'success'
        with:
          name: NeverFolia-R39.33-Underwater-TEST-${{ github.sha }}
          path: test-kit-r3933/
          retention-days: 14
          if-no-files-found: error

      - name: Require accepted automated gates
        if: always()
        env:
          BUILD: '${{ steps.build.outcome }}'
          RUNTIME: '${{ steps.runtime.outcome }}'
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          assert os.environ['BUILD']=='success' and os.environ['RUNTIME']=='success'
          b=json.loads(Path('artifacts/build-r3933.json').read_text())
          r=json.loads(Path('artifacts/runtime-r3933.json').read_text())
          assert b['build_pass'] is True and r['pass'] is True
          assert b['small_structure_placement_unchanged'] is True
          print('R39.33 automated gates passed; manual Trident visual QA is still required.')
          PY
