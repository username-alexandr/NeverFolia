name: R399 persisted dry-mine protection
on:
  push:
    branches: ['fix/neveroverworld-r399-persisted-mine-guard']
    paths:
      - 'scripts/apply-never-overworld-dry-mine-r399.py'
      - 'qa/field-r399/**'
      - '.github/workflows/never-r399-mine-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r399-mine-guard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mine-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10933533919'
          run-id: 36325173594
          github-token: ${{ github.token }}
          path: baseline
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10928009164'
          run-id: 36308250793
          github-token: ${{ github.token }}
          path: debug
          merge-multiple: true
      - name: Compile actual mine class and region-owned fixtures, retain R396 policy bytes
        id: build
        run: |
          mkdir -p artifacts
          set -o pipefail
          python3 qa/field-r399/build.py 2>&1 | tee artifacts/build-command.log
      - name: Baseline and fixed membership plus real saved-PDC reload on both kernels
        id: runtime
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 qa/field-r399/runtime.py 2>&1 | tee artifacts/runtime-command.log
      - name: Preserve source and provenance even on failure
        if: always()
        run: |
          mkdir -p artifacts/source
          cp qa/field-r399/* scripts/apply-never-overworld-dry-mine-r399.py .github/workflows/never-r399-mine-guard.yml artifacts/source/
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out={'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'production_accepted':False,
               'scope':'R396 plus persisted mine-membership fallback. Ocean closure, ice, client UI not included.'}
          out['source_sha256']={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('artifacts/source').iterdir() if p.is_file()}
          Path('artifacts/provenance.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R399-MINE-EVIDENCE-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
      - name: Assemble isolated test kit only after successful current regression
        if: steps.runtime.outcome == 'success'
        run: |
          python3 - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          r=json.loads(Path('artifacts/runtime.json').read_text())
          assert r['pass'] is True and r['only_expected_changes'] is True
          out=Path('candidate');packs=out/'world/datapacks';packs.mkdir(parents=True)
          for n in ('NeverOverworld.zip','NeverNether.zip'):(out/n).rename(packs/n)
          for n in ('build.json','runtime.json','provenance.json'):shutil.copyfile(Path('artifacts')/n,out/n)
          (out/'eula.txt').write_text('eula=false\n')
          (out/'jvm.args').write_text('-Xms1G\n-Xmx4G\n-Dfile.encoding=UTF-8\n')
          (out/'server.properties').write_text('level-name=world\nlevel-seed=-4651369264513492755\ninitial-enabled-packs=vanilla,file/NeverOverworld.zip,file/NeverNether.zip\nserver-ip=127.0.0.1\nserver-port=25609\nonline-mode=true\nwhite-list=true\nenforce-whitelist=true\nmax-players=2\ngamemode=creative\ndifficulty=normal\nallow-flight=true\nview-distance=4\nsimulation-distance=3\npause-when-empty-seconds=-1\nenable-rcon=false\n')
          (out/'start.sh').write_text('#!/usr/bin/env bash\nset -euo pipefail\ncd "$(dirname "$0")"\njava -version\nsha256sum -c BINARIES.sha256\nexec java @jvm.args -jar server.jar --nogui\n')
          (out/'start.bat').write_bytes(b'@echo off\r\ncd /d "%~dp0"\r\njava -version\r\njava "@jvm.args" -jar server.jar --nogui\r\npause\r\n')
          (out/'README-RU.md').write_text('# NeverFolia R39.9 — проверка защиты шахт\n\nВ основе точный R39.6. Его исправление удаления снега сохранено. Новая правка сохраняет защиту отдельных частей шахты после освобождения временной маски, используя существующие постоянные данные чанка. Общий прямоугольник всей шахты не заливается и не защищается.\n\nЭто НЕ исправление крупных воздушных полостей под островами. Экспериментальная заливка R39.5, изменения льда и клиентского интерфейса не включены; прежние 95 недостающих шаблонов остаются.\n\nПроверены синтетические границы частей шахты в двух настоящих чанках (положительные и отрицательные координаты), кэш и отсутствие кэша, повреждённые данные, вызов водной политики и сериализация границ после штатной остановки. Это не проверка всех естественных шахт, всего cleanup или всех seed.\n\nРаспаковать ТОЛЬКО в новую пустую папку. Старый мир со скриншотами не удалять и не копировать сюда. Java 25 нужна отдельно. Прочитать Minecraft EULA и при согласии вручную изменить eula=false на eula=true. Запуск: Windows start.bat, Linux bash start.sh. Либо java "@jvm.args" -jar server.jar --nogui.\n\nПодключение только с этой машины: localhost:25609. Для другой машины нужен SSH-туннель либо осознанная настройка адреса и брандмауэра. После Done: whitelist add ВАШ_НИК и op ВАШ_НИК — две команды консоли. Штатная остановка: stop.\n\nВ Windows start.bat не проверяет хеши автоматически; они находятся в BINARIES.sha256. Linux start.sh проверяет три игровых файла. Полный SHA256SUMS относится к исходной распаковке: редактирование настроек закономерно меняет их хеши.\n\nКандидат собран инкрементально javac --release 25, не полной Gradle-сборкой. QA-плагин не включён. Состав изменений и точные результаты: build.json, runtime.json, provenance.json. Ремонт старых повреждённых чанков не выполняется.\n')
          binary=[out/'server.jar',packs/'NeverOverworld.zip',packs/'NeverNether.zip']
          (out/'BINARIES.sha256').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.relative_to(out).as_posix()+'\n' for p in binary))
          (out/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.relative_to(out).as_posix()+'\n' for p in sorted(out.rglob('*')) if p.is_file()))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.runtime.outcome == 'success'
        with:
          name: NeverFolia-R39.9-Mine-Guard-TEST-${{ github.sha }}
          path: candidate/
          retention-days: 14
          if-no-files-found: error
      - name: Require actual completed regression, not production acceptance
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          RUNTIME: ${{ steps.runtime.outcome }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          assert os.environ['BUILD']=='success' and os.environ['RUNTIME']=='success','Build or regression failed/skipped'
          assert json.loads(Path('artifacts/runtime.json').read_text())['pass'] is True
          print('R399 bounded mine protection passed; full worldgen NOT accepted.')
          PY
