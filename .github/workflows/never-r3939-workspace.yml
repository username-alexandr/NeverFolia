name: R3939 placement workspace
on:
  push:
    branches: ['fix/neveroverworld-r3939-placement-validation']
    paths: ['.github/workflows/never-r3939-workspace.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Export immutable source and compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r3939-workspace
          git archive --format=tar.gz HEAD > /tmp/r3939-workspace/source.tar.gz
          tar -C "$JAVA_HOME" -czf /tmp/r3939-workspace/jdk25.tar.gz .
          git rev-parse HEAD > /tmp/r3939-workspace/COMMIT.txt
          cd /tmp/r3939-workspace
          sha256sum *.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: R3939-WORKSPACE
          path: /tmp/r3939-workspace/
          retention-days: 1
          compression-level: 0
