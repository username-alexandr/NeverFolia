name: R41 template and mob contracts
on:
  push:
    branches: ['fix/neveroverworld-r41-consolidated']
    paths: ['qa/field-r41/inspect_templates.py', '.github/workflows/never-r41-details.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  detail:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10939310250'
          run-id: 36340789810
          github-token: ${{ github.token }}
          path: inputs
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10961881822'
          run-id: 36404992858
          github-token: ${{ github.token }}
          path: prior
          merge-multiple: true
      - name: Inspect exact connector contracts and loot references
        run: |
          mkdir -p r41-details
          set -o pipefail
          python3 qa/field-r41/inspect_templates.py 2>&1 | tee r41-details/inspection.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R41-TEMPLATE-DETAILS-${{ github.sha }}
          path: r41-details/
          retention-days: 14
          if-no-files-found: error
