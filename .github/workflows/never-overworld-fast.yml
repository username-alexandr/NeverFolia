name: Validate NeverOverworld

on:
  push:
    branches:
      - develop
      - feature/never-overworld-worldgen
      - 'wip/**'
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: NR-DEV-1 fast validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout NeverFolia repository
        uses: actions/checkout@v6

      - name: Validate NeverOverworld contract
        run: python3 ./scripts/validate-never-overworld-spec.py

      - name: Validate reserved NeverEnd contract
        run: python3 ./scripts/validate-never-end-spec.py

      - name: Self-test NeverOverworld Core builder
        run: python3 ./scripts/build-never-overworld-core-pack.py --self-test

      - name: Self-test NeverOverworld semantic hasher
        run: python3 ./scripts/hash-never-overworld-generation-chunks.py --self-test

      - name: Self-test NeverOverworld Moonrise LIGHT flood hook
        run: python3 ./scripts/apply-never-overworld-moonrise-light-flood-hook.py --self-test

      - name: Self-test NeverOverworld deterministic floodable-volume semantics
        run: python3 ./scripts/apply-never-overworld-floodable-volume.py --self-test

      - name: Self-test NeverOverworld LIGHT flood activation instrumentation
        run: python3 ./scripts/instrument-never-overworld-flood-debug.py --self-test

      - name: Self-test NeverOverworld native fluid picker
        run: python3 ./scripts/apply-never-overworld-fluid-picker.py --self-test

      - name: Self-test NeverOverworld native generated-fluid feature filter
        run: python3 ./scripts/apply-never-overworld-fluid-feature-filter.py --self-test

      - name: Self-test NeverOverworld fingerprint tool
        run: python3 ./scripts/fingerprint-never-overworld-pack.py --self-test

      - name: Self-test NeverOverworld fingerprint guard
        run: python3 ./scripts/apply-never-overworld-fingerprint-guard.py --self-test
