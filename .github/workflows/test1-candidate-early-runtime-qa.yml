name: TEST1 Candidate Early Runtime QA

on:
  push:
    branches:
      - wip/test1-field-fixes-qa-runner
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  early-runtime:
    name: Early vanilla locate and shoreline regression probe
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_SHA: 714ca8fe912a93fffd57fc8ef632a40ccb3c59bd
      TARGET_BUILD_RUN: '33911102330'
      FROZEN_RUN: '33890427028'
      FROZEN_SHA: 2f680ee1bf6024ba43a7894868977f1f65fdfd78

    steps:
      - name: Checkout QA source
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Wait for candidate compiled JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED="NeverFolia-compiled-${TARGET_SHA}"
          for attempt in $(seq 1 150); do
            DATA="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_BUILD_RUN}/artifacts")"
            FOUND="$(jq -r --arg name "${EXPECTED}" '.artifacts[]? | select(.name == $name and (.expired | not)) | .id' <<<"${DATA}" | head -n 1)"
            if [ -n "${FOUND}" ]; then
              echo "Compiled artifact is ready: ${FOUND}"
              exit 0
            fi
            RUN="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_BUILD_RUN}")"
            STATUS="$(jq -r '.status' <<<"${RUN}")"
            CONCLUSION="$(jq -r '.conclusion // ""' <<<"${RUN}")"
            if [ "${STATUS}" = "completed" ] && [ "${CONCLUSION}" != "success" ]; then
              echo "Candidate build terminated before early artifact became available: ${CONCLUSION}" >&2
              exit 1
            fi
            echo "Waiting for compiled candidate artifact (${attempt}/150)..."
            sleep 10
          done
          echo "Timed out waiting for ${EXPECTED}" >&2
          exit 1

      - name: Download candidate compiled JAR
        uses: actions/download-artifact@v5
        with:
          name: NeverFolia-compiled-${{ env.TARGET_SHA }}
          path: candidate-compiled
          github-token: ${{ github.token }}
          run-id: ${{ env.TARGET_BUILD_RUN }}

      - name: Download frozen TEST1 pack source
        uses: actions/download-artifact@v5
        with:
          name: NeverFolia-${{ env.FROZEN_SHA }}
          path: frozen-artifact
          github-token: ${{ github.token }}
          run-id: ${{ env.FROZEN_RUN }}

      - name: Verify early QA inputs
        run: |
          set -euo pipefail
          JAR="$(find candidate-compiled -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          PACK="$(find frozen-artifact -type f -name 'NeverOverworld-Core-*.zip' | sort | head -n 1)"
          test -n "${JAR}"
          test -n "${PACK}"
          grep -F "Git commit: ${TARGET_SHA}" candidate-compiled/BUILD-INFO.txt
          echo "Candidate JAR: ${JAR}"
          echo "Frozen datapack: ${PACK}"
          sha256sum "${JAR}" "${PACK}"

      - name: Normalize mansion QA id for Minecraft 26.2
        run: |
          set -euo pipefail
          sed -i 's/minecraft:woodland_mansion/minecraft:mansion/g' ./scripts/probe-never-overworld-vanilla-locate-matrix.sh
          sed -i 's/minecraft:woodland_mansion/minecraft:mansion/g' ./scripts/probe-never-overworld-vanilla-field-structures.sh
          ! grep -R -F 'minecraft:woodland_mansion' ./scripts/probe-never-overworld-vanilla-locate-matrix.sh ./scripts/probe-never-overworld-vanilla-field-structures.sh

      - name: Probe flooded vanilla locate availability matrix
        run: |
          set -euo pipefail
          JAR="$(find candidate-compiled -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          PACK="$(find frozen-artifact -type f -name 'NeverOverworld-Core-*.zip' | sort | head -n 1)"
          chmod +x ./scripts/probe-never-overworld-vanilla-locate-matrix.sh
          ./scripts/probe-never-overworld-vanilla-locate-matrix.sh "${JAR}" "${PACK}"

      - name: Probe vanilla field structures and locate latency
        if: always()
        run: |
          set -euo pipefail
          JAR="$(find candidate-compiled -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          PACK="$(find frozen-artifact -type f -name 'NeverOverworld-Core-*.zip' | sort | head -n 1)"
          test -n "${JAR}"
          test -n "${PACK}"
          chmod +x ./scripts/probe-never-overworld-vanilla-field-structures.sh
          ./scripts/probe-never-overworld-vanilla-field-structures.sh "${JAR}" "${PACK}"

      - name: Probe positive shoreline flora relocation
        if: always()
        run: |
          set -euo pipefail
          JAR="$(find candidate-compiled -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          PACK="$(find frozen-artifact -type f -name 'NeverOverworld-Core-*.zip' | sort | head -n 1)"
          test -n "${JAR}"
          test -n "${PACK}"
          chmod +x ./scripts/probe-never-overworld-shoreline-flora.sh
          ./scripts/probe-never-overworld-shoreline-flora.sh "${JAR}" "${PACK}"

      - name: Upload early QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TEST1-candidate-early-runtime-${{ env.TARGET_SHA }}
          path: |
            artifacts/NeverOverworld-vanilla-locate-matrix.json
            artifacts/NeverOverworld-vanilla-field-structures.json
            artifacts/NeverOverworld-shoreline-flora.json
            overworld-vanilla-locate-matrix-test/locate-matrix.tsv
            overworld-vanilla-locate-matrix-test/server.log
            overworld-vanilla-field-structures-test/locate-results.tsv
            overworld-vanilla-field-structures-test/server.log
            overworld-shoreline-flora-test/biome-results.tsv
            overworld-shoreline-flora-test/server.log
          if-no-files-found: warn
          retention-days: 30
