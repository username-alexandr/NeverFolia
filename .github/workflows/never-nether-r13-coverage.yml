name: NeverNether R13 Coverage Contracts
on:
  push:
    branches: [wip/nevernether-field-r1]
    paths:
      - 'qa/nevernether-r13/**'
      - 'qa/nevernether-r8/run-stage-probe.py'
      - 'scripts/compare-never-nether-stages-r8.py'
      - 'scripts/test-never-nether-broad-r13.py'
      - '.github/workflows/never-nether-r13-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate exact original coverage and unchanged observation checks
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/SOURCE-SHA.txt
          python3 -m pip install numpy==2.3.5
          python3 scripts/test-never-nether-broad-r13.py 2>&1 | tee artifacts/broad-tests.log
          python3 scripts/test-never-nether-stages-r8.py 2>&1 | tee artifacts/stage-tests.log
          python3 scripts/test-never-nether-candidate-r13.py 2>&1 | tee artifacts/reconciliation-tests.log
          python3 qa/nevernether-r13/broad1599.py plan > artifacts/exact-plan1599.json
          printf '%s\n' 'Coverage/source contracts only. No game world generated by this job; no equality or release claim.' > artifacts/SCOPE.txt
          (cd artifacts && sha256sum *.json *.txt *.log > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeverNether-r13-coverage-${{ github.sha }}
          path: artifacts/*
          retention-days: 14
          if-no-files-found: error
