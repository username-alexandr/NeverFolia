name: R3926 ocean cave classifier
on:
  push:
    branches: ['fix/neveroverworld-r3926-ocean-cave-classifier']
    paths:
      - 'native/overworld-r3926/**'
      - 'qa/field-r3926/**'
      - '.github/workflows/never-r3926-ocean-cave.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  classifier:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10939310250'
          run-id: 36340789810
          github-token: ${{ github.token }}
          path: baseline
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10941005650'
          run-id: 36345765349
          github-token: ${{ github.token }}
          path: debug
          merge-multiple: true
      - name: Build exact R39.9 plus R3926
        id: build
        run: |
          mkdir -p artifacts
          python3 -m py_compile qa/field-r3926/*.py
          set -o pipefail
          python3 qa/field-r3926/build.py 2>&1 | tee artifacts/build-command.log
      - name: Run real Folia ProtoChunk fixture
        id: runtime
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          python3 qa/field-r3926/runtime.py 2>&1 | tee artifacts/runtime-command.log
      - name: Preserve source and provenance
        if: always()
        run: |
          mkdir -p artifacts/source
          cp -R native/overworld-r3926 qa/field-r3926 .github/workflows/never-r3926-ocean-cave.yml artifacts/source/
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          Path('artifacts/provenance.json').write_text(json.dumps({
            'commit':os.environ['GITHUB_SHA'],
            'run_id':os.environ['GITHUB_RUN_ID'],
            'base':'R39.9 c8886cb5927370e47bfaf8a3ecd274f72880868e0eb2e8fb15bfddde162c7b67',
            'production_accepted':False
          },indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R3926-EVIDENCE-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
      - name: Package isolated manual-test kit
        if: steps.build.outcome == 'success' && steps.runtime.outcome == 'success'
        run: python3 qa/field-r3926/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.build.outcome == 'success' && steps.runtime.outcome == 'success'
        with:
          name: NeverFolia-R39.26-Ocean-Cave-TEST-${{ github.sha }}
          path: test-kit/
          retention-days: 14
          if-no-files-found: error
      - name: Require current fixture pass
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          RUNTIME: ${{ steps.runtime.outcome }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          assert os.environ['BUILD']=='success' and os.environ['RUNTIME']=='success'
          r=json.loads(Path('artifacts/runtime.json').read_text())
          assert r['pass'] is True and r['read_max_y']==128 and r['reads_above_sea_level']==0
          print('R39.26 bounded fixture passed; manual natural-world acceptance still required.')
          PY
