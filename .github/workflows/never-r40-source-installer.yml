name: R40 late source installer checks
on:
  push:
    branches: ['fix/neveroverworld-r40-ocean-integration']
    paths: ['.github/workflows/never-r40-source-installer.yml', 'scripts/apply-never-overworld-ocean-r40.py']
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10940036171'
          run-id: 36343802010
          github-token: ${{ github.token }}
          repository: username-alexandr/NeverFolia
          path: source-contract
          merge-multiple: true
      - name: Test exact-source application without rerunning a game world
        run: |
          mkdir -p result
          set -o pipefail
          python3 qa/field-r40/test_source_installer.py 2>&1 | tee result/tests.log
          cp scripts/apply-never-overworld-ocean-r40.py qa/field-r40/test_source_installer.py result/
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          result={'commit':os.environ['GITHUB_SHA'],'scope':'Source staging only, not a full Gradle build or another game-world test','source_sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('result').iterdir()}}
          Path('result/provenance.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R40-SOURCE-INSTALLER-TESTS-${{ github.sha }}
          path: result/
          retention-days: 14
          if-no-files-found: error
