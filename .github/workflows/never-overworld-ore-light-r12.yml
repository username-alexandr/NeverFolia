name: NeverOverworld ORE-LIGHT-R12 regression
on:
  push:
    branches: [wip/neveroverworld-field-r12]
    paths:
      - 'qa/ore-light-r12/**'
      - '.github/workflows/never-overworld-ore-light-r12.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test the source overlay
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 qa/ore-light-r12/test-defer-upper-pruning.py 2>&1 | tee artifacts/ore-light-installer-tests.log
          python3 scripts/apply-never-overworld-field-r12.py --self-test
      - name: Materialize canonical FIELD-R12 plus Nether R15
        run: |
          set -euo pipefail
          git config --global user.email actions@github.com
          git config --global user.name 'NeverFolia CI'
          python3 scripts/prepare-never-nether-r13-upstream.py
          test "$(git -C .work/Folia rev-parse HEAD)" = 14b7fee5c866fca9a40ede4a58998fb928140f65
          bash scripts/apply-folia-patches-ci.sh .work/Folia
          bash scripts/apply-neverfolia-post-patches.sh 2>&1 | tee artifacts/production-chain.log
          python3 scripts/apply-never-overworld-field-r12.py .work/Folia --check-only
          for stage in 8 9 10 11 12 13 14; do
            python3 "scripts/apply-never-nether-experiment-r${stage}.py" .work/Folia --acknowledge-experimental-worldgen
          done
          python3 scripts/apply-never-nether-bug01-bounds.py .work/Folia
          python3 scripts/apply-never-nether-experiment-r15.py .work/Folia --acknowledge-experimental-worldgen
          python3 scripts/preserve-never-overworld-trees-r1.py .work/Folia --check-only
          python3 scripts/remove-never-overworld-village-reclamation-r1.py .work/Folia --check-only
      - name: Apply and verify explicit late-pruning overlay
        run: |
          set -euo pipefail
          python3 qa/ore-light-r12/defer-upper-pruning.py .work/Folia 2>&1 | tee artifacts/ore-light-install.log
          python3 qa/ore-light-r12/defer-upper-pruning.py .work/Folia --check-only
          python3 scripts/preserve-never-overworld-trees-r1.py .work/Folia --check-only
          python3 scripts/remove-never-overworld-village-reclamation-r1.py .work/Folia --check-only
      - name: Compile and run late-vein and retained native regressions
        run: |
          set -euo pipefail
          cat > .work/ore-light-r12.init.gradle <<'GROOVY'
          gradle.projectsEvaluated {
              def server = gradle.rootProject.project(':folia-server')
              def qaDir = new File(gradle.rootProject.buildDir, 'ore-light-r12-qa')
              def cp = server.sourceSets.main.runtimeClasspath
              def sourcePaths = [
                  'qa/ore-light-r12/UpperOreLightR12Smoke.java',
                  'qa/neveroverworld-field-r12/FieldPolicyR12Test.java',
                  'qa/neveroverworld-field-r12/FieldR12Smoke.java',
                  'qa/neveroverworld-trees-r1/TreePreservationSmoke.java',
                  'qa/neveroverworld-field-r10/VillageFoundationSmoke.java',
                  'qa/neveroverworld-field-r11/FloodBoundarySmoke.java',
                  'qa/neveroverworld-desert-r1/DesertR1Smoke.java',
                  'qa/neveroverworld-desert-r1/SandstormR1Smoke.java',
                  'qa/nevernether-r15/NeverNetherFieldCleanupR15Smoke.java'
              ]
              def compileQa = server.tasks.register('oreLightR12QaCompile', JavaCompile) {
                  dependsOn server.tasks.named('classes')
                  source server.files(sourcePaths.collect { new File(gradle.rootProject.projectDir, '../../' + it) })
                  destinationDirectory = qaDir
                  classpath = cp
                  options.release = 25
              }
              [
                  oreLightR12Schedule:'net.minecraft.world.level.chunk.UpperOreLightR12Smoke',
                  oreLightR12Policy:'net.minecraft.world.level.chunk.FieldPolicyR12Test',
                  oreLightR12Native:'net.minecraft.world.level.chunk.FieldR12Smoke',
                  oreLightR12Trees:'net.minecraft.world.level.chunk.TreePreservationSmoke',
                  oreLightR12Village:'net.minecraft.world.level.levelgen.structure.VillageFoundationSmoke',
                  oreLightR12Boundary:'net.minecraft.world.level.chunk.FloodBoundarySmoke',
                  oreLightR12Desert:'net.minecraft.world.level.chunk.DesertR1Smoke',
                  oreLightR12Sandstorm:'net.minecraft.server.level.SandstormR1Smoke',
                  oreLightR12Nether:'net.minecraft.world.level.levelgen.placement.NeverNetherFieldCleanupR15Smoke'
              ].each { taskName, className ->
                  server.tasks.register(taskName, JavaExec) {
                      dependsOn compileQa
                      classpath = cp + server.files(qaDir)
                      mainClass = className
                      jvmArgs '-ea'
                  }
              }
          }
          GROOVY
          (cd .work/Folia && ./gradlew :folia-server:compileJava :folia-server:oreLightR12Schedule :folia-server:oreLightR12Policy :folia-server:oreLightR12Native :folia-server:oreLightR12Trees :folia-server:oreLightR12Village :folia-server:oreLightR12Boundary :folia-server:oreLightR12Desert :folia-server:oreLightR12Sandstorm :folia-server:oreLightR12Nether -I ../ore-light-r12.init.gradle --no-configuration-cache --stacktrace) 2>&1 | tee artifacts/build-smoke.log
      - name: Record limited scope
        if: always()
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/SOURCE-SHA.txt
          printf '%s\n' 'ORE-LIGHT-R12 explicit source overlay. Native fixtures only, not fresh-world repeatability or density acceptance. Historical paired gate remains failed. No production promotion or ready-server bundle.' > artifacts/SCOPE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeverOverworld-ore-light-r12-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
