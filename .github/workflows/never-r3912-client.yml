name: R3912 enchantment client package
on:
  push:
    branches: ['fix/neveroverworld-r3912-enchantment-client']
    paths: ['qa/field-r3912/**', '.github/workflows/never-r3912-client.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Test input guards and reproducible client packaging
        run: python3 qa/field-r3912/test_client.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10939310250'
          run-id: 36340789810
          github-token: ${{ github.token }}
          path: inputs
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10928009164'
          run-id: 36308250793
          github-token: ${{ github.token }}
          path: debug
          merge-multiple: true
      - name: Compile client and verify exact official Minecraft targets
        run: python3 qa/field-r3912/build_client.py
      - name: Test byte-identical predicate on real loaded enchantment registry
        run: python3 qa/field-r3912/run_registry.py
      - name: Package client addon without any server or world files
        run: python3 qa/field-r3912/package_client.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NeverLand-R39.12-Enchantment-Client-TEST-${{ github.sha }}
          path: client-delivery/
          if-no-files-found: error
          retention-days: 14
      - name: Retain own source and diagnostic reports even after failures
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          out=Path('client-evidence');(out/'source').mkdir(parents=True,exist_ok=True)
          for folder in (Path('qa/field-r3912'),Path('client/neverland-enchantment-ui/src/cc/neverland/client')):
              for p in folder.iterdir():
                  if p.is_file():shutil.copyfile(p,out/'source'/p.name)
          shutil.copyfile('.github/workflows/never-r3912-client.yml',out/'source/never-r3912-client.yml')
          src=Path('client-output')
          if src.exists():
              for p in src.iterdir():
                  if p.is_file() and (p.suffix=='.json' or p.name.endswith('compile.log') or p.name in ('registry-server.log','javac-version.log')):
                      shutil.copyfile(p,out/p.name)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: NeverLand-R39.12-Client-EVIDENCE-${{ github.sha }}
          path: client-evidence/
          if-no-files-found: error
          retention-days: 14
