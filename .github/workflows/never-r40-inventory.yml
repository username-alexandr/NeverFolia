name: R40 exact input inventory
on:
  push:
    branches: ['fix/neveroverworld-r40-water-resources']
    paths: ['.github/workflows/never-r40-inventory.yml', 'qa/field-r40/inspect.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10939310250'
          run-id: 36340789810
          github-token: ${{ github.token }}
          path: baseline
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10928009164'
          run-id: 36308250793
          github-token: ${{ github.token }}
          path: debug
          merge-multiple: true
      - name: Inspect exact sources and same-version original resources
        run: |
          mkdir -p inventory
          set -o pipefail
          python3 qa/field-r40/inspect.py 2>&1 | tee inventory/command.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R40-INPUT-INVENTORY-${{ github.sha }}
          path: inventory/
          retention-days: 14
          if-no-files-found: error
