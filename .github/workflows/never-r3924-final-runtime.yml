name: R3924 final integrated runtime acceptance
on:
  push:
    branches: ['qa/neverfolia-r3924-manual-candidate']
    paths:
      - 'qa/field-r3922/run_integrated.py'
      - '.github/workflows/never-r3924-final-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  field:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Download exact R3924 compiled NeverFolia
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '11051216037'
          run-id: 36604690977
          github-token: ${{ github.token }}
          path: swift-input
          merge-multiple: true
      - name: Download exact R3924 effective Overworld pack
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '11046608022'
          run-id: 36597924509
          github-token: ${{ github.token }}
          path: resource-input
          merge-multiple: true
      - name: Download proven NeverNether pack
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10963935012'
          run-id: 36407606753
          github-token: ${{ github.token }}
          path: ice-input
          merge-multiple: true
      - name: Run R3924 72-chunk water/ice/enchantment regression
        env:
          R3922_CORE_SHA: '8e3481d8ccb60fed2d2f07c29a38f1ece3bf09ab76476edaee8fb61c2f385f79'
          R3922_OW_SHA: '9b6e37db1a77188036e055913e192e9fe13b4e9a549b513e3270551de9792105'
          R3922_NN_SHA: '5e47f953cadbd5451b04d1682642417c9a40c726cf06e935c02cecdcb5eb2a10'
          R3922_CORE_NAME: 'NeverFolia-26.2-0.1.0-dev-f9f98cd.jar'
          R3922_OW_NAME: 'NeverOverworld-R3924-Effective.zip'
          R3922_NN_NAME: 'NeverNether.zip'
        run: |
          set -euo pipefail
          python3 qa/field-r3922/run_integrated.py
      - name: Verify explicit R3924 acceptance contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('artifacts-r3922/summary.json').read_text())
          assert s['pass'] is True
          assert s['targets']==72
          assert s['comparisons']['off_vs_candidate']['surface_fill_violations']==0
          assert s['comparisons']['off_vs_candidate']['protected_changed']==0
          assert s['candidate_restart_water_hash_equal'] is True
          assert s['reverse_repair_signature_equal'] is True
          assert s['isolated_air']['candidate']==0
          assert s['isolated_ice']['candidate']==0
          print('R3924_FINAL_CONTRACT PASS')
          PY
      - name: Preserve exact runtime evidence
        if: always()
        run: |
          mkdir -p artifacts-r3924-final/source
          cp -a artifacts-r3922/. artifacts-r3924-final/ 2>/dev/null || true
          cp qa/field-r3922/run_integrated.py artifacts-r3924-final/source/
          cp qa/field-r395/R395QaPlugin.java artifacts-r3924-final/source/
          cp .github/workflows/never-r3924-final-runtime.yml artifacts-r3924-final/source/workflow.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R3924-FINAL-RUNTIME-${{ github.sha }}
          path: artifacts-r3924-final/
          retention-days: 14
          if-no-files-found: error
