name: R3916 integrated content repair
on:
  push:
    branches: ['fix/neveroverworld-r3916-integrated-content']
    paths: ['qa/field-r3915/**', 'qa/field-r3916/**', '.github/workflows/never-r3916-integrated.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r3916-integrated-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Test cumulative inputs and refusal of stale or partial deltas
        run: |
          python3 qa/field-r3915/test_combine.py
          python3 qa/field-r3915/test_restore.py
          python3 -m unittest discover -s qa/field-r3914 -p 'test_*.py' -v
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10963935012'
          run-id: '36407606753'
          github-token: ${{ github.token }}
          path: inputs
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10967789179'
          run-id: '36417504719'
          github-token: ${{ github.token }}
          path: cart-input
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10968482107'
          run-id: '36419010757'
          github-token: ${{ github.token }}
          path: swift-input
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10928009164'
          run-id: '36308250793'
          github-token: ${{ github.token }}
          path: debug
          merge-multiple: true
      - name: Preserve both cumulative fixes and repair exact authored NPC joints
        run: python3 qa/field-r3915/combine_content.py
      - name: Audit cumulative resource graph without accepting remaining omissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,importlib.util,sys
          spec=importlib.util.spec_from_file_location('r3916_audit','scripts/audit-neveroverworld-r39-resources.py')
          audit=importlib.util.module_from_spec(spec);sys.modules[spec.name]=audit;spec.loader.exec_module(audit)
          jars=list(Path('swift-input').rglob('server-r3915.jar'));packs=list(Path('inputs').rglob('NeverOverworld.zip'))
          if len(jars)!=1 or len(packs)!=1:raise ValueError('Ambiguous actual audit inputs')
          before=audit.audit_files(jars[0],packs[0]);after=audit.audit_files(jars[0],Path('artifacts/NeverOverworld-R3915-Combined.zip'))
          Path('artifacts/resource-before.json').write_text(json.dumps(before,indent=2)+'\n')
          Path('artifacts/resource-after.json').write_text(json.dumps(after,indent=2)+'\n')
          build=json.loads(Path('artifacts/combined-content.json').read_text())
          expected={p.removeprefix('data/').replace('/structure/',':',1).removesuffix('.nbt') for p in build['added_templates']}
          a={(r['kind'],r['id']) for r in before['missing']};b={(r['kind'],r['id']) for r in after['missing']}
          if before['errors'] or after['errors']:raise ValueError('Resource parsing errors')
          if a-b!={('template',i) for i in expected} or b-a:raise ValueError('Unexpected graph delta')
          if before['roots']!=after['roots'] or after['counts']['missing_pools']!=0:raise ValueError('Root or pool regression')
          print('R3916_RESOURCE_DELTA',json.dumps({'before':before['counts'],'after':after['counts'],'remaining':sorted(b),'full_resources_accepted':not b,'production_accepted':False}),flush=True)
          PY
      - name: Resolve exact Java runtime libraries
        run: python3 qa/field-r3915/prepare_runtime.py
      - name: Real cumulative cart assembly, fresh restarts and connected-player mechanics
        run: python3 qa/field-r3915/run_combined.py
      - name: Preserve executed source and all failures
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,os,shutil,hashlib
          out=Path('artifacts');source=out/'r3916-source';source.mkdir(parents=True,exist_ok=True)
          for p in Path('qa/field-r3915').iterdir():
              if p.is_file():shutil.copyfile(p,source/p.name)
          shutil.copyfile('.github/workflows/never-r3916-integrated.yml',source/'workflow.yml')
          (out/'r3916-provenance.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'production_accepted':False,'user_world_changed':False,'source_sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in source.iterdir() if p.is_file()}},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R3916-INTEGRATED-EVIDENCE-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
