name: R40 scoped frozen-ocean producer build
on:
  push:
    branches: ['fix/neveroverworld-r40-integrated-worldgen']
    paths: ['native/overworld-r40/NeverOverworldIceR40.java', 'qa/field-r40/ice_patch.py', 'qa/field-r40/build_with_ice.py', '.github/workflows/never-r40-ice-build.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '25'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '10939310250', run-id: 36340789810, github-token: '${{ github.token }}', path: baseline, merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '10928009164', run-id: 36308250793, github-token: '${{ github.token }}', path: debug, merge-multiple: true}
      - name: Compile scoped producers, preserve prior hotfixes and execute pure contracts
        run: |
          mkdir -p artifacts
          set -o pipefail
          python3 qa/field-r40/build_with_ice.py 2>&1 | tee artifacts/ice-build-command.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R40-ICE-COMPILED-NOT-ACCEPTED-${{ github.sha }}
          path: |
            artifacts/
            candidate/
            qa/field-r40/build_with_ice.py
            qa/field-r40/ice_patch.py
            native/overworld-r40/
          retention-days: 14
          if-no-files-found: error
