name: FIELD-R39 resource acceptance
on:
  push:
    branches: ['wip/neveroverworld-r37-continuation']
    paths:
      - '.github/workflows/never-r38-resource-followup.yml'
      - 'scripts/audit-neveroverworld-r39-resources.py'
      - 'scripts/repair-neveroverworld-r39-resources.py'
      - 'scripts/tests/test_r39_resource_audit.py'
      - 'qa/field-r39/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test alias contract and negative gates
        run: |
          mkdir -p artifacts
          set -o pipefail
          python3 scripts/tests/test_r39_resource_audit.py 2>&1 | tee artifacts/r39-unit-tests.txt
      - uses: actions/download-artifact@v4
        with:
          name: NeverFolia-R38-CANDIDATE-c6e522c65e5ecd0852c27d724c652189464f51cc
          run-id: 36308250793
          github-token: ${{ github.token }}
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: R38-resource-followup-5e124ea3bd6c35d6812da913a6d091af50426916
          run-id: 36310161205
          github-token: ${{ github.token }}
          path: original-evidence
      - name: Verify exact tested inputs
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          expected={'server.jar':'411f628603ae531216c173fde1dbd8c702effb170889f72e5f2c0f1af81b6a32','NeverOverworld.zip':'32ea5160f0bed3a80cf400c907622c7dbb76a9bb4160e309cacb5d712a8bd9f7','NeverNether.zip':'5e47f953cadbd5451b04d1682642417c9a40c726cf06e935c02cecdcb5eb2a10'}
          for name,value in expected.items():
              with open(Path('candidate',name),'rb') as stream:actual=hashlib.file_digest(stream,'sha256').hexdigest()
              assert actual==value,(name,actual)
          assert json.loads(Path('candidate/r38-live-qa.json').read_text())['pass'] is True
          Path('artifacts/input-checksums.json').write_text(json.dumps(expected,indent=2)+'\n')
          PY
      - name: Audit possible root-local resource closure
        id: closure
        continue-on-error: true
        run: |
          python3 scripts/audit-neveroverworld-r39-resources.py --jar candidate/server.jar --pack candidate/NeverOverworld.zip --report artifacts/r39-resource-closure.json
      - name: Compare original reference candidates and official compatible upstream without modifying packs
        if: always() && steps.closure.outcome != 'skipped'
        run: |
          python3 - <<'PY'
          import hashlib,io,json,urllib.parse,urllib.request,zipfile
          from pathlib import Path
          original=json.loads(Path('original-evidence/r38-resource-source-details.json').read_text())
          audited=json.loads(Path('artifacts/r39-resource-closure.json').read_text())
          old={(r['kind'],r['id']) for r in original['missing']}
          new={(r['kind'],r['id']) for r in audited.get('missing',[])}
          result={'removed_from_naive_report':sorted(old-new),'newly_reached':sorted(new-old),'upstream':{'checked':False}}
          print('NO LONGER REPORTED',json.dumps(result['removed_from_naive_report']))
          print('NEWLY REACHED',json.dumps(result['newly_reached']))
          for row in original['missing']:
              if any(t in row['id'] for t in ('oof_wall4','shepert','bornfire','bonfire','minecraft_empty','cruve','wargon')):
                  print('DIAGNOSTIC CANDIDATES ONLY',json.dumps(row))
          def get(url,limit=32*1024*1024):
              parsed=urllib.parse.urlparse(url)
              assert parsed.scheme=='https' and parsed.hostname in ('api.modrinth.com','cdn.modrinth.com'),url
              request=urllib.request.Request(url,headers={'User-Agent':'NeverFolia-resource-audit/1.0 (https://github.com/username-alexandr/NeverFolia)'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  assert urllib.parse.urlparse(response.url).hostname in ('api.modrinth.com','cdn.modrinth.com'),response.url
                  data=response.read(limit+1)
              assert len(data)<=limit,'Response exceeds limit'
              return data
          try:
              query=urllib.parse.urlencode({'game_versions':json.dumps(['26.2']),'loaders':json.dumps(['datapack'])})
              versions=json.loads(get('https://api.modrinth.com/v2/project/dungeons-and-taverns/version?'+query))
              result['upstream']['available_versions']=[{'id':v['id'],'version_number':v['version_number'],'name':v['name'],'date_published':v['date_published']} for v in versions]
              print('OFFICIAL 26.2 DATAPACK VERSIONS',json.dumps(result['upstream']['available_versions']))
              matches=[v for v in versions if v['version_number'] in ('5.3.2','v5.3.2') and '26.2' in v['game_versions'] and v['version_type']=='release']
              if len(matches)!=1:
                  raise ValueError('An unambiguous official datapack 5.3.2 release was not found; no version guessed')
              version=matches[0]
              files=[f for f in version['files'] if f.get('primary')]
              assert len(files)==1,'Ambiguous primary asset'
              asset=files[0];raw=get(asset['url'],64*1024*1024)
              assert hashlib.sha512(raw).hexdigest()==asset['hashes']['sha512'],'Upstream hash mismatch'
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  names=set(z.namelist())
                  found=[]
                  for kind,name in sorted(new):
                      if kind!='template':continue
                      ns,value=name.split(':',1);path=f'data/{ns}/structure/{value}.nbt'
                      if path in names:found.append({'id':name,'sha256':hashlib.sha256(z.read(path)).hexdigest()})
                  result['upstream'].update({'checked':True,'version':version,'asset_sha256':hashlib.sha256(raw).hexdigest(),'exact_missing_template_matches':found})
                  print('EXACT MISSING TEMPLATE MATCHES IN VERIFIED UPSTREAM',json.dumps(found))
              # The source archive is evidence only; it is NOT installed or imported.
              Path('artifacts/upstream-5.3.2-EVIDENCE-ONLY.zip').write_bytes(raw)
          except Exception as error:
              result['upstream']['error']=repr(error)
              print('UPSTREAM COMPARISON NOT VERIFIED',repr(error))
          Path('artifacts/r39-diagnostic-comparison.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: Preserve exact reports, sources and bounded live evidence
        if: always()
        run: |
          mkdir -p artifacts/sources
          cp scripts/audit-neveroverworld-r39-resources.py scripts/tests/test_r39_resource_audit.py artifacts/sources/
          for name in r38-live-qa.json r38-water-provenance.json READ-FIRST.md ACCEPTANCE-CHECKLIST.md; do
            test ! -f "candidate/$name" || cp "candidate/$name" artifacts/
          done
          test ! -d original-evidence || cp original-evidence/r38-engine-alias-contract.txt artifacts/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R39-resource-acceptance-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
      - name: Resource acceptance gate - red means not releasable
        if: always()
        env:
          CLOSURE_OUTCOME: ${{ steps.closure.outcome }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          path=Path('artifacts/r39-resource-closure.json')
          assert os.environ['CLOSURE_OUTCOME']=='success','Resource audit failed or did not execute; candidate not accepted'
          assert path.is_file() and json.loads(path.read_text())['pass'] is True,'Missing/failed report; candidate not accepted'
          print('Static resource closure accepted; runtime coverage remains separately bounded')
          PY
