name: R40 saved ice and placement source
on:
  push:
    branches: ['fix/neveroverworld-r40-water-resources']
    paths: ['qa/field-r40/diagnose_ice.py', '.github/workflows/never-r40-ice-review.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10928009164'
          run-id: 36308250793
          github-token: ${{ github.token }}
          path: debug
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10937712232'
          run-id: 36337508038
          github-token: ${{ github.token }}
          path: evidence
          merge-multiple: true
      - name: Read exact block IDs and source placement rules
        run: |
          set -o pipefail
          python3 qa/field-r40/diagnose_ice.py 2>&1 | tee ice-review-command.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R40-ICE-REVIEW-${{ github.sha }}
          path: |
            ice-review/
            ice-review-command.log
          retention-days: 14
          if-no-files-found: error
