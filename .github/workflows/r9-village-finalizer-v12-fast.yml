name: R9 Village V12 Finalizer Fast

on:
  push:
    branches:
      - qa/r9-village-finalizer-v12
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r9-village-finalizer-v12-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate corrected V5 baseline
        run: python3 ./scripts/tune-never-overworld-village-locate-r9-v5.py --self-test
      - name: Validate V12 production finalizer
        run: python3 ./scripts/finalize-never-overworld-village-strict-search-r9.py --self-test
