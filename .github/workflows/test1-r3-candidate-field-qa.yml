name: TEST1 R3 Candidate Field QA

on:
  workflow_run:
    workflows:
      - Build NeverFolia
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  vanilla-structure-qa:
    name: R3 flooded vanilla structure field gate
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'wip/neverfolia-test1-r3-candidate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout exact R3 candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Download exact successful candidate artifact
        uses: actions/download-artifact@v5
        with:
          name: NeverFolia-${{ github.event.workflow_run.head_sha }}
          path: candidate-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify flooded vanilla structure availability and placement
        run: |
          set -euo pipefail
          JAR="$(find candidate-artifact -type f -name 'NeverFolia-*.jar' | sort | head -n 1)"
          PACK="$(find candidate-artifact -type f -name 'NeverOverworld-Core-*.zip' | sort | head -n 1)"
          test -n "${JAR}"
          test -n "${PACK}"
          chmod +x ./scripts/probe-never-overworld-vanilla-field-structures.sh
          ./scripts/probe-never-overworld-vanilla-field-structures.sh "${JAR}" "${PACK}"

      - name: Upload R3 field diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TEST1-R3-field-qa-${{ github.event.workflow_run.head_sha }}
          path: |
            artifacts/NeverOverworld-vanilla-field-structures.json
            overworld-vanilla-field-structures-test/locate-results.tsv
            overworld-vanilla-field-structures-test/server.log
          if-no-files-found: warn
          retention-days: 30
