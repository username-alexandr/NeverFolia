name: R3938 NeverNether fast locate
on:
  push:
    branches: ['fix/nevernether-r3938-fast-locate']
    paths:
      - 'scripts/apply-never-nether-placement-hook.py'
      - 'native/nevernether-r3938/**'
      - 'qa/field-r3938/**'
      - '.github/workflows/never-r3938-fast-locate.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: r3938-fast-locate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '25'}

      - name: Download accepted R39.37 baseline
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '11189555482'
          run-id: 36913694134
          github-token: '${{ github.token }}'
          path: baseline-r3937
          merge-multiple: true

      - name: Build R39.38 fast-locate kernel
        id: build
        run: |
          mkdir -p artifacts
          python3 -m py_compile scripts/apply-never-nether-placement-hook.py qa/field-r3938/*.py
          set -o pipefail
          python3 qa/field-r3938/build.py 2>&1 | tee artifacts/r3938-build-command.log

      - name: Runtime fast-locate QA
        id: runtime
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          python3 qa/field-r3938/runtime.py 2>&1 | tee artifacts/r3938-runtime-command.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R3938-EVIDENCE-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

      - name: Package manual test
        if: steps.build.outcome == 'success' && steps.runtime.outcome == 'success'
        run: python3 qa/field-r3938/package.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.build.outcome == 'success' && steps.runtime.outcome == 'success'
        with:
          name: NeverFolia-R39.38-Fast-Locate-TEST-${{ github.sha }}
          path: test-kit-r3938/
          retention-days: 14
          if-no-files-found: error

      - name: Require accepted automated gates
        if: always()
        env:
          BUILD: '${{ steps.build.outcome }}'
          RUNTIME: '${{ steps.runtime.outcome }}'
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          assert os.environ['BUILD']=='success' and os.environ['RUNTIME']=='success'
          b=json.loads(Path('artifacts/build-r3938.json').read_text())
          r=json.loads(Path('artifacts/runtime-r3938.json').read_text())
          assert b['build_pass'] is True and r['pass'] is True
          assert b['generation_and_locate_share_resolver'] is True
          assert b['resolve_start_y_full_base_column_scan_removed'] is True
          assert b['noise_chunk_interpolation_removed'] is True
          assert b['coarse_vertical_step'] == 8
          assert b['exact_jigsaw_assembly_during_locate'] is False
          assert b['root_generation_stub_confirmation'] is True
          assert b['existing_fast_locate_engine_reused'] is True
          assert r['fast_locate']['elapsed_ms'] < 4000
          assert r['fast_locate']['generated_nether_keep'] is True
          print('R39.38 NeverNether fast-locate gates passed.')
          PY
