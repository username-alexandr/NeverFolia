name: NeverNether R9 Ore API Probe
on:
  push:
    branches: [wip/nevernether-field-r1]
    paths: [.github/workflows/never-nether-r9-api.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Export exact generated API sources for inspection
        run: |
          set -euo pipefail
          git config --global user.email actions@github.com
          git config --global user.name 'NeverFolia CI'
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/SOURCE-SHA.txt
          bash scripts/prepare-upstream.sh
          test "$(git -C .work/Folia rev-parse HEAD)" = 14b7fee5c866fca9a40ede4a58998fb928140f65
          bash scripts/apply-folia-patches-ci.sh .work/Folia
          bash scripts/apply-neverfolia-post-patches.sh > artifacts/production-transformers.log 2>&1
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          root=Path('.work/Folia/folia-server/src/minecraft/java')
          files=['net/minecraft/world/level/levelgen/feature/'+name+'.java' for name in ['OreFeature','ScatteredOreFeature','BlockColumnFeature','ReplaceBlobsFeature']]
          files += ['net/minecraft/world/level/levelgen/feature/configurations/OreConfiguration.java', 'net/minecraft/world/level/levelgen/structure/templatesystem/TagMatchTest.java']
          manifest={}
          with zipfile.ZipFile('artifacts/ore-api.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in files:
                  raw=(root/name).read_bytes();z.writestr(name,raw);manifest[name]=hashlib.sha256(raw).hexdigest()
          Path('artifacts/API-SHA256.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
          printf '%s\n' 'Inspection only; no candidate worldgen changes, runtime acceptance or release.' > artifacts/SCOPE.txt
          (cd artifacts && sha256sum *.zip *.txt *.json *.log > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: NeverNether-r9-ore-api-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
