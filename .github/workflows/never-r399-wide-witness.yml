name: R399 wider positive ocean witness
on:
  push:
    branches: ['fix/neveroverworld-r399-wide-ocean-witness']
    paths: ['native/overworld-r399/**', 'qa/field-r399/**', '.github/workflows/never-r399-wide-witness.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r399-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10933533919'
          run-id: 36325173594
          github-token: ${{ github.token }}
          path: baseline
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10928009164'
          run-id: 36308250793
          github-token: ${{ github.token }}
          path: debug
          merge-multiple: true
      - name: Real Java 25 build on R396 and fifty solver cases
        id: build
        run: |
          mkdir -p artifacts
          set -o pipefail
          python3 qa/field-r399/build.py 2>&1 | tee artifacts/build-command.log
      - name: Matched order on-off controls, reverse and restart
        id: runtime
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 qa/field-r399/run.py 2>&1 | tee artifacts/runtime-command.log
      - name: Retain exact inputs and source even when a check fails
        if: always()
        run: |
          mkdir -p artifacts/source
          cp -R native/overworld-r399 qa/field-r399 artifacts/source/
          cp .github/workflows/never-r399-wide-witness.yml artifacts/source/
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          Path('artifacts/provenance.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'production_accepted':False,'source_base':'aaa1097f575809343412d82f2956452afdb83a38','binary_base':'tested R396'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R399-EVIDENCE-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
      - name: Stage diagnostic binaries only after successful scoped checks
        if: steps.runtime.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json,shutil,hashlib
          from pathlib import Path
          r=json.loads(Path('artifacts/r399-runtime.json').read_text())
          assert r['scope_pass'] is True
          for n in ('build.json','r399-runtime.json','provenance.json'):
              shutil.copyfile(Path('artifacts',n),Path('candidate',n))
          Path('candidate/READ-FIRST.txt').write_text('R399 diagnostic candidate, NOT production. Java 25. Exact R396 base + 5x5 AIR-only reachability and completed FEATURES radius 3.\nEnable only in a NEW test world with -Dneverfolia.r399OceanClosure=true. Saved worlds are not repaired.\nThe matching scheduler dependency is part of this JAR even with closure disabled. R397 cross-order failure remains documented.\nDatapacks unchanged; ice and client UI not fixed. Review replayable witnesses and runtime.json before acceptance.\n')
          Path('candidate/SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(Path('candidate').glob('*')) if p.is_file()))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.runtime.outcome == 'success'
        with:
          name: R399-BOUNDED-CANDIDATE-${{ github.sha }}
          path: candidate/
          retention-days: 14
          if-no-files-found: error
      - name: Preserve independent acceptance boundaries
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          RUNTIME: ${{ steps.runtime.outcome }}
        run: |
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          assert os.environ['BUILD']=='success' and os.environ['RUNTIME']=='success','Build/runtime failed; evidence only'
          r=json.loads(Path('artifacts/r399-runtime.json').read_text())
          assert r['scope_pass'] is True and r['global_generation_accepted'] is False
          print('Scoped AIR-only and natural mine checks passed; no global generation or cross-order acceptance claimed.')
          PY
