name: Validate NeverNether

on:
  push:
    branches:
      - develop
      - 'feature/never-nether-worldgen'
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: NeverNether fast validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout NeverFolia repository
        uses: actions/checkout@v6

      - name: Validate worldgen and placement specification
        run: python3 ./scripts/validate-never-nether-spec.py

      - name: Self-test structure importer
        run: python3 ./scripts/build-never-nether-structure-pack.py --self-test

      - name: Self-test structure safety hardener
        run: python3 ./scripts/harden-never-nether-structure-pack.py --self-test

      - name: Self-test TEST1 source lock and pack pipeline
        run: python3 ./scripts/build-never-nether-test1-pack.py --self-test

      - name: Self-test startup fingerprint guard transformer
        run: python3 ./scripts/apply-never-nether-fingerprint-guard.py --self-test

      - name: Self-test Basalt Columns ownership transformer
        run: python3 ./scripts/apply-never-nether-basalt-columns-ownership.py --self-test

      - name: Self-test canonical chunk hasher
        run: python3 ./scripts/hash-never-nether-chunks.py --self-test

      - name: Self-test chunk component diff
        run: python3 ./scripts/diff-never-nether-chunks.py --self-test

      - name: Self-test placement log analyzer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nevernether-fast
          cat > /tmp/nevernether-fast/placement.log <<'EOF'
          [NeverNetherPlacement] pool=neverfolia:never_nether/start/nova_structures__nether_keep profile=main_surface mode=CAVERN_FLOOR chunk=10,-4 result=144 reason=preferred_band
          [NeverNetherPlacement] pool=neverfolia:never_nether/start/nova_structures__nether_keep profile=main_surface mode=CAVERN_FLOOR chunk=20,-4 result=REJECT reason=no_cavern_floor
          [NeverNetherPlacement] pool=neverfolia:never_nether/start/repurposed_structures__monument_nether profile=lava_sea_landmark mode=LAVA_BASIN chunk=40,40 result=REJECT reason=lava_basin_too_small
          [NeverNetherPlacement] pool=neverfolia:never_nether/start/repurposed_structures__monument_nether profile=lava_sea_landmark mode=LAVA_BASIN chunk=80,80 result=18 reason=lava_basin_floor
          EOF
          python3 ./scripts/analyze-never-nether-placement-log.py \
            /tmp/nevernether-fast/placement.log \
            --json \
            --output /tmp/nevernether-fast/placement-summary.json \
            > /tmp/nevernether-fast/placement-stdout.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path('/tmp/nevernether-fast/placement-summary.json').read_text())
          assert summary['decisions'] == 4
          assert summary['accepted'] == 2
          assert summary['rejected'] == 2
          assert summary['accept_rate'] == 0.5
          assert summary['rejection_reasons']['lava_basin_too_small'] == 1
          assert summary['rejection_reasons']['no_cavern_floor'] == 1
          assert summary['by_structure']['nova_structures:nether_keep']['accepted_y_median'] == 144
          assert summary['by_structure']['repurposed_structures:monument_nether']['accepted_y_median'] == 18
          print('[NeverFolia][NeverNether placement analyzer] SELF-TEST OK')
          PY

      - name: Build, fingerprint and inspect NeverNether Core pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nevernether-fast
          python3 ./scripts/build-never-nether-core-pack.py \
            --output /tmp/nevernether-fast/NeverNether-Core.zip
          python3 ./scripts/fingerprint-never-nether-pack.py \
            --input /tmp/nevernether-fast/NeverNether-Core.zip \
            --inject
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk(child)

          pack = Path('/tmp/nevernether-fast/NeverNether-Core.zip')
          with zipfile.ZipFile(pack) as zf:
              manifest = json.loads(zf.read('nevernether-core-manifest.json'))
              dimension = json.loads(zf.read('data/minecraft/dimension_type/the_nether.json'))
              noise = json.loads(zf.read('data/minecraft/worldgen/noise_settings/nether.json'))
              delta_pf = json.loads(zf.read('data/minecraft/worldgen/placed_feature/delta.json'))
              root_fp = json.loads(zf.read('nevernether-worldgen-fingerprint.json'))
              resource_fp = json.loads(zf.read('data/neverfolia/nevernether/worldgen_fingerprint.json'))

          assert manifest['generated_min_y'] == -128
          assert manifest['generated_max_y'] == 383
          assert manifest['roof_build_min_y'] == 384
          assert manifest['roof_build_max_y'] == 895
          assert manifest['lava_level'] == 32
          assert manifest['replaced_vanilla_placed_features'] == ['delta']
          assert manifest['deterministic_delta_mode'] == 'surface_noise_threshold_3d_v1'
          assert manifest['basalt_columns_mode'] == 'vanilla_geometry_chunk_owned_v1'
          assert dimension['min_y'] == -128
          assert dimension['height'] == 1024
          assert noise['noise']['min_y'] == -128
          assert noise['noise']['height'] == 512
          assert noise['sea_level'] == 32
          assert delta_pf['placement'][0] == {'type': 'minecraft:count', 'count': 0}

          material_nodes = list(walk(noise['surface_rule']))
          assert not any(node.get('type') == 'minecraft:noise_gradient' for node in material_nodes)
          thresholds = [
              node for node in material_nodes
              if node.get('type') == 'minecraft:noise_threshold'
              and node.get('noise') == 'neverfolia:never_nether/delta_surface'
          ]
          assert len(thresholds) == 2
          assert all(node.get('is_3d') is True for node in thresholds)
          assert sorted(node['min_threshold'] for node in thresholds) == [0.35, 0.55]

          assert root_fp == resource_fp
          assert root_fp['worldgen_id'] == 'NN-DEV-1'
          assert root_fp['algorithm'] == 'sha256-path-and-content-v1'
          print('[NeverFolia][NeverNether core] FAST CHECK OK')
          PY
